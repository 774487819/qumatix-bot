              }
              if (enterAtMinuteEndOnly != null) {
                _enterAtMinuteEndOnly = enterAtMinuteEndOnly;
              }
              if (asset != null && asset != _selectedAsset) {
                _selectedAsset = asset;
                _priceHistory.clear();
                _aiPatternMemory.clear();
                _syntheticCandles.clear();
                _crowdCallVolume = 0.0;
                _crowdPutVolume = 0.0;
