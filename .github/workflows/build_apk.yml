                          initialSettings: InAppWebViewSettings(
                            javaScriptEnabled: true,
                            domStorageEnabled: true,
                            databaseEnabled: true,
                            userAgent: "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36",
                          ),
                          onWebViewCreated: (controller) {
                            _webViewController = controller;
                            context.read<QuotexService>().attachWebViewController(controller);
                          },
                          onLoadStart: (controller, url) {
                            if (mounted) {
                              setState(() {
                                _isLoading = true;
                                _webError = null;
                              });
                            }
                          },
                          onLoadStop: (controller, url) async {
                            await controller.evaluateJavascript(source: _wsHookScript);
                            if (mounted) {
                              setState(() => _isLoading = false);
                            }
                            await _extractAndConnect(manualTrigger: false);
