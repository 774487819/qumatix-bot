name: Build QuMatix APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter Android Project Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name qumatix_bot --platforms=android --org com.qumatix.app .
          fi
          rm -rf test

      - name: Generate pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: qumatix_bot
          description: "QuMatix Pro AI v6.0 - Local Neural AI & Instant Trade Execution"
          publish_to: 'none'
          version: 6.0.0+9

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.2
            flutter_inappwebview: ^6.1.5
            shared_preferences: ^2.2.3
            cupertino_icons: ^1.0.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Write Full AndroidManifest.xml with Internet Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="QuMatix Pro AI"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Generate quotex_service.dart (Local Neural AI Engine + Guaranteed Trade Execution)
        run: |
          mkdir -p lib/services
          cat << 'EOF' > lib/services/quotex_service.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'package:flutter/foundation.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';

          class _AiPatternSample {
            final List<double> features;
            final bool wentUp;
            _AiPatternSample(this.features, this.wentUp);
          }

          class QuotexService extends ChangeNotifier {
            WebSocket? _directSocket;
            InAppWebViewController? _webViewController;
            Timer? _webSyncTimer;
            Timer? _scannerTimer;
            Timer? _tradeLifecycleTimer;
            Timer? _pingTimer;

            bool _isConnected = false;
            bool _isAuthenticated = false;
            bool _isAutoTrading = false;
            bool _isTradeOpen = false;

            double _balance = 0.0;
            double _initialSessionBalance = 0.0;
            String _balanceText = "\$0.00";
            String _accountType = "demo";
            String _currentDomain = "market-qx.pro";
            String _cookieHeader = "";

            String _selectedAsset = "AUTO_CHART";
            String _chartDisplayPair = "EUR/USD (OTC)";
            int _tradeDuration = 60;
            double _baseAmount = 1.0;
            double _currentTradeAmount = 1.0;
            bool _useMartingale = true;
            double _martingaleMultiplier = 2.0;
            double _takeProfitTarget = 50.0;
            double _stopLossLimit = 25.0;
            String _strategy = "local_neural_ai";

            // ميزة قوة الإشارة المطلوبة (70% - 95%)
            int _minSignalStrength = 80;
            int _currentSignalStrength = 0;
            String _currentSignalDirection = "CALL";
            int _agreedIndicatorsCount = 0;
            int _aiLearnedPatternsCount = 0;

            // المؤشرات الفنية الستة + مخرجات الشبكة العصبية المحلية
            double _lastPrice = 0.0;
            double _ema5 = 0.0;
            double _ema13 = 0.0;
            double _ema26 = 0.0;
            double _currentRsi = 50.0;
            double _macdHistogram = 0.0;
            double _stochasticK = 50.0;
            double _bollingerUpper = 0.0;
            double _bollingerLower = 0.0;
            double _priceMomentum = 0.0;
            double _aiNeuralProbability = 0.5;

            // أوزان الشبكة العصبية المحلية القابلة للتكيف (Adaptive Local Neural Weights)
            final List<double> _neuralWeights = [
              0.28, // RSI Reversal / Momentum
              0.24, // Fast/Medium EMA Alignment
              0.18, // Medium/Slow EMA Trend
              0.20, // MACD Histogram Acceleration
              0.22, // Bollinger Band %B Position
              0.16, // Stochastic Oscillator %K
              0.25, // Micro 3-Tick Velocity
              0.19, // 8-Tick Trend Momentum
              0.21, // Bull/Bear Candle Pressure Ratio
              0.15, // Price 2nd-Derivative Acceleration
            ];

            final List<_AiPatternSample> _aiPatternMemory = [];
            final List<double> _priceHistory = [];
            final List<String> _logs = [];

            String _lastSignal = "جاهز لتحليل السوق عبر الذكاء الاصطناعي...";
            int _totalTrades = 0;
            int _wonTrades = 0;
            int _lostTrades = 0;

            double _activeTradeEntryPrice = 0.0;
            double _activeTradeBalanceBefore = 0.0;
            String _activeTradeDirection = "call";
            String _activeTradeAsset = "";
            double _activeTradeAmount = 1.0;
            int _remainingSeconds = 0;

            bool get isConnected => _isConnected;
            bool get isAuthenticated => _isAuthenticated;
            bool get isAutoTrading => _isAutoTrading;
            bool get isTradeOpen => _isTradeOpen;
            int get remainingSeconds => _remainingSeconds;
            double get balance => _balance;
            String get balanceText => _balanceText;
            double get netProfit => _initialSessionBalance > 0 ? (_balance - _initialSessionBalance) : 0.0;
            String get accountType => _accountType;
            String get currentDomain => _currentDomain;
            String get selectedAsset => _selectedAsset;
            String get activeAsset => _selectedAsset == "AUTO_CHART" ? _chartDisplayPair : _selectedAsset;
            int get tradeDuration => _tradeDuration;
            double get baseAmount => _baseAmount;
            double get currentTradeAmount => _currentTradeAmount;
            bool get useMartingale => _useMartingale;
            double get martingaleMultiplier => _martingaleMultiplier;
            double get takeProfitTarget => _takeProfitTarget;
            double get stopLossLimit => _stopLossLimit;
            String get strategy => _strategy;
            int get minSignalStrength => _minSignalStrength;
            int get currentSignalStrength => _currentSignalStrength;
            String get currentSignalDirection => _currentSignalDirection;
            int get agreedIndicatorsCount => _agreedIndicatorsCount;
            int get aiLearnedPatternsCount => _aiLearnedPatternsCount;
            double get lastPrice => _lastPrice;
            double get emaFast => _ema5;
            double get emaSlow => _ema13;
            double get currentRsi => _currentRsi;
            double get macdHistogram => _macdHistogram;
            double get stochasticK => _stochasticK;
            double get priceMomentum => _priceMomentum;
            int get ticksCount => _priceHistory.length;
            String get lastSignal => _lastSignal;
            int get totalTrades => _totalTrades;
            int get wonTrades => _wonTrades;
            int get lostTrades => _lostTrades;
            List<String> get logs => List.unmodifiable(_logs);

            static String toServerSymbol(String displayAsset) {
              final clean = displayAsset.trim();
              if (clean.contains("Gold")) return "XAUUSD_otc";
              if (clean.contains("Silver")) return "XAGUSD_otc";
              if (clean.contains("UKBrent")) return "UKBrent_otc";
              if (clean.contains("USCrude")) return "USCrude_otc";
              if (clean.contains("Bitcoin")) return "BTCUSD_otc";
              if (clean.contains("Ethereum")) return "ETHUSD_otc";
              final isOtc = clean.toUpperCase().contains("OTC");
              final letters = clean.replaceAll(RegExp(r'\(.*?\)'), '').replaceAll(RegExp(r'[^A-Za-z]'), '').toUpperCase();
              if (letters.length >= 6) {
                final pair = letters.substring(0, 6);
                return isOtc ? "${pair}_otc" : pair;
              }
              return isOtc ? "${letters}_otc" : letters;
            }

            static String normalizeAssetKey(String raw) {
              return raw
                  .replaceAll('(OTC)', 'OTC')
                  .replaceAll('_otc', 'OTC')
                  .replaceAll(RegExp(r'[^A-Za-z0-9]'), '')
                  .toUpperCase();
            }

            void attachWebViewController(InAppWebViewController controller) {
              _webViewController = controller;
            }

            void updateSettings({
              String? asset,
              int? duration,
              double? baseAmount,
              bool? useMartingale,
              double? martingaleMultiplier,
              double? takeProfit,
              double? stopLoss,
              String? strategy,
              bool? isRealAccount,
              int? minSignalStrength,
            }) {
              if (isRealAccount != null) {
                _accountType = isRealAccount ? "real" : "demo";
              }
              if (minSignalStrength != null) {
                _minSignalStrength = minSignalStrength;
              }
              if (asset != null && asset != _selectedAsset) {
                _selectedAsset = asset;
                _priceHistory.clear();
                _aiPatternMemory.clear();
                _lastPrice = 0.0;
                _currentSignalStrength = 0;
                if (_isConnected && asset != "AUTO_CHART") {
                  _subscribeServerToAsset(asset);
                }
              }
              if (duration != null) _tradeDuration = duration;
              if (baseAmount != null && baseAmount > 0) {
                _baseAmount = baseAmount;
                if (!_isAutoTrading && !_isTradeOpen) {
                  _currentTradeAmount = baseAmount;
                }
              }
              if (useMartingale != null) _useMartingale = useMartingale;
              if (martingaleMultiplier != null && martingaleMultiplier > 1.0) {
                _martingaleMultiplier = martingaleMultiplier;
              }
              if (takeProfit != null && takeProfit > 0) _takeProfitTarget = takeProfit;
              if (stopLoss != null && stopLoss > 0) _stopLossLimit = stopLoss;
              if (strategy != null && strategy != _strategy) {
                _strategy = strategy;
                if (_priceHistory.length >= 5) {
                  _calculateAllIndicatorsAndStrength();
                }
              }
              _refreshSignalBadge();
              notifyListeners();
            }

            void _refreshSignalBadge() {
              String stratName = "AI الذكاء الاصطناعي";
              if (_strategy == "qumatix_rsi_ema") stratName = "QuMatix";
              if (_strategy == "trend_momentum") stratName = "Trend Pro";
              if (_strategy == "reversal_sniper") stratName = "Sniper";

              if (_priceHistory.length < 5) {
                _lastSignal = "$stratName | جاري جلب أسعار السيرفر...";
                return;
              }
              _lastSignal = "$stratName: $_currentSignalDirection ($_currentSignalStrength%)";
            }

            void addLog(String message) {
              final now = DateTime.now();
              final time = "${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')}";
              _logs.insert(0, "[$time] $message");
              if (_logs.length > 150) _logs.removeLast();
              notifyListeners();
            }

            Future<void> connect({
              required String ssidToken,
              bool isRealAccount = false,
              String domain = "market-qx.pro",
              String cookieHeader = "",
              String? detectedBalance,
            }) async {
              _accountType = isRealAccount ? "real" : "demo";
              _currentDomain = domain;
              _cookieHeader = cookieHeader;

              if (detectedBalance != null && detectedBalance.isNotEmpty) {
                _parseAndSetBalance(detectedBalance);
              }

              _isConnected = true;
              _isAuthenticated = true;
              addLog("تم الاتصال بالسيرفر ($domain) وتفعيل الذكاء الاصطناعي المحلي 🧠✔");
              notifyListeners();

              await _subscribeServerToAsset(activeAsset);
              _startWebSyncTimer();
            }

            Future<void> _subscribeServerToAsset(String displayAsset) async {
              if (displayAsset == "AUTO_CHART") return;
              final sym = toServerSymbol(displayAsset);
              final baseSym = sym.replaceAll('_otc', '');

              if (_webViewController != null) {
                try {
                  await _webViewController!.evaluateJavascript(source: '''
                    (function() {
                      try {
                        if (window.__qm_sockets && window.__qm_sockets.length > 0) {
                          for (let i = 0; i < window.__qm_sockets.length; i++) {
                            const ws = window.__qm_sockets[i];
                            if (ws && ws.readyState === 1) {
                              ws.send('42["instruments/update",{"asset":"$sym","period":$_tradeDuration}]');
                              ws.send('42["depth/follow","$sym"]');
                              ws.send('42["chart_notification/get",{"asset":"$sym","version":"1.0.0"}]');
                              ws.send('42["instruments/update",{"asset":"$baseSym","period":$_tradeDuration}]');
                              ws.send('42["depth/follow","$baseSym"]');
                            }
                          }
                        }
                      } catch(e) {}
                    })();
                  ''');
                } catch (_) {}
              }
            }

            void _parseAndSetBalance(String rawStr) {
              final clean = rawStr.trim();
              if (clean.isEmpty) return;
              final match = RegExp(r'([0-9]+(?:[.,][0-9]{1,2})?)').firstMatch(clean.replaceAll(',', ''));
              if (match != null) {
                final val = double.tryParse(match.group(1)!);
                if (val != null && val > 0) {
                  _balance = val;
                  _balanceText = "\$${val.toStringAsFixed(2)}";
                  if (_initialSessionBalance == 0.0) {
                    _initialSessionBalance = val;
                    addLog("تم قراءة رصيد الحساب الفعلي من السيرفر: \$${val.toStringAsFixed(2)} ✔");
                  }
                }
              }
            }

            void _startWebSyncTimer() {
              _webSyncTimer?.cancel();
              int tickCounter = 0;
              _webSyncTimer = Timer.periodic(const Duration(milliseconds: 1000), (_) async {
                if (!_isConnected || _webViewController == null) return;
                tickCounter++;
                if (tickCounter % 5 == 0 && _selectedAsset != "AUTO_CHART") {
                  _subscribeServerToAsset(_selectedAsset);
                }

                try {
                  final sym = toServerSymbol(activeAsset);
                  final wantedNorm = normalizeAssetKey(sym);
                  final baseNorm = normalizeAssetKey(sym.replaceAll('_otc', ''));

                  final res = await _webViewController!.evaluateJavascript(source: '''
                    (function() {
                      try {
                        let foundBalance = '';
                        if (window.__qm_ws_balance !== null && window.__qm_ws_balance !== undefined && Number(window.__qm_ws_balance) > 0) {
                          foundBalance = String(window.__qm_ws_balance);
                        }
                        if (!foundBalance && window.settings) {
                          if (Number(window.settings.demoBalance) > 0) foundBalance = String(window.settings.demoBalance);
                          else if (Number(window.settings.balance) > 0) foundBalance = String(window.settings.balance);
                        }
                        if (!foundBalance && document.body) {
                          const bodyTxt = document.body.innerText || '';
                          const m1 = bodyTxt.match(/(?:تجريبي|مباشر|حقيقي|Demo|Live|Real)[^0-9]{0,25}([0-9,]+\\.[0-9]{2})/i);
                          if (m1 && m1[1]) {
                            foundBalance = m1[1];
                          } else {
                            const topSlice = bodyTxt.substring(0, 450);
                            const m2 = topSlice.match(/([0-9,]+\\.[0-9]{2})/);
                            if (m2 && m2[1]) foundBalance = m2[1];
                          }
                        }

                        // قراءة اسم الزوج المفتوح في الشارت
                        let chartPair = '';
                        const dealNodes = document.querySelectorAll('[class*="pair"], [class*="asset"], [class*="section-deal"] *, span, div');
                        for (let i = 0; i < dealNodes.length; i++) {
                          const el = dealNodes[i];
                          if (el.children.length === 0 && el.innerText) {
                            const txt = el.innerText.trim();
                            if ((txt.length >= 7 && txt.length <= 18 && txt.indexOf('/') === 3) || txt.endsWith('(OTC)')) {
                              chartPair = txt;
                              break;
                            }
                          }
                        }

                        function norm(s) {
                          return String(s || '').replace('(OTC)', 'OTC').replace('_otc', 'OTC').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                        }

                        const k1 = ('$_selectedAsset' === 'AUTO_CHART' && chartPair) ? norm(chartPair) : '$wantedNorm';
                        const k2 = '$baseNorm';
                        let prices = [];
                        if (window.__qm_by_norm) {
                          if (window.__qm_by_norm[k1] && window.__qm_by_norm[k1].length >= 2) {
                            prices = window.__qm_by_norm[k1];
                          } else if (window.__qm_by_norm[k2] && window.__qm_by_norm[k2].length >= 2) {
                            prices = window.__qm_by_norm[k2];
                          } else if (window.__qm_active_ws_key && window.__qm_by_norm[window.__qm_active_ws_key] && window.__qm_by_norm[window.__qm_active_ws_key].length >= 2) {
                            prices = window.__qm_by_norm[window.__qm_active_ws_key];
                          } else {
                            let bestArr = [];
                            const keys = Object.keys(window.__qm_by_norm);
                            for (let i = 0; i < keys.length; i++) {
                              const arr = window.__qm_by_norm[keys[i]];
                              if (arr && arr.length > bestArr.length) bestArr = arr;
                            }
                            prices = bestArr;
                          }
                        }

                        return JSON.stringify({
                          balance: foundBalance,
                          chartPair: chartPair,
                          prices: prices.slice(-90)
                        });
                      } catch(e) { return '{}'; }
                    })();
                  ''');

                  if (res != null && res is String && res.contains('{')) {
                    final cleanJson = res.startsWith('"') ? jsonDecode(res) : res;
                    final map = cleanJson is String ? jsonDecode(cleanJson) : cleanJson;
                    if (map is Map) {
                      final bStr = map['balance']?.toString() ?? '';
                      if (bStr.isNotEmpty) {
                        _parseAndSetBalance(bStr);
                      }

                      final cPair = map['chartPair']?.toString() ?? '';
                      if (cPair.isNotEmpty) {
                        _chartDisplayPair = cPair;
                      }

                      final rawPrices = map['prices'];
                      if (rawPrices is List && rawPrices.isNotEmpty) {
                        _priceHistory.clear();
                        for (final item in rawPrices) {
                          if (item is num && item > 0) {
                            _priceHistory.add(item.toDouble());
                          }
                        }
                        if (_priceHistory.isNotEmpty) {
                          _lastPrice = _priceHistory.last;
                          _trainLocalAiMemory();
                          _calculateAllIndicatorsAndStrength();
                          _refreshSignalBadge();
                        }
                      }

                      if (_isAutoTrading && _initialSessionBalance > 0) {
                        if (netProfit >= _takeProfitTarget) {
                          stopAutoTrading(reason: "🎯 تم تحقيق هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)}) — توقف البوت تلقائياً!");
                        } else if (netProfit <= -_stopLossLimit) {
                          stopAutoTrading(reason: "🛑 تم الوصول إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)}) — توقف البوت تلقائياً!");
                        }
                      }
                      notifyListeners();
                    }
                  }
                } catch (_) {}
              });
            }

            // تدريب ذاكرة الذكاء الاصطناعي المحلي على الأنماط السعرية الحية (k-NN + Online Perceptron Learning)
            void _trainLocalAiMemory() {
              if (_priceHistory.length < 12) return;
              _aiPatternMemory.clear();
              for (int i = 6; i < _priceHistory.length - 2; i++) {
                final double base = _priceHistory[i];
                if (base <= 0) continue;
                final List<double> pattern = [
                  (_priceHistory[i] - _priceHistory[i - 1]) / base * 1000.0,
                  (_priceHistory[i - 1] - _priceHistory[i - 2]) / base * 1000.0,
                  (_priceHistory[i - 2] - _priceHistory[i - 3]) / base * 1000.0,
                  (_priceHistory[i - 3] - _priceHistory[i - 4]) / base * 1000.0,
                  (_priceHistory[i - 4] - _priceHistory[i - 5]) / base * 1000.0,
                ];
                final bool nextWentUp = _priceHistory[i + 2] > _priceHistory[i];
                _aiPatternMemory.add(_AiPatternSample(pattern, nextWentUp));
              }
              _aiLearnedPatternsCount = _aiPatternMemory.length;
            }

            double _computeEma(List<double> data, int period) {
              if (data.isEmpty) return 0.0;
              if (data.length < period) {
                return data.reduce((a, b) => a + b) / data.length;
              }
              final double k = 2.0 / (period + 1);
              double ema = data.sublist(0, period).reduce((a, b) => a + b) / period;
              for (int i = period; i < data.length; i++) {
                ema = (data[i] * k) + (ema * (1.0 - k));
              }
              return ema;
            }

            double _tanh(double x) {
              if (x > 10.0) return 1.0;
              if (x < -10.0) return -1.0;
              final double e2x = exp(2.0 * x);
              return (e2x - 1.0) / (e2x + 1.0);
            }

            double _sigmoid(double x) {
              return 1.0 / (1.0 + exp(-x));
            }

            void _calculateAllIndicatorsAndStrength() {
              if (_priceHistory.length < 5) return;

              _ema5 = _computeEma(_priceHistory, 5);
              _ema13 = _computeEma(_priceHistory, 13);
              _ema26 = _computeEma(_priceHistory, 26);

              final double ema12 = _computeEma(_priceHistory, 12);
              final double macdLine = ema12 - _ema26;
              _macdHistogram = macdLine - (_ema5 - _ema13) * 0.5;

              _priceMomentum = _priceHistory.last - _priceHistory[max(0, _priceHistory.length - 5)];

              final int bbLen = min(20, _priceHistory.length);
              final List<double> bbSlice = _priceHistory.sublist(_priceHistory.length - bbLen);
              final double mean = bbSlice.reduce((a, b) => a + b) / bbLen;
              double sumSq = 0.0;
              for (final p in bbSlice) {
                sumSq += (p - mean) * (p - mean);
              }
              final double stdDev = max(1e-7, sqrt(sumSq / bbLen));
              _bollingerUpper = mean + (1.8 * stdDev);
              _bollingerLower = mean - (1.8 * stdDev);

              final int rsiWindow = min(14, _priceHistory.length - 1);
              double gains = 0.0;
              double losses = 0.0;
              for (int i = _priceHistory.length - rsiWindow; i < _priceHistory.length; i++) {
                final diff = _priceHistory[i] - _priceHistory[i - 1];
                if (diff > 0) {
                  gains += diff;
                } else if (diff < 0) {
                  losses -= diff;
                }
              }
              final avgGain = gains / rsiWindow;
              final avgLoss = losses / rsiWindow;
              if (avgLoss == 0 && avgGain == 0) {
                _currentRsi = 50.0;
              } else if (avgLoss == 0) {
                _currentRsi = 88.0;
              } else {
                final rs = avgGain / avgLoss;
                _currentRsi = 100.0 - (100.0 / (1.0 + rs));
              }

              final int stochLen = min(14, _priceHistory.length);
              final List<double> stochSlice = _priceHistory.sublist(_priceHistory.length - stochLen);
              final double lowestLow = stochSlice.reduce(min);
              final double highestHigh = stochSlice.reduce(max);
              if ((highestHigh - lowestLow).abs() > 1e-9) {
                _stochasticK = ((_lastPrice - lowestLow) / (highestHigh - lowestLow)) * 100.0;
              } else {
                _stochasticK = 50.0;
              }

              final double lastStep = _priceHistory.last - _priceHistory[_priceHistory.length - 2];
              final double prevStep = _priceHistory.length >= 3
                  ? (_priceHistory[_priceHistory.length - 2] - _priceHistory[_priceHistory.length - 3])
                  : 0.0;

              int upSteps = 0;
              int downSteps = 0;
              final int stepWin = min(8, _priceHistory.length - 1);
              for (int i = _priceHistory.length - stepWin; i < _priceHistory.length; i++) {
                if (_priceHistory[i] > _priceHistory[i - 1]) upSteps++;
                if (_priceHistory[i] < _priceHistory[i - 1]) downSteps++;
              }

              if (_strategy == "local_neural_ai") {
                // =========================================================
                // محرك الذكاء الاصطناعي المحلي (Local Neural Network + k-NN)
                // =========================================================
                // 1. حساب المدخلات العصبية العشرة المعيّرة (Normalized Neural Inputs)
                final double x1Rsi = (50.0 - _currentRsi) / 50.0;
                final double x2EmaFast = _tanh((_ema5 - _ema13) / stdDev);
                final double x3EmaSlow = _tanh((_ema13 - _ema26) / stdDev);
                final double x4Macd = _tanh(_macdHistogram / stdDev);
                final double x5Bollinger = _tanh((mean - _lastPrice) / (1.8 * stdDev));
                final double x6Stoch = (50.0 - _stochasticK) / 50.0;
                final double x7Vel3 = _tanh((_lastPrice - _priceHistory[max(0, _priceHistory.length - 4)]) / stdDev);
                final double x8Mom8 = _tanh(_priceMomentum / stdDev);
                final double x9Pressure = (upSteps - downSteps) / max(1, stepWin).toDouble();
                final double x10Accel = _tanh((lastStep - prevStep) / stdDev);

                final List<double> features = [
                  x1Rsi, x2EmaFast, x3EmaSlow, x4Macd, x5Bollinger,
                  x6Stoch, x7Vel3, x8Mom8, x9Pressure, x10Accel
                ];

                // الطبقة العصبية المخفية (Hidden Layer Neurons with Tanh Activation)
                final double h1Trend = _tanh(features[1] * 1.4 + features[2] * 1.1 + features[3] * 1.2 + features[6] * 0.9);
                final double h2Reversal = _tanh(features[0] * 1.6 + features[4] * 1.5 + features[5] * 1.2);
                final double h3Momentum = _tanh(features[6] * 1.3 + features[7] * 1.1 + features[8] * 1.4 + features[9] * 1.0);

                double rawNetScore = 0.0;
                for (int i = 0; i < features.length; i++) {
                  rawNetScore += features[i] * _neuralWeights[i];
                }
                final double mlpLogit = (h1Trend * 0.45) + (h2Reversal * 0.35) + (h3Momentum * 0.40) + (rawNetScore * 0.5);
                final double neuralProbUp = _sigmoid(mlpLogit * 2.2);

                // 2. مطابقة الأنماط التاريخية عبر خوارزمية أقرب الجيران (k-NN Pattern Recognition)
                double knnProbUp = 0.5;
                if (_aiPatternMemory.length >= 5 && _priceHistory.length >= 6) {
                  final double curBase = _lastPrice;
                  final int n = _priceHistory.length;
                  final List<double> curPat = [
                    (_priceHistory[n - 1] - _priceHistory[n - 2]) / curBase * 1000.0,
                    (_priceHistory[n - 2] - _priceHistory[n - 3]) / curBase * 1000.0,
                    (_priceHistory[n - 3] - _priceHistory[n - 4]) / curBase * 1000.0,
                    (_priceHistory[n - 4] - _priceHistory[n - 5]) / curBase * 1000.0,
                    (_priceHistory[n - 5] - _priceHistory[n - 6]) / curBase * 1000.0,
                  ];

                  final List<MapEntry<double, bool>> distances = [];
                  for (final sample in _aiPatternMemory) {
                    double dist = 0.0;
                    for (int j = 0; j < 5; j++) {
                      final d = curPat[j] - sample.features[j];
                      dist += d * d;
                    }
                    distances.add(MapEntry(sqrt(dist), sample.wentUp));
                  }
                  distances.sort((a, b) => a.key.compareTo(b.key));
                  final int kNeighbors = min(7, distances.length);
                  double weightedUp = 0.0;
                  double totalWeight = 0.0;
                  for (int k = 0; k < kNeighbors; k++) {
                    final double w = 1.0 / (distances[k].key + 0.001);
                    if (distances[k].value) weightedUp += w;
                    totalWeight += w;
                  }
                  if (totalWeight > 0) {
                    knnProbUp = weightedUp / totalWeight;
                  }
                }

                // 3. دمج الشبكة العصبية + ذاكرة الأنماط k-NN لحساب قوة إشارة الذكاء الاصطناعي (0% - 98%)
                _aiNeuralProbability = (neuralProbUp * 0.55) + (knnProbUp * 0.45);
                final double confidence = (_aiNeuralProbability - 0.5).abs() * 2.0; // 0.0 to 1.0
                final int strengthPct = (55.0 + (confidence * 43.0)).round().clamp(52, 98);

                if (_aiNeuralProbability >= 0.5) {
                  _currentSignalDirection = "CALL";
                } else {
                  _currentSignalDirection = "PUT";
                }
                _currentSignalStrength = strengthPct;
                _agreedIndicatorsCount = (1 + (confidence * 5.0).round()).clamp(1, 6);
                return;
              }

              // الاستراتيجيات الفنية الأخرى
              int callVotes = 0;
              int putVotes = 0;
              double callPoints = 0.0;
              double putPoints = 0.0;

              if (_strategy == "qumatix_rsi_ema") {
                if (_currentRsi <= 32.0) { callVotes++; callPoints += 24.0; }
                else if (_currentRsi >= 68.0) { putVotes++; putPoints += 24.0; }
                else if (_currentRsi > 45.0 && _currentRsi < 62.0) { callVotes++; callPoints += 16.0; }
                else if (_currentRsi < 55.0 && _currentRsi > 38.0) { putVotes++; putPoints += 16.0; }

                if (_ema5 > _ema13 && _ema13 >= _ema26) { callVotes++; callPoints += 20.0; }
                else if (_ema5 < _ema13 && _ema13 <= _ema26) { putVotes++; putPoints += 20.0; }
                else if (_ema5 > _ema13) { callVotes++; callPoints += 12.0; }
                else { putVotes++; putPoints += 12.0; }

                if (_macdHistogram > 0) { callVotes++; callPoints += 16.0; }
                else if (_macdHistogram < 0) { putVotes++; putPoints += 16.0; }

                if (_lastPrice <= _bollingerLower) { callVotes++; callPoints += 18.0; }
                else if (_lastPrice >= _bollingerUpper) { putVotes++; putPoints += 18.0; }
                else if (_lastPrice > mean) { callVotes++; callPoints += 10.0; }
                else { putVotes++; putPoints += 10.0; }

                if (_stochasticK <= 25.0 || (_stochasticK > 50.0 && _stochasticK < 80.0 && lastStep > 0)) { callVotes++; callPoints += 14.0; }
                else if (_stochasticK >= 75.0 || (_stochasticK < 50.0 && _stochasticK > 20.0 && lastStep < 0)) { putVotes++; putPoints += 14.0; }

                if (upSteps >= 4 && lastStep > 0) { callVotes++; callPoints += 15.0; }
                else if (downSteps >= 4 && lastStep < 0) { putVotes++; putPoints += 15.0; }
                else if (upSteps > downSteps) { callVotes++; callPoints += 9.0; }
                else if (downSteps > upSteps) { putVotes++; putPoints += 9.0; }
              } else if (_strategy == "trend_momentum") {
                if (_ema5 > _ema13) { callVotes++; callPoints += 22.0; } else { putVotes++; putPoints += 22.0; }
                if (_ema13 > _ema26) { callVotes++; callPoints += 18.0; } else { putVotes++; putPoints += 18.0; }
                if (_priceMomentum > 0) { callVotes++; callPoints += 18.0; } else if (_priceMomentum < 0) { putVotes++; putPoints += 18.0; }
                if (_macdHistogram > 0) { callVotes++; callPoints += 15.0; } else { putVotes++; putPoints += 15.0; }
                if (upSteps > downSteps) { callVotes++; callPoints += 15.0 + (upSteps * 1.5); } else if (downSteps > upSteps) { putVotes++; putPoints += 15.0 + (downSteps * 1.5); }
                if (_currentRsi > 50 && _currentRsi < 72) { callVotes++; callPoints += 12.0; } else if (_currentRsi < 50 && _currentRsi > 28) { putVotes++; putPoints += 12.0; }
              } else {
                if (_lastPrice <= _bollingerLower) { callVotes++; callPoints += 28.0; }
                else if (_lastPrice >= _bollingerUpper) { putVotes++; putPoints += 28.0; }
                if (_currentRsi <= 36.0) { callVotes++; callPoints += 24.0; }
                else if (_currentRsi >= 64.0) { putVotes++; putPoints += 24.0; }
                if (_stochasticK <= 22.0) { callVotes++; callPoints += 20.0; }
                else if (_stochasticK >= 78.0) { putVotes++; putPoints += 20.0; }
                if (lastStep > 0 && _lastPrice < mean) { callVotes++; callPoints += 16.0; }
                else if (lastStep < 0 && _lastPrice > mean) { putVotes++; putPoints += 16.0; }
                if (_ema5 < _ema13 && lastStep > 0) { callVotes++; callPoints += 12.0; }
                else if (_ema5 > _ema13 && lastStep < 0) { putVotes++; putPoints += 12.0; }
              }

              if (callPoints >= putPoints) {
                _currentSignalDirection = "CALL";
                _agreedIndicatorsCount = max(1, min(6, callVotes));
                _currentSignalStrength = min(98, max(52, callPoints.round()));
              } else {
                _currentSignalDirection = "PUT";
                _agreedIndicatorsCount = max(1, min(6, putVotes));
                _currentSignalStrength = min(98, max(52, putPoints.round()));
              }
            }

            void toggleAutoTrading() {
              if (_isAutoTrading) {
                stopAutoTrading(reason: "تم إيقاف البوت الآلي يدوياً.");
              } else {
                startAutoTrading();
              }
            }

            void startAutoTrading() {
              if (!_isConnected) {
                addLog("تنبيه: يرجى ربط الحساب من تبويب المنصة أولاً قبل تشغيل البوت.");
                return;
              }
              if (_initialSessionBalance > 0) {
                if (netProfit >= _takeProfitTarget) {
                  addLog("🎯 لقد وصلت بالفعل إلى هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)}).");
                  return;
                }
                if (netProfit <= -_stopLossLimit) {
                  addLog("🛑 لقد وصلت إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)}).");
                  return;
                }
              }

              _isAutoTrading = true;
              _currentTradeAmount = _baseAmount;
              _subscribeServerToAsset(activeAsset);
              addLog("🧠 بدأ الذكاء الاصطناعي المحلي فحص ($activeAsset) | شرط الدخول: قوة إشارة $_minSignalStrength% فأعلى");
              notifyListeners();

              _scannerTimer?.cancel();
              _scannerTimer = Timer.periodic(const Duration(seconds: 2), (_) {
                if (!_isAutoTrading || !_isConnected || _isTradeOpen) return;
                _checkSignalStrengthAndTrade();
              });

              _checkSignalStrengthAndTrade();
            }

            void stopAutoTrading({String? reason}) {
              _isAutoTrading = false;
              _scannerTimer?.cancel();
              if (reason != null) addLog(reason);
              notifyListeners();
            }

            Future<void> _checkSignalStrengthAndTrade() async {
              if (!_isAutoTrading || !_isConnected || _isTradeOpen) return;

              if (_initialSessionBalance > 0) {
                if (netProfit >= _takeProfitTarget) {
                  stopAutoTrading(reason: "🎯 تم تحقيق هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)})!");
                  return;
                }
                if (netProfit <= -_stopLossLimit) {
                  stopAutoTrading(reason: "🛑 تم الوصول إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)})!");
                  return;
                }
              }

              if (_priceHistory.length < 5) {
                await _subscribeServerToAsset(activeAsset);
                return;
              }

              _calculateAllIndicatorsAndStrength();
              _refreshSignalBadge();

              if (_currentSignalStrength < _minSignalStrength) {
                notifyListeners();
                return;
              }

              final String direction = _currentSignalDirection.toLowerCase();
              addLog("🧠 إشارة ذكاء اصطناعي مكتملة! القوة: $_currentSignalStrength% (المطلوب: $_minSignalStrength%+) | أنماط متعلمة: $_aiLearnedPatternsCount | RSI: ${_currentRsi.toStringAsFixed(1)} => دخول $_currentSignalDirection");

              await placeOrder(
                asset: activeAsset,
                direction: direction,
                amount: _currentTradeAmount,
                duration: _tradeDuration,
              );
            }

            Future<void> placeOrder({
              required String asset,
              required String direction,
              required double amount,
              required int duration,
            }) async {
              if (!_isConnected || _webViewController == null) {
                addLog("تنبيه: اربط حسابك أولاً من شاشة المنصة لتنفيذ الصفقات.");
                return;
              }
              if (_isTradeOpen) {
                addLog("⏳ توجد صفقة جارية حالياً (متبقي ${_remainingSeconds}s) — انتظر إغلاقها.");
                return;
              }

              final double balanceBeforeClick = _balance;
              final double entryPriceBeforeClick = _lastPrice;
              final bool isCall = direction.toLowerCase() == "call";
              final String serverSym = toServerSymbol(asset);
              final String cleanAmount = amount == amount.roundToDouble()
                  ? amount.toInt().toString()
                  : amount.toStringAsFixed(2);

              final execRes = await _webViewController!.evaluateJavascript(source: '''
                (function() {
                  try {
                    // 1. حقن مبلغ الصفقة واتجاهها في معترض حزم الـ WebSocket لضمان إرسال المبلغ الصحيح للسيرفر
                    window.__qm_override_order = {
                      amount: Number('$cleanAmount'),
                      action: ${isCall ? "'call'" : "'put'"},
                      asset: '$serverSym',
                      useCustomAsset: ${(_selectedAsset != "AUTO_CHART") ? 'true' : 'false'},
                      ts: Date.now()
                    };

                    // 2. البحث الآمن عن زر الشراء (CALL) أو البيع (PUT) الحقيقي في المنصة بدون استخدام className.toLowerCase
                    const callSelectors = '.call-btn, [class*="btn-call"], [class*="button--call"], .section-deal__put-call .btn-green, .section-deal__call button, .section-deal__success button';
                    const putSelectors = '.put-btn, [class*="btn-put"], [class*="button--put"], .section-deal__put-call .btn-red, .section-deal__put button, .section-deal__danger button';

                    let targetBtn = document.querySelector(${isCall ? 'callSelectors' : 'putSelectors'});

                    if (!targetBtn) {
                      const allBtns = document.querySelectorAll('button, [role="button"], div, span');
                      for (let i = allBtns.length - 1; i >= 0; i--) {
                        const el = allBtns[i];
                        const txt = (el.innerText || el.textContent || '').trim();
                        if (${isCall ? 'true' : 'false'}) {
                          if (txt === 'شراء' || txt === 'CALL' || txt === 'Up' || txt === 'أعلى') {
                            targetBtn = el.closest('button') || el;
                            break;
                          }
                        } else {
                          if (txt === 'بيع' || txt === 'PUT' || txt === 'Down' || txt === 'أدنى') {
                            targetBtn = el.closest('button') || el;
                            break;
                          }
                        }
                      }
                    }

                    if (targetBtn) {
                      const evOpts = { bubbles: true, cancelable: true, view: window };
                      targetBtn.dispatchEvent(new PointerEvent('pointerdown', evOpts));
                      targetBtn.dispatchEvent(new MouseEvent('mousedown', evOpts));
                      targetBtn.dispatchEvent(new PointerEvent('pointerup', evOpts));
                      targetBtn.dispatchEvent(new MouseEvent('mouseup', evOpts));
                      targetBtn.click();
                      return 'CLICKED_OK';
                    }

                    // 3. في حال لم يكن زر الشارت ظاهراً، إرسال أمر التداول مباشرة عبر الـ WebSocket المفتوح
                    if (window.__qm_sockets && window.__qm_sockets.length > 0) {
                      const reqId = Math.floor(Date.now() / 1000);
                      const pkt = '42["orders/open",' + JSON.stringify({
                        asset: '$serverSym',
                        amount: Number('$cleanAmount'),
                        action: ${isCall ? "'call'" : "'put'"},
                        time: $duration,
                        isDemo: ${_accountType == "demo" ? 1 : 0},
                        tournamentId: 0,
                        requestId: reqId,
                        optionType: 100
                      }) + ']';
                      for (let i = 0; i < window.__qm_sockets.length; i++) {
                        const ws = window.__qm_sockets[i];
                        if (ws && ws.readyState === 1) {
                          ws.send(pkt);
                          return 'WS_SENT_OK';
                        }
                      }
                    }
                    return 'NO_BTN_OR_WS';
                  } catch(e) {
                    return 'ERR:' + e.message;
                  }
                })();
              ''');

              if (execRes == null || execRes.toString().contains("NO_BTN_OR_WS") || execRes.toString().contains("ERR:")) {
                addLog("⚠ تعذر إرسال الأمر (${execRes ?? 'غير متصل'}) — افتح تبويب المنصة والشارت للتأكد من تحميل شاشة التداول.");
                return;
              }

              _isTradeOpen = true;
              _remainingSeconds = duration;
              _activeTradeEntryPrice = entryPriceBeforeClick;
              _activeTradeBalanceBefore = balanceBeforeClick;
              _activeTradeDirection = direction.toLowerCase();
              _activeTradeAsset = asset;
              _activeTradeAmount = amount;
              _totalTrades++;
              notifyListeners();

              addLog("🚀 تم تنفيذ صفقة ${direction.toUpperCase()} على $asset بمبلغ \$$cleanAmount (قوة الإشارة: $_currentSignalStrength%)");

              _tradeLifecycleTimer?.cancel();
              _tradeLifecycleTimer = Timer.periodic(const Duration(seconds: 1), (timer) {
                if (_remainingSeconds > 0) {
                  _remainingSeconds--;
                  notifyListeners();
                } else {
                  timer.cancel();
                  _finalizeAndEvaluateTrade();
                }
              });
            }

            Future<void> _finalizeAndEvaluateTrade() async {
              await Future.delayed(const Duration(seconds: 2));

              final double currentBal = _balance;
              final double beforeBal = _activeTradeBalanceBefore;
              final double diff = currentBal - beforeBal;

              // تحديث أوزان الذكاء الاصطناعي المحلي ذاتياً بناءً على نتيجة الصفقة (Reinforcement Learning)
              if (beforeBal > 0 && currentBal > 0) {
                if (diff > 0.05) {
                  _wonTrades++;
                  _currentTradeAmount = _baseAmount;
                  for (int i = 0; i < _neuralWeights.length; i++) {
                    _neuralWeights[i] = (_neuralWeights[i] * 1.03).clamp(0.05, 0.60);
                  }
                  addLog("✔ صفقة رابحة مؤكدة (+ \$${diff.toStringAsFixed(2)}) | الرصيد الجديد: \$${currentBal.toStringAsFixed(2)} | تم تعزيز أوزان الذكاء الاصطناعي 🧠");
                } else if (diff < -0.05) {
                  _lostTrades++;
                  for (int i = 0; i < _neuralWeights.length; i++) {
                    _neuralWeights[i] = (_neuralWeights[i] * 0.97).clamp(0.05, 0.60);
                  }
                  if (_useMartingale) {
                    _currentTradeAmount = double.parse((_currentTradeAmount * _martingaleMultiplier).toStringAsFixed(2));
                    addLog("✖ صفقة خاسرة مؤكدة (-\$${diff.abs().toStringAsFixed(2)}) | الرصيد الجديد: \$${currentBal.toStringAsFixed(2)} | مضاعفة الصفقة القادمة: \$$_currentTradeAmount");
                  } else {
                    _currentTradeAmount = _baseAmount;
                    addLog("✖ صفقة خاسرة مؤكدة (-\$${diff.abs().toStringAsFixed(2)}) | الرصيد الجديد: \$${currentBal.toStringAsFixed(2)}");
                  }
                } else {
                  addLog("⚖ انتهى وقت الصفقة دون تغير في الرصيد (\$${currentBal.toStringAsFixed(2)}).");
                }
              }

              _isTradeOpen = false;
              _remainingSeconds = 0;
              notifyListeners();

              if (_isAutoTrading && _initialSessionBalance > 0) {
                if (netProfit >= _takeProfitTarget) {
                  stopAutoTrading(reason: "🎯 تم الوصول إلى هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)}) — توقف البوت تلقائياً!");
                  return;
                }
                if (netProfit <= -_stopLossLimit) {
                  stopAutoTrading(reason: "🛑 تم الوصول إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)}) — توقف البوت تلقائياً!");
                  return;
                }
              }
            }

            Future<void> disconnect() async {
              stopAutoTrading();
              _tradeLifecycleTimer?.cancel();
              _pingTimer?.cancel();
              _webSyncTimer?.cancel();
              await _directSocket?.close();
              _directSocket = null;
              _isTradeOpen = false;
              _isConnected = false;
              _isAuthenticated = false;
              addLog("تم قطع الاتصال بالسيرفر.");
              notifyListeners();
            }

            @override
            void dispose() {
              disconnect();
              super.dispose();
            }
          }
          EOF

      - name: Generate login_screen.dart (WebSocket Order Interceptor & Tick Streamer)
        run: |
