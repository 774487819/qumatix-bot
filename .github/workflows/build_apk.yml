              Future<void> askGemini() async {
              if (_geminiKey.isEmpty || _geminiBusy) return;
              _geminiBusy = true;
              notifyListeners();
              try {
                if (_aiProv.isEmpty && !await _detectAi()) {
                  _geminiDir = '';
                  return;
                }
                final recent = _priceHistory.length > 30 ? _priceHistory.sublist(_priceHistory.length - 30) : _priceHistory;
                final prompt = 'You are a cautious market analyst for a 1-minute binary option. Use ONLY the data below. '
                    'Reply with strict JSON only: {"direction":"CALL|PUT|WAIT","confidence":0-100,"reason":"one short Arabic sentence"}. '
                    'Answer WAIT when the data is unclear. Data: asset=$activeAsset, lastPrice=$_lastPrice, '
                    'ema5=${_ema5.toStringAsFixed(6)}, ema13=${_ema13.toStringAsFixed(6)}, rsi14=${_currentRsi.toStringAsFixed(1)}, '
