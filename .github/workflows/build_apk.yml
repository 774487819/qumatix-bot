name: Build QuMatix APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter Android Project Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name qumatix_bot --platforms=android --org com.qumatix.app .
          fi
          rm -rf test

      - name: Generate pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: qumatix_bot
          description: "QuMatix Pro AI v3.2 Real Strategy & Balance Sync"
          publish_to: 'none'
          version: 3.2.0+5

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.2
            flutter_inappwebview: ^6.1.5
            shared_preferences: ^2.2.3
            cupertino_icons: ^1.0.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Write Full AndroidManifest.xml with Internet Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="QuMatix Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Generate quotex_service.dart (Accurate Win/Loss Evaluator + Smart Strategy + Live Balance)
        run: |
          mkdir -p lib/services
          cat << 'EOF' > lib/services/quotex_service.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'package:flutter/foundation.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';

          class QuotexService extends ChangeNotifier {
            WebSocket? _socket;
            InAppWebViewController? _webViewController;
            Timer? _pingTimer;
            Timer? _webSyncTimer;
            Timer? _tradeLifecycleTimer;

            bool _isConnected = false;
            bool _isAuthenticated = false;
            bool _isAutoTrading = false;
            bool _isTradeOpen = false;

            double _balance = 0.0;
            double _initialSessionBalance = 0.0;
            String _balanceText = "\$0.00";
            String _accountType = "demo";
            String _currentDomain = "quotex.io";
            String _cookieHeader = "";

            String _selectedAssetMode = "AUTO_CHART";
            String _chartDetectedAsset = "EURUSD_otc";
            int _tradeDuration = 60;
            double _baseAmount = 1.0;
            double _currentTradeAmount = 1.0;
            bool _useMartingale = true;
            double _martingaleMultiplier = 2.0;
            double _takeProfitTarget = 50.0;
            double _stopLossLimit = 25.0;
            String _strategy = "qumatix_rsi_ema";

            double _lastPrice = 0.0;
            double _emaFast = 0.0;
            double _emaSlow = 0.0;
            double _currentRsi = 50.0;
            double _priceMomentum = 0.0;
            String _lastSignal = "بانتظار قراءات السوق الحية...";
            int _totalTrades = 0;
            int _wonTrades = 0;
            int _lostTrades = 0;

            // بيانات الصفقة الجارية لتقييم الربح والخسارة بدقة 100%
            double _activeTradeEntryPrice = 0.0;
            double _activeTradeBalanceBefore = 0.0;
            String _activeTradeDirection = "call";
            String _activeTradeAsset = "EURUSD_otc";
            double _activeTradeAmount = 1.0;
            int _remainingSeconds = 0;

            final List<double> _priceHistory = [];
            final List<String> _logs = [];

            bool get isConnected => _isConnected;
            bool get isAuthenticated => _isAuthenticated;
            bool get isAutoTrading => _isAutoTrading;
            bool get isTradeOpen => _isTradeOpen;
            int get remainingSeconds => _remainingSeconds;
            double get balance => _balance;
            String get balanceText => _balanceText;
            double get netProfit => _initialSessionBalance > 0 ? (_balance - _initialSessionBalance) : 0.0;
            String get accountType => _accountType;
            String get currentDomain => _currentDomain;
            String get selectedAssetMode => _selectedAssetMode;
            String get activeAsset => _selectedAssetMode == "AUTO_CHART" ? _chartDetectedAsset : _selectedAssetMode;
            int get tradeDuration => _tradeDuration;
            double get baseAmount => _baseAmount;
            double get currentTradeAmount => _currentTradeAmount;
            bool get useMartingale => _useMartingale;
            double get martingaleMultiplier => _martingaleMultiplier;
            double get takeProfitTarget => _takeProfitTarget;
            double get stopLossLimit => _stopLossLimit;
            String get strategy => _strategy;
            double get lastPrice => _lastPrice;
            double get emaFast => _emaFast;
            double get emaSlow => _emaSlow;
            double get currentRsi => _currentRsi;
            double get priceMomentum => _priceMomentum;
            int get ticksCount => _priceHistory.length;
            String get lastSignal => _lastSignal;
            int get totalTrades => _totalTrades;
            int get wonTrades => _wonTrades;
            int get lostTrades => _lostTrades;
            int get winRate => (_wonTrades + _lostTrades) > 0 ? ((_wonTrades * 100) ~/ (_wonTrades + _lostTrades)) : 0;
            List<String> get logs => List.unmodifiable(_logs);

            void attachWebViewController(InAppWebViewController controller) {
              _webViewController = controller;
            }

            void updateSettings({
              String? asset,
              int? duration,
              double? baseAmount,
              bool? useMartingale,
              double? martingaleMultiplier,
              double? takeProfit,
              double? stopLoss,
              String? strategy,
              bool? isRealAccount,
            }) {
              if (isRealAccount != null) {
                _accountType = isRealAccount ? "real" : "demo";
              }
              if (asset != null && asset != _selectedAssetMode) {
                _selectedAssetMode = asset;
                if (asset != "AUTO_CHART") {
                  _priceHistory.clear();
                  _lastPrice = 0.0;
                  if (_isConnected) {
                    _subscribeToAsset(asset);
                  }
                }
              }
              if (duration != null) _tradeDuration = duration;
              if (baseAmount != null && baseAmount > 0) {
                _baseAmount = baseAmount;
                if (!_isAutoTrading && !_isTradeOpen) {
                  _currentTradeAmount = baseAmount;
                }
              }
              if (useMartingale != null) _useMartingale = useMartingale;
              if (martingaleMultiplier != null && martingaleMultiplier > 1.0) {
                _martingaleMultiplier = martingaleMultiplier;
              }
              if (takeProfit != null) _takeProfitTarget = takeProfit;
              if (stopLoss != null) _stopLossLimit = stopLoss;
              if (strategy != null) _strategy = strategy;
              notifyListeners();
            }

            void addLog(String message) {
              final now = DateTime.now();
              final time = "${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')}";
              _logs.insert(0, "[$time] $message");
              if (_logs.length > 150) _logs.removeLast();
              notifyListeners();
            }

            Future<void> connect({
              required String ssidToken,
              bool isRealAccount = false,
              String domain = "quotex.io",
              String cookieHeader = "",
              String? detectedBalance,
            }) async {
              _accountType = isRealAccount ? "real" : "demo";
              _currentDomain = domain;
              _cookieHeader = cookieHeader;

              if (detectedBalance != null && detectedBalance.isNotEmpty) {
                _parseAndSetBalance(detectedBalance);
              }

              _isConnected = true;
              _isAuthenticated = true;
              addLog("تم ربط الحساب بنجاح عبر السيرفر ($domain) ✔");
              notifyListeners();

              _subscribeToAsset(activeAsset);
              _startWebSyncTimer();
            }

            void _parseAndSetBalance(String rawStr) {
              final clean = rawStr.trim();
              if (clean.isEmpty) return;
              // استخراج الرقم العشري مثل 142.97 من النص الظاهر مثل "$142.97"
              final match = RegExp(r'([0-9]+(?:[.,][0-9]{1,2})?)').firstMatch(clean.replaceAll(',', ''));
              if (match != null) {
                final val = double.tryParse(match.group(1)!);
                if (val != null && val >= 0) {
                  _balance = val;
                  _balanceText = "\$${val.toStringAsFixed(2)}";
                  if (_initialSessionBalance == 0.0 && val > 0) {
                    _initialSessionBalance = val;
                  }
                }
              }
            }

            void _startWebSyncTimer() {
              _webSyncTimer?.cancel();
              _webSyncTimer = Timer.periodic(const Duration(milliseconds: 1200), (_) async {
                if (!_isConnected || _webViewController == null) return;
                try {
                  final targetAsset = activeAsset;
                  final res = await _webViewController!.evaluateJavascript(source: '''
                    (function() {
                      try {
                        // 1. استخراج الرصيد الحقيقي الظاهر أعلى المنصة
                        let foundBalance = '';
                        if (window.__qm_ws_balance !== null && window.__qm_ws_balance !== undefined) {
                          foundBalance = String(window.__qm_ws_balance);
                        }
                        if (!foundBalance) {
                          const allEls = document.querySelectorAll('header *, [class*="usermenu"] *, [class*="balance"] *, [class*=" header"] *');
                          for (let i = 0; i < allEls.length; i++) {
                            const el = allEls[i];
                            if (el.children.length === 0 && el.innerText) {
                              const t = el.innerText.trim();
                              if (/[\x24€£৳₹¥]\s*[0-9,]+(\.[0-9]{1,2})?/.test(t) || /[0-9,]+\.[0-9]{2}\s*[\x24€£৳₹¥]/.test(t)) {
                                foundBalance = t;
                                break;
                              }
                            }
                          }
                        }
                        if (!foundBalance) {
                          // بحث عام في الجزء العلوي من الشاشة (أول 130 بكسل)
                          const topNodes = document.querySelectorAll('div, span, b, p');
                          for (let i = 0; i < topNodes.length; i++) {
                            const el = topNodes[i];
                            if (el.children.length <= 1 && el.innerText) {
                              const rect = el.getBoundingClientRect();
                              if (rect.top >= 0 && rect.top < 140 && rect.width > 10) {
                                const m = el.innerText.match(/[\x24€£৳₹¥]\s*[0-9,]+(\.[0-9]{1,2})?/);
                                if (m && m[0]) {
                                  foundBalance = m[0];
                                  break;
                                }
                              }
                            }
                          }
                        }

                        // 2. معرفة الزوج المفتوح حالياً في الشارت وأسعاره
                        const latestAsset = window.__qm_latest_asset || '';
                        const askAsset = '$targetAsset';
                        let prices = [];
                        if ('$_selectedAssetMode' === 'AUTO_CHART' && latestAsset && window.__qm_asset_prices && window.__qm_asset_prices[latestAsset]) {
                          prices = window.__qm_asset_prices[latestAsset];
                        } else if (window.__qm_asset_prices && window.__qm_asset_prices[askAsset] && window.__qm_asset_prices[askAsset].length > 0) {
                          prices = window.__qm_asset_prices[askAsset];
                        } else if (window.__qm_prices && window.__qm_prices.length > 0) {
                          prices = window.__qm_prices;
                        }

                        return JSON.stringify({
                          balance: foundBalance,
                          prices: prices.slice(-60),
                          latestAsset: latestAsset
                        });
                      } catch(e) { return '{}'; }
                    })();
                  ''');

                  if (res != null && res is String && res.contains('{')) {
                    final cleanJson = res.startsWith('"') ? jsonDecode(res) : res;
                    final map = cleanJson is String ? jsonDecode(cleanJson) : cleanJson;
                    if (map is Map) {
                      final bStr = map['balance']?.toString() ?? '';
                      if (bStr.isNotEmpty) {
                        _parseAndSetBalance(bStr);
                      }

                      final detAsset = map['latestAsset']?.toString() ?? '';
                      if (detAsset.isNotEmpty && detAsset != _chartDetectedAsset) {
                        _chartDetectedAsset = detAsset;
                      }

                      final rawPrices = map['prices'];
                      if (rawPrices is List && rawPrices.isNotEmpty) {
                        bool updated = false;
                        for (final item in rawPrices) {
                          if (item is num && item > 0) {
                            final d = item.toDouble();
                            if (_priceHistory.isEmpty || _priceHistory.last != d) {
                              _priceHistory.add(d);
                              _lastPrice = d;
                              updated = true;
                            }
                          }
                        }
                        while (_priceHistory.length > 80) {
                          _priceHistory.removeAt(0);
                        }
                        if (updated) {
                          _calculateIndicators();
                        }
                      }
                      notifyListeners();
                    }
                  }
                } catch (_) {}
              });
            }

            Future<void> _subscribeToAsset(String asset) async {
              if (_webViewController != null) {
                try {
                  await _webViewController!.evaluateJavascript(source: '''
                    (function() {
                      try {
                        if (window.__qm_sockets && window.__qm_sockets.length > 0) {
                          for (let ws of window.__qm_sockets) {
                            if (ws && ws.readyState === 1) {
                              ws.send('42["instruments/update",{"asset":"$asset","period":$_tradeDuration}]');
                              ws.send('42["depth/follow","$asset"]');
                            }
                          }
                        }
                      } catch(e) {}
                    })();
                  ''');
                } catch (_) {}
              }
            }

            double _computeEma(List<double> data, int period) {
              if (data.isEmpty) return 0.0;
              if (data.length < period) {
                return data.reduce((a, b) => a + b) / data.length;
              }
              final double k = 2.0 / (period + 1);
              double ema = data.sublist(0, period).reduce((a, b) => a + b) / period;
              for (int i = period; i < data.length; i++) {
                ema = (data[i] * k) + (ema * (1.0 - k));
              }
              return ema;
            }

            void _calculateIndicators() {
              if (_priceHistory.length < 4) return;

              _emaFast = _computeEma(_priceHistory, 6);
              _emaSlow = _computeEma(_priceHistory, 18);
              _priceMomentum = _priceHistory.last - _priceHistory[max(0, _priceHistory.length - 5)];

              final int window = min(14, _priceHistory.length - 1);
              double gains = 0.0;
              double losses = 0.0;
              for (int i = _priceHistory.length - window; i < _priceHistory.length; i++) {
                final diff = _priceHistory[i] - _priceHistory[i - 1];
                if (diff > 0) {
                  gains += diff;
                } else {
                  losses -= diff;
                }
              }
              final avgGain = gains / window;
              final avgLoss = losses / window;
              if (avgLoss == 0 && avgGain == 0) {
                _currentRsi = 50.0;
              } else if (avgLoss == 0) {
                _currentRsi = 82.0;
              } else {
                final rs = avgGain / avgLoss;
                _currentRsi = 100.0 - (100.0 / (1.0 + rs));
              }
            }

            void toggleAutoTrading() {
              if (_isAutoTrading) {
                stopAutoTrading(reason: "تم إيقاف البوت الآلي يدوياً.");
              } else {
                startAutoTrading();
              }
            }

            void startAutoTrading() {
              if (!_isConnected) {
                addLog("تنبيه: يرجى ربط الحساب من تبويب المنصة أولاً قبل تشغيل البوت.");
                return;
              }
              _isAutoTrading = true;
              _currentTradeAmount = _baseAmount;
              _subscribeToAsset(activeAsset);
              addLog("تم تفعيل البوت الآلي الذكي على الزوج $activeAsset 🤖");
              notifyListeners();

              if (!_isTradeOpen) {
                _executeStrategyCycle();
              }
            }

            void stopAutoTrading({String? reason}) {
              _isAutoTrading = false;
              if (reason != null) addLog(reason);
              notifyListeners();
            }

            Future<void> _executeStrategyCycle() async {
              if (!_isAutoTrading || !_isConnected || _isTradeOpen) return;

              await _subscribeToAsset(activeAsset);

              if (_priceHistory.length < 6) {
                _lastSignal = "تجميع قراءات السعر (${_priceHistory.length}/6)...";
                addLog("⏳ جاري تجميع قراءات السعر الحية (${_priceHistory.length}/6) قبل إصدار الإشارة...");
                notifyListeners();
                Future.delayed(const Duration(seconds: 3), () {
                  if (_isAutoTrading && !_isTradeOpen) _executeStrategyCycle();
                });
                return;
              }

              _calculateIndicators();

              final double price = _lastPrice;
              final double lastStep = _priceHistory.last - _priceHistory[_priceHistory.length - 2];
              final double prevStep = _priceHistory[_priceHistory.length - 2] - _priceHistory[_priceHistory.length - 3];

              String direction = "call";
              String reason = "";

              if (_strategy == "qumatix_rsi_ema") {
                // قواعد استراتيجية QuMatix المصححة:
                // 1) عدم الشراء أبداً في التشبع الشرائي (RSI >= 60) بل البيع مع الارتداد الهابط!
                // 2) عدم البيع أبداً في التشبع البيعي (RSI <= 40) بل الشراء مع الارتداد الصاعد!
                if (_currentRsi >= 60.0) {
                  direction = "put";
                  reason = "تشبع شرائي عند القمة (RSI: ${_currentRsi.toStringAsFixed(1)}) -> بيع ارتدادي PUT";
                } else if (_currentRsi <= 40.0) {
                  direction = "call";
                  reason = "تشبع بيعي عند القاع (RSI: ${_currentRsi.toStringAsFixed(1)}) -> شراء ارتدادي CALL";
                } else if (_emaFast > _emaSlow && _priceMomentum > 0 && lastStep >= 0) {
                  direction = "call";
                  reason = "مسار صاعد مؤكد EMA6>EMA18 (RSI: ${_currentRsi.toStringAsFixed(1)}) -> شراء CALL";
                } else if (_emaFast < _emaSlow && _priceMomentum < 0 && lastStep <= 0) {
                  direction = "put";
                  reason = "مسار هابط مؤكد EMA6<EMA18 (RSI: ${_currentRsi.toStringAsFixed(1)}) -> بيع PUT";
                } else if (lastStep > 0 && prevStep > 0) {
                  direction = "call";
                  reason = "شموع صاعدة متتالية عند $price (RSI: ${_currentRsi.toStringAsFixed(1)}) -> CALL";
                } else {
                  direction = "put";
                  reason = "ضغط بيعي هابط عند $price (RSI: ${_currentRsi.toStringAsFixed(1)}) -> PUT";
                }
              } else if (_strategy == "trend_momentum") {
                if (_emaFast >= _emaSlow && _currentRsi < 68) {
                  direction = "call";
                  reason = "زخم صاعد مستمر (RSI: ${_currentRsi.toStringAsFixed(1)}) -> CALL";
                } else {
                  direction = "put";
                  reason = "زخم هابط مستمر (RSI: ${_currentRsi.toStringAsFixed(1)}) -> PUT";
                }
              } else {
                // قناص الارتداد (Bollinger + RSI)
                final double mean = _priceHistory.reduce((a, b) => a + b) / _priceHistory.length;
                if (price >= mean || _currentRsi >= 52) {
                  direction = "put";
                  reason = "ارتداد هابط من فوق المتوسط (RSI: ${_currentRsi.toStringAsFixed(1)}) -> PUT";
                } else {
                  direction = "call";
                  reason = "ارتداد صاعد من تحت المتوسط (RSI: ${_currentRsi.toStringAsFixed(1)}) -> CALL";
                }
              }

              _lastSignal = "${direction.toUpperCase()} | RSI: ${_currentRsi.toStringAsFixed(1)}";
              addLog("📊 إشارة الاستراتيجية: $reason");
              await placeOrder(
                asset: activeAsset,
                direction: direction,
                amount: _currentTradeAmount,
                duration: _tradeDuration,
              );
            }

            Future<void> placeOrder({
              required String asset,
              required String direction,
              required double amount,
              required int duration,
            }) async {
              if (!_isConnected) {
                addLog("تنبيه: اربط حسابك أولاً من شاشة المنصة لتنفيذ الصفقات.");
                return;
              }
              if (_isTradeOpen) {
                addLog("⏳ توجد صفقة جارية حالياً (متبقي ${_remainingSeconds}s) — انتظر إغلاقها.");
                return;
              }

              final targetAsset = asset == "AUTO_CHART" ? _chartDetectedAsset : asset;

              _isTradeOpen = true;
              _remainingSeconds = duration;
              _activeTradeEntryPrice = _lastPrice;
              _activeTradeBalanceBefore = _balance;
              _activeTradeDirection = direction.toLowerCase();
              _activeTradeAsset = targetAsset;
              _activeTradeAmount = amount;
              _totalTrades++;
              notifyListeners();

              final orderData = jsonEncode({
                "asset": targetAsset,
                "amount": amount,
                "action": direction.toLowerCase(),
                "time": duration,
                "isDemo": _accountType == "demo" ? 1 : 0,
                "tournamentId": 0,
                "requestId": DateTime.now().millisecondsSinceEpoch,
                "optionType": 100,
              });

              final orderPacket = '42["orders/open",$orderData]';

              // إرسال أمر واحد فقط عبر WebSocket المفتوح في المنصة لمنع تكرار الصفقة مرتين
              if (_webViewController != null) {
                try {
                  final isCall = direction.toLowerCase() == "call";
                  await _webViewController!.evaluateJavascript(source: '''
                    (function() {
                      try {
                        let sentViaWs = false;
                        if (window.__qm_sockets && window.__qm_sockets.length > 0) {
                          for (let ws of window.__qm_sockets) {
                            if (ws && ws.readyState === 1) {
                              ws.send('$orderPacket');
                              sentViaWs = true;
                              break;
                            }
                          }
                        }
                        if (!sentViaWs) {
                          const upBtn = document.querySelector('.call-btn, [class*="btn-call"], [class*="button--call"], .section-deal__put-call .btn-green');
                          const downBtn = document.querySelector('.put-btn, [class*="btn-put"], [class*="button--put"], .section-deal__put-call .btn-red');
                          if (${isCall ? 'true' : 'false'} && upBtn) upBtn.click();
                          else if (!${isCall ? 'true' : 'false'} && downBtn) downBtn.click();
                        }
                      } catch(e) {}
                    })();
                  ''');
                } catch (_) {}
              }

              addLog("🚀 فتح صفقة ${direction.toUpperCase()} على $targetAsset بمبلغ \$$amount عند السعر $_activeTradeEntryPrice (المدة: ${duration}s)");

              // مؤقت عد تنازلي لمتابعة إغلاق الصفقة وتقييم الربح أو الخسارة بدقة
              _tradeLifecycleTimer?.cancel();
              _tradeLifecycleTimer = Timer.periodic(const Duration(seconds: 1), (timer) {
                if (_remainingSeconds > 0) {
                  _remainingSeconds--;
                  notifyListeners();
                } else {
                  timer.cancel();
                  _finalizeAndEvaluateTrade();
                }
              });
            }

            Future<void> _finalizeAndEvaluateTrade() async {
              // انتظار ثانيتين لتحديث الرصيد النهائي من السيرفر بعد إغلاق الشمعة
              await Future.delayed(const Duration(seconds: 2));

              final double exitPrice = _lastPrice;
              final double currentBal = _balance;
              bool isWin = false;

              // التقييم الأول: مقارنة الرصيد الفعلي قبل وبعد الصفقة إذا كان الرصيد مقروءاً
              if (_activeTradeBalanceBefore > 0 && currentBal > 0 && (currentBal - _activeTradeBalanceBefore).abs() > 0.01) {
                isWin = currentBal > _activeTradeBalanceBefore;
              } else {
                // التقييم الثاني: مقارنة سعر الدخول بسعر الإغلاق الفعلي من السيرفر
                if (_activeTradeDirection == "call") {
                  isWin = exitPrice > _activeTradeEntryPrice;
                } else {
                  isWin = exitPrice < _activeTradeEntryPrice;
                }
              }

              if (isWin) {
                _wonTrades++;
                final double estProfit = (_activeTradeBalanceBefore > 0 && currentBal > _activeTradeBalanceBefore)
                    ? (currentBal - _activeTradeBalanceBefore)
                    : (_activeTradeAmount * 0.88);
                _currentTradeAmount = _baseAmount;
                addLog("✔ صفقة رابحة (+ \$${estProfit.toStringAsFixed(2)}) | سعر الدخول: $_activeTradeEntryPrice -> الإغلاق: $exitPrice | العودة للمبلغ الأساسي: \$$_baseAmount");
              } else {
                _lostTrades++;
                if (_useMartingale) {
                  _currentTradeAmount = double.parse((_currentTradeAmount * _martingaleMultiplier).toStringAsFixed(2));
                  addLog("✖ صفقة خاسرة (-\$$_activeTradeAmount) | سعر الدخول: $_activeTradeEntryPrice -> الإغلاق: $exitPrice | مضاعفة الصفقة القادمة: \$$_currentTradeAmount");
                } else {
                  _currentTradeAmount = _baseAmount;
                  addLog("✖ صفقة خاسرة (-\$$_activeTradeAmount) | سعر الدخول: $_activeTradeEntryPrice -> الإغلاق: $exitPrice");
                }
              }

              _isTradeOpen = false;
              _remainingSeconds = 0;
              notifyListeners();

              // فحص هدف الربح ووقف الخسارة
              if (_isAutoTrading) {
                if (_initialSessionBalance > 0 && netProfit >= _takeProfitTarget) {
                  stopAutoTrading(reason: "🎯 تم الوصول إلى هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)})");
                  return;
                }
                if (_initialSessionBalance > 0 && netProfit <= -_stopLossLimit) {
                  stopAutoTrading(reason: "🛑 تم الوصول إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)})");
                  return;
                }
                // الدخول في الصفقة التالية بعد 3 ثوانٍ وفق قراءة المؤشر الجديدة
                Future.delayed(const Duration(seconds: 3), () {
                  if (_isAutoTrading && !_isTradeOpen) {
                    _executeStrategyCycle();
                  }
                });
              }
            }

            Future<void> disconnect() async {
              stopAutoTrading();
              _tradeLifecycleTimer?.cancel();
              _isTradeOpen = false;
              _pingTimer?.cancel();
              _webSyncTimer?.cancel();
              await _socket?.close();
              _socket = null;
              _isConnected = false;
              _isAuthenticated = false;
              addLog("تم قطع الاتصال بالسيرفر.");
              notifyListeners();
            }

            @override
            void dispose() {
              disconnect();
              super.dispose();
            }
          }
          EOF

      - name: Generate login_screen.dart (Captures Live Balance, Active Chart Pair & Ticks)
        run: |
          mkdir -p lib/screens
          cat << 'EOF' > lib/screens/login_screen.dart
          import 'dart:collection';
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          import 'package:provider/provider.dart';
          import '../services/quotex_service.dart';

          class QuotexPlatformView extends StatefulWidget {
            final VoidCallback onConnectedSuccess;
            const QuotexPlatformView({super.key, required this.onConnectedSuccess});

            @override
            State<QuotexPlatformView> createState() => _QuotexPlatformViewState();
          }

          class _QuotexPlatformViewState extends State<QuotexPlatformView> {
            InAppWebViewController? _webViewController;
            bool _isLoading = true;
            String? _webError;
            String _currentDomain = "quotex.io";

            final List<String> _domains = [
              "quotex.io",
              "market-qx.pro",
              "qxbroker.com",
              "quotex.com",
            ];

            final String _wsHookScript = '''
              (function() {
                if (window.__qm_hooked) return;
                window.__qm_hooked = true;
                window.__qm_sockets = [];
                window.__qm_auth_token = null;
                window.__qm_ws_url = null;
                window.__qm_last_price = 0;
                window.__qm_latest_asset = 'EURUSD_otc';
                window.__qm_ws_balance = null;
                window.__qm_prices = [];
                window.__qm_asset_prices = {};

                function recordPrice(asset, price) {
                  const p = parseFloat(price);
                  if (isNaN(p) || p <= 0) return;
                  window.__qm_last_price = p;
                  if (asset && typeof asset === 'string') {
                    window.__qm_latest_asset = asset;
                    if (!window.__qm_asset_prices[asset]) window.__qm_asset_prices[asset] = [];
                    const arr = window.__qm_asset_prices[asset];
                    if (arr.length === 0 || arr[arr.length - 1] !== p) {
                      arr.push(p);
                      if (arr.length > 100) arr.shift();
                    }
                  }
                  const g = window.__qm_prices;
                  if (g.length === 0 || g[g.length - 1] !== p) {
                    g.push(p);
                    if (g.length > 100) g.shift();
                  }
                }

                function scanJsonForTicks(node) {
                  if (!node) return;
                  if (Array.isArray(node)) {
                    if (node.length >= 3 && typeof node[0] === 'string' && typeof node[1] === 'number' && typeof node[2] === 'number') {
                      if (node[1] > 1500000000 && node[2] > 0) {
                        recordPrice(node[0], node[2]);
                        return;
                      }
                    }
                    if (node.length >= 3 && typeof node[0] === 'number' && typeof node[1] === 'number' && typeof node[2] === 'number') {
                      if (node[0] > 1500000000 && node[2] > 0 && node[2] < 1000000) {
                        recordPrice(window.__qm_latest_asset || 'EURUSD_otc', node[2]);
                        return;
                      }
                    }
                    for (let i = 0; i < node.length; i++) {
                      scanJsonForTicks(node[i]);
                    }
                  } else if (typeof node === 'object') {
                    if (typeof node.demoBalance === 'number' && node.demoBalance > 0) {
                      window.__qm_ws_balance = node.demoBalance;
                    } else if (typeof node.balance === 'number' && node.balance >= 0) {
                      window.__qm_ws_balance = node.balance;
                    }
                    if (typeof node.asset === 'string' && node.asset.length > 2) {
                      window.__qm_latest_asset = node.asset;
                    }
                    if (typeof node.price === 'number' && node.price > 0) {
                      recordPrice(node.asset || window.__qm_latest_asset, node.price);
                    }
                    if (typeof node.close === 'number' && node.close > 0) {
                      recordPrice(node.asset || window.__qm_latest_asset, node.close);
                    }
                    if (Array.isArray(node.candles)) scanJsonForTicks(node.candles);
                    if (Array.isArray(node.history)) scanJsonForTicks(node.history);
                    if (Array.isArray(node.quotes)) scanJsonForTicks(node.quotes);
                    if (Array.isArray(node.data)) scanJsonForTicks(node.data);
                  }
                }

                function handleRawText(txt) {
                  if (!txt || typeof txt !== 'string' || txt.length < 4) return;
                  try {
                    const b1 = txt.indexOf('[');
                    const b2 = txt.indexOf('{');
                    let idx = -1;
                    if (b1 !== -1 && (b2 === -1 || b1 < b2)) idx = b1;
                    else if (b2 !== -1) idx = b2;
                    if (idx === -1) return;
                    const parsed = JSON.parse(txt.substring(idx));
                    scanJsonForTicks(parsed);
                  } catch (e) {}
                }

                function attachListenerToSocket(ws) {
                  if (!ws || ws.__qm_listened) return;
                  ws.__qm_listened = true;
                  ws.addEventListener('message', function(ev) {
                    try {
                      const d = ev.data;
                      if (typeof d === 'string') {
                        handleRawText(d);
                      } else if (d instanceof ArrayBuffer) {
                        const dec = new TextDecoder('utf-8').decode(new Uint8Array(d));
                        handleRawText(dec);
                      } else if (typeof Blob !== 'undefined' && d instanceof Blob) {
                        const reader = new FileReader();
                        reader.onload = function() {
                          if (typeof reader.result === 'string') handleRawText(reader.result);
                        };
                        reader.readAsText(d);
                      }
                    } catch (e) {}
                  });
                }

                const origProtoSend = WebSocket.prototype.send;
                WebSocket.prototype.send = function(data) {
                  try {
                    if (window.__qm_sockets.indexOf(this) === -1) {
                      window.__qm_sockets.push(this);
                      window.__qm_ws_url = this.url;
                    }
                    attachListenerToSocket(this);
                    if (typeof data === 'string') {
                      if (data.indexOf('authorization') !== -1) {
                        const m = data.match(/"session"\\s*:\\s*"([^"]+)"/);
                        if (m && m[1]) window.__qm_auth_token = m[1];
                      }
                      if (data.indexOf('instruments/update') !== -1 || data.indexOf('depth/follow') !== -1) {
                        const mAsset = data.match(/"asset"\\s*:\\s*"([^"]+)"/) || data.match(/"depth\\/follow"\\s*,\\s*"([^"]+)"/);
                        if (mAsset && mAsset[1]) window.__qm_latest_asset = mAsset[1];
                      }
                    }
                  } catch (e) {}
                  return origProtoSend.apply(this, arguments);
                };

                const OrigWS = window.WebSocket;
                window.WebSocket = function(url, protocols) {
                  const ws = protocols ? new OrigWS(url, protocols) : new OrigWS(url);
                  window.__qm_ws_url = url;
                  if (window.__qm_sockets.indexOf(ws) === -1) window.__qm_sockets.push(ws);
                  attachListenerToSocket(ws);
                  return ws;
                };
                window.WebSocket.prototype = OrigWS.prototype;
                window.WebSocket.CONNECTING = OrigWS.CONNECTING;
                window.WebSocket.OPEN = OrigWS.OPEN;
                window.WebSocket.CLOSING = OrigWS.CLOSING;
                window.WebSocket.CLOSED = OrigWS.CLOSED;
              })();
            ''';

            Future<void> _extractAndConnect({bool manualTrigger = false}) async {
              if (_webViewController == null) return;
              final service = context.read<QuotexService>();

              try {
                final currentWebUri = await _webViewController!.getUrl();
                final urlStr = currentWebUri?.toString() ?? "https://$_currentDomain";
                final host = currentWebUri?.host.isNotEmpty == true ? currentWebUri!.host : _currentDomain;

                final cookieManager = CookieManager.instance();
                final cookies = await cookieManager.getCookies(url: WebUri("https://$host"));
                final cookieHeader = cookies.map((c) => "${c.name}=${c.value}").join("; ");

                String? foundToken;
                for (var c in cookies) {
                  final name = c.name.toLowerCase();
                  if (name.contains('ssid') || name.contains('token') || name.contains('remember') || name.contains('session') || name.contains('lid')) {
                    if (c.value.toString().isNotEmpty) {
                      foundToken = c.value.toString();
                      break;
                    }
                  }
                }

                final jsRes = await _webViewController!.evaluateJavascript(source: '''
                  (function() {
                    try {
                      let tok = window.__qm_auth_token || (window.settings && window.settings.token) || '';
                      let bal = '';
                      if (window.__qm_ws_balance !== null && window.__qm_ws_balance !== undefined) {
                        bal = String(window.__qm_ws_balance);
                      }
                      if (!bal) {
                        const topNodes = document.querySelectorAll('div, span, b, p');
                        for (let i = 0; i < topNodes.length; i++) {
                          const el = topNodes[i];
                          if (el.children.length <= 1 && el.innerText) {
                            const rect = el.getBoundingClientRect();
                            if (rect.top >= 0 && rect.top < 140 && rect.width > 10) {
                              const m = el.innerText.match(/[\x24€£৳₹¥]\s*[0-9,]+(\.[0-9]{1,2})?/);
                              if (m && m[0]) {
                                bal = m[0];
                                break;
                              }
                            }
                          }
                        }
                      }
                      const isTradeRoom = window.location.pathname.includes('trade') || document.querySelector('.call-btn, [class*="btn-call"], [class*="usermenu"]') !== null;
                      return JSON.stringify({
                        token: tok,
                        balance: bal,
                        isTradeRoom: isTradeRoom
                      });
                    } catch(e) {
                      return JSON.stringify({token: '', balance: '', isTradeRoom: false});
                    }
                  })();
                ''');

                String jsToken = "";
                String detectedBalance = "";
                bool isTradeRoom = urlStr.contains("/trade") || urlStr.contains("demo-trade");

                if (jsRes != null) {
                  final raw = jsRes.toString();
                  final decoded = raw.startsWith('"') ? jsonDecode(raw) : raw;
                  final map = decoded is String ? jsonDecode(decoded) : decoded;
                  if (map is Map) {
                    jsToken = map['token']?.toString() ?? "";
                    detectedBalance = map['balance']?.toString() ?? "";
                    if (map['isTradeRoom'] == true) isTradeRoom = true;
                  }
                }

                final effectiveToken = jsToken.isNotEmpty
                    ? jsToken
                    : (foundToken ?? (cookies.isNotEmpty ? cookies.first.value.toString() : "active_web_session"));

                final bool isSignedIn = isTradeRoom || jsToken.isNotEmpty || foundToken != null || (!urlStr.contains("sign-in") && !urlStr.contains("login") && cookies.length >= 2);

                if (isSignedIn || manualTrigger) {
                  service.attachWebViewController(_webViewController!);
                  await service.connect(
                    ssidToken: effectiveToken,
                    isRealAccount: service.accountType == "real",
                    domain: host,
                    cookieHeader: cookieHeader,
                    detectedBalance: detectedBalance,
                  );

                  if (mounted && manualTrigger) {
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(
                        content: Text("تم ربط الرصيد والشارت الحي بالبوت بنجاح ✔"),
                        backgroundColor: Color(0xFF10B981),
                        duration: Duration(seconds: 2),
                      ),
                    );
                    widget.onConnectedSuccess();
                  }
                }
              } catch (_) {
                if (manualTrigger && mounted) {
                  service.attachWebViewController(_webViewController!);
                  await service.connect(
                    ssidToken: "webview_bridge_session",
                    isRealAccount: service.accountType == "real",
                    domain: _currentDomain,
                  );
                  widget.onConnectedSuccess();
                }
              }
            }

            void _switchDomain(String dom) {
              setState(() {
                _currentDomain = dom;
                _isLoading = true;
                _webError = null;
              });
              _webViewController?.loadUrl(
                urlRequest: URLRequest(
                  url: WebUri("https://$_currentDomain/ar/sign-in"),
                ),
              );
            }

