                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 16),
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(
                        color: const Color(0xFF111827),
                        borderRadius: BorderRadius.circular(18),
                        border: Border.all(color: Colors.white10),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Row(
                            children: [
                              Icon(Icons.terminal_rounded, color: Color(0xFF10B981), size: 20),
                              SizedBox(width: 8),
                              Text("سجل عمليات السيرفر المباشر", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                            ],
                          ),
                          const SizedBox(height: 10),
                          Container(
                            height: 260,
                            width: double.infinity,
                            padding: const EdgeInsets.all(10),
                            decoration: BoxDecoration(
                              color: const Color(0xFF05080F),
                              borderRadius: BorderRadius.circular(12),
                              border: Border.all(color: Colors.white10),
                            ),
                            child: service.logs.isEmpty
                                ? const Center(
                                    child: Text("لا توجد أحداث مسجلة بعد...", style: TextStyle(color: Colors.white38, fontSize: 12)),
                                  )
                                : ListView.builder(
                                    itemCount: service.logs.length,
                                    itemBuilder: (context, idx) => Padding(
                                      padding: const EdgeInsets.symmetric(vertical: 2),
                                      child: Text(
                                        service.logs[idx],
                                        style: const TextStyle(color: Color(0xFF34D399), fontSize: 11.5, fontFamily: 'monospace'),
                                      ),
                                    ),
                                  ),
                          ),
                        ],
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _strengthChip(int pct, String label) {
              final selected = _selectedMinStrength == pct;
              return GestureDetector(
                onTap: () {
                  setState(() => _selectedMinStrength = pct);
                  _syncSettings(context.read<QuotexService>());
                },
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7),
                  decoration: BoxDecoration(
                    color: selected ? const Color(0xFF10B981) : const Color(0xFF0B0F19),
                    borderRadius: BorderRadius.circular(9),
                    border: Border.all(
                      color: selected ? const Color(0xFF34D399) : Colors.white12,
                    ),
                  ),
                  child: Text(
                    label,
                    style: TextStyle(
                      fontSize: 11.5,
                      fontWeight: selected ? FontWeight.bold : FontWeight.normal,
                      color: selected ? Colors.white : Colors.white70,
                    ),
                  ),
                ),
              );
            }

            Widget _accountSegmentButton({
              required String title,
              required bool selected,
              required Color activeColor,
              required VoidCallback onTap,
            }) {
              return GestureDetector(
                onTap: onTap,
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 7),
                  decoration: BoxDecoration(
                    color: selected ? activeColor : Colors.transparent,
                    borderRadius: BorderRadius.circular(9),
                  ),
                  child: Text(
                    title,
                    style: TextStyle(
                      fontSize: 12,
                      fontWeight: selected ? FontWeight.bold : FontWeight.normal,
                      color: selected ? Colors.white : Colors.white60,
                    ),
                  ),
                ),
              );
            }

            Widget _metricCard({
              required String title,
              required String value,
              required IconData icon,
              required Color color,
            }) {
              return Container(
                padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 8),
                decoration: BoxDecoration(
                  color: const Color(0xFF111827),
                  borderRadius: BorderRadius.circular(14),
                  border: Border.all(color: Colors.white10),
                ),
                child: Column(
                  children: [
                    Icon(icon, color: color, size: 20),
                    const SizedBox(height: 6),
                    Text(
                      value,
                      style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: color),
                    ),
                    const SizedBox(height: 2),
                    Text(
                      title,
                      textAlign: TextAlign.center,
                      style: const TextStyle(fontSize: 10, color: Colors.white60),
                    ),
                  ],
                ),
              );
            }

            Widget _durationChip(int seconds, String label) {
              final selected = _selectedDuration == seconds;
              return GestureDetector(
                onTap: () {
                  setState(() => _selectedDuration = seconds);
                  _syncSettings(context.read<QuotexService>());
                },
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 13, vertical: 8),
                  decoration: BoxDecoration(
                    color: selected ? const Color(0xFF2563EB) : const Color(0xFF0B0F19),
                    borderRadius: BorderRadius.circular(10),
                    border: Border.all(
                      color: selected ? const Color(0xFF60A5FA) : Colors.white12,
                    ),
                  ),
                  child: Text(
                    label,
                    style: TextStyle(
                      fontSize: 12,
                      fontWeight: selected ? FontWeight.bold : FontWeight.normal,
                      color: selected ? Colors.white : Colors.white70,
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Configure Gradle MinSdk
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          fi

      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuMatix-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
