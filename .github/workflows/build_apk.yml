              final time = "${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')}";
              _logs.insert(0, "[$time] $message");
              if (_logs.length > 150) _logs.removeLast();
              notifyListeners();
            }

