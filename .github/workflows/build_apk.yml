                        if (Array.isArray(c) && c.length >= 3 && typeof c[2] === 'number') {
                          recordLiveStreamTick(node.asset, c[2], true);
                        }
                      }
                    }
                    if (Array.isArray(node.quotes)) scanJsonForTicks(node.quotes);
                    if (Array.isArray(node.data)) scanJsonForTicks(node.data);
                    if (Array.isArray(node.history)) scanJsonForTicks(node.history);
                    if (Array.isArray(node.deals)) scanJsonForTicks(node.deals);
                  }
                }

                function handleRawText(txt) {
                  if (!txt || typeof txt !== 'string' || txt.length < 4) return;
                  try {
                    if (txt.length < 800 && txt.toLowerCase().indexOf('error') !== -1) window.__qm_last_srv_msg = txt.substring(0, 300);
                    if (txt.indexOf('"openPrice"') !== -1 && txt.indexOf('"id"') !== -1) {
                      window.__qm_last_order_accepted = true;
                    }
                    const b1 = txt.indexOf('[');
                    const b2 = txt.indexOf('{');
                    let idx = -1;
                    if (b1 !== -1 && (b2 === -1 || b1 < b2)) idx = b1;
                    else if (b2 !== -1) idx = b2;
                    if (idx === -1) return;
                    const parsed = JSON.parse(txt.substring(idx));
                    scanJsonForTicks(parsed);
                  } catch (e) {}
                }

                function attachListenerToSocket(ws) {
                  if (!ws || ws.__qm_listened) return;
                  ws.__qm_listened = true;
                  ws.addEventListener('message', function(ev) {
                    try {
                      const d = ev.data;
                      if (typeof d === 'string') {
                        handleRawText(d);
                      } else if (d instanceof ArrayBuffer) {
                        const dec = new TextDecoder('utf-8').decode(new Uint8Array(d));
                        handleRawText(dec);
                      } else if (typeof Blob !== 'undefined' && d instanceof Blob) {
                        const reader = new FileReader();
                        reader.onload = function() {
                          if (typeof reader.result === 'string') handleRawText(reader.result);
                        };
                        reader.readAsText(d);
                      }
                    } catch (e) {}
                  });
                }

                const origProtoSend = WebSocket.prototype.send;
                WebSocket.prototype.send = function(data) {
                  try {
                    if (window.__qm_sockets.indexOf(this) === -1) {
                      window.__qm_sockets.push(this);
                    }
                    attachListenerToSocket(this);
                    if (typeof data === 'string' && data.indexOf('authorization') !== -1) {
                      const m = data.match(/"session"\\s*:\\s*"([^"]+)"/);
                      if (m && m[1]) window.__qm_auth_token = m[1];
                    }
                  } catch (e) {}
                  return origProtoSend.apply(this, arguments);
                };

                const OrigWS = window.WebSocket;
                window.WebSocket = function(url, protocols) {
                  const ws = protocols ? new OrigWS(url, protocols) : new OrigWS(url);
                  if (window.__qm_sockets.indexOf(ws) === -1) window.__qm_sockets.push(ws);
                  attachListenerToSocket(ws);
                  return ws;
                };
                window.WebSocket.prototype = OrigWS.prototype;
                window.WebSocket.CONNECTING = OrigWS.CONNECTING;
                window.WebSocket.OPEN = OrigWS.OPEN;
                window.WebSocket.CLOSING = OrigWS.CLOSING;
                window.WebSocket.CLOSED = OrigWS.CLOSED;
              })();
            ''';

            Future<void> _extractAndConnect({bool manualTrigger = false}) async {
              if (_webViewController == null) return;
              final service = context.read<QuotexService>();

              try {
                final currentWebUri = await _webViewController!.getUrl();
                final urlStr = currentWebUri?.toString() ?? "https://$_currentDomain";
                final host = currentWebUri?.host.isNotEmpty == true ? currentWebUri!.host : _currentDomain;

                final cookieManager = CookieManager.instance();
                final cookies = await cookieManager.getCookies(url: WebUri("https://$host"));
                final cookieHeader = cookies.map((c) => "${c.name}=${c.value}").join("; ");

                final jsRes = await _webViewController!.evaluateJavascript(source: '''
                  (function() {
                    try {
                      let tok = window.__qm_auth_token || (window.settings && window.settings.token) || '';
                      let bal = '';
                      if (window.__qm_ws_balance !== null && window.__qm_ws_balance !== undefined && Number(window.__qm_ws_balance) > 0) {
                        bal = String(window.__qm_ws_balance);
                      }
                      if (!bal && document.body) {
                        const bodyTxt = document.body.innerText || '';
                        const m1 = bodyTxt.match(/(?:تجريبي|مباشر|حقيقي|Demo|Live|Real)[^0-9]{0,25}([0-9,]+\\.[0-9]{2})/i);
                        if (m1 && m1[1]) {
                          bal = m1[1];
                        } else {
                          const topSlice = bodyTxt.substring(0, 450);
                          const m2 = topSlice.match(/([0-9,]+\\.[0-9]{2})/);
                          if (m2 && m2[1]) bal = m2[1];
                        }
                      }
                      const isTradeRoom = window.location.pathname.includes('trade') || document.querySelector('.call-btn, [class*="btn-call"], [class*="usermenu"]') !== null;
                      return JSON.stringify({
                        token: tok,
                        balance: bal,
                        isTradeRoom: isTradeRoom
                      });
                    } catch(e) {
                      return JSON.stringify({token: '', balance: '', isTradeRoom: false});
                    }
                  })();
                ''');

                String jsToken = "";
                String detectedBalance = "";
                bool isTradeRoom = urlStr.contains("/trade") || urlStr.contains("demo-trade");

                if (jsRes != null) {
                  final raw = jsRes.toString();
                  final decoded = raw.startsWith('"') ? jsonDecode(raw) : raw;
                  final map = decoded is String ? jsonDecode(decoded) : decoded;
                  if (map is Map) {
                    jsToken = map['token']?.toString() ?? "";
                    detectedBalance = map['balance']?.toString() ?? "";
                    if (map['isTradeRoom'] == true) isTradeRoom = true;
                  }
                }

                final bool isSignedIn = isTradeRoom || jsToken.isNotEmpty || (!urlStr.contains("sign-in") && !urlStr.contains("login") && cookies.length >= 2);

                if (isSignedIn || manualTrigger) {
                  service.attachWebViewController(_webViewController!);
                  await service.connect(
                    ssidToken: jsToken.isNotEmpty ? jsToken : "active_web_session",
                    isRealAccount: service.accountType == "real",
                    domain: host,
                    cookieHeader: cookieHeader,
                    detectedBalance: detectedBalance,
                  );

                  if (mounted && manualTrigger) {
                    ScaffoldMessenger.of(context).showSnackBar(
                      const SnackBar(
                        content: Text("تم ربط الرصيد ورادار الدقيقة الواحدة بالسيرفر بنجاح ✔"),
                        backgroundColor: Color(0xFF10B981),
                        duration: Duration(seconds: 2),
                      ),
                    );
                    widget.onConnectedSuccess();
                  }
                }
              } catch (_) {
                if (manualTrigger && mounted) {
                  service.attachWebViewController(_webViewController!);
                  await service.connect(
                    ssidToken: "webview_bridge_session",
                    isRealAccount: service.accountType == "real",
                    domain: _currentDomain,
                  );
                  widget.onConnectedSuccess();
                }
              }
            }

            void _switchDomain(String dom) {
              setState(() {
                _currentDomain = dom;
                _isLoading = true;
                _webError = null;
              });
              _webViewController?.loadUrl(
                urlRequest: URLRequest(
                  url: WebUri("https://$_currentDomain/ar/sign-in"),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final service = context.watch<QuotexService>();

              return Column(
                children: [
                  Container(
                    padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                    decoration: const BoxDecoration(
                      color: Color(0xFF111827),
                      border: Border(bottom: BorderSide(color: Color(0xFF1F2937))),
                    ),
                    child: Column(
                      children: [
                        Row(
                          children: [
                            const Icon(Icons.dns_rounded, size: 16, color: Color(0xFF10B981)),
                            const SizedBox(width: 6),
                            const Text(
                              "النطاق:",
                              style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: Colors.white70),
                            ),
                            const SizedBox(width: 8),
                            Expanded(
                              child: SizedBox(
                                height: 32,
                                child: ListView.separated(
                                  scrollDirection: Axis.horizontal,
                                  itemCount: _domains.length,
                                  separatorBuilder: (_, __) => const SizedBox(width: 6),
                                  itemBuilder: (context, i) {
                                    final dom = _domains[i];
                                    final selected = dom == _currentDomain;
                                    return GestureDetector(
                                      onTap: () => _switchDomain(dom),
                                      child: Container(
                                        padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                                        decoration: BoxDecoration(
                                          color: selected ? const Color(0xFF2563EB) : const Color(0xFF1F2937),
                                          borderRadius: BorderRadius.circular(16),
                                          border: Border.all(
                                            color: selected ? const Color(0xFF60A5FA) : Colors.white12,
                                          ),
                                        ),
                                        child: Text(
                                          dom,
                                          style: TextStyle(
                                            fontSize: 11.5,
                                            fontWeight: selected ? FontWeight.bold : FontWeight.normal,
                                            color: Colors.white,
                                          ),
                                        ),
                                      ),
                                    );
                                  },
                                ),
                              ),
                            ),
                            IconButton(
                              icon: const Icon(Icons.refresh_rounded, size: 20, color: Colors.white70),
                              padding: EdgeInsets.zero,
                              constraints: const BoxConstraints(),
                              onPressed: () {
                                setState(() {
                                  _isLoading = true;
                                  _webError = null;
                                });
                                _webViewController?.reload();
                              },
                            ),
                          ],
                        ),
                        const SizedBox(height: 8),
                        SizedBox(
                          width: double.infinity,
                          height: 38,
                          child: ElevatedButton.icon(
                            style: ElevatedButton.styleFrom(
                              backgroundColor: service.isConnected ? const Color(0xFF059669) : const Color(0xFF10B981),
                              foregroundColor: Colors.white,
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                              elevation: 0,
                            ),
                            onPressed: () => _extractAndConnect(manualTrigger: true),
                            icon: Icon(
                              service.isConnected ? Icons.verified_rounded : Icons.bolt_rounded,
                              size: 18,
                            ),
                            label: Text(
                              service.isConnected
                                  ? "الحساب مربوط بالبوت بنجاح — اضغط للعودة للوحة التحكم ✔"
                                  : "بعد تسجيل الدخول اضغط هنا لتفعيل البوت على حسابك ✔",
                              style: const TextStyle(fontSize: 12.5, fontWeight: FontWeight.bold),
                            ),
                          ),
                        ),
                      ],
                    ),
                  ),
                  Expanded(
                    child: Stack(
                      children: [
                        InAppWebView(
                          initialUrlRequest: URLRequest(
                            url: WebUri("https://$_currentDomain/ar/sign-in"),
                          ),
                          initialUserScripts: UnmodifiableListView<UserScript>([
                            UserScript(
                              source: _wsHookScript,
                              injectionTime: UserScriptInjectionTime.AT_DOCUMENT_START,
                            ),
                          ]),
                          initialSettings: InAppWebViewSettings(
                            javaScriptEnabled: true,
                            domStorageEnabled: true,
                            databaseEnabled: true,
                            userAgent: "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36",
                          ),
                          onWebViewCreated: (controller) {
                            _webViewController = controller;
                            context.read<QuotexService>().attachWebViewController(controller);
                          },
                          onLoadStart: (controller, url) {
                            if (mounted) {
                              setState(() {
                                _isLoading = true;
                                _webError = null;
                              });
                            }
                          },
                          onLoadStop: (controller, url) async {
                            await controller.evaluateJavascript(source: _wsHookScript);
                            if (mounted) {
                              setState(() => _isLoading = false);
                            }
                            await _extractAndConnect(manualTrigger: false);
                          },
                          onReceivedError: (controller, request, error) {
                            if (request.isForMainFrame ?? true) {
                              if (mounted) {
                                setState(() {
                                  _isLoading = false;
                                  _webError = error.description;
                                });
                              }
                            }
                          },
                        ),
                        if (_webError != null)
                          Container(
                            color: const Color(0xFF0B0F19),
                            padding: const EdgeInsets.all(24),
                            child: Center(
                              child: Column(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  const Icon(Icons.wifi_off_rounded, size: 52, color: Colors.amber),
                                  const SizedBox(height: 14),
                                  Text(
                                    "النطاق ($_currentDomain) محجوب على شبكتك",
                                    style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
                                  ),
                                  const SizedBox(height: 8),
                                  const Text(
                                    "اختر نطاقاً بديلاً بضغطة واحدة لتجاوز الحجب:",
                                    style: TextStyle(color: Colors.white70, fontSize: 13),
                                  ),
                                  const SizedBox(height: 16),
                                  Wrap(
                                    spacing: 8,
                                    runSpacing: 8,
                                    children: _domains.map((dom) {
                                      return ElevatedButton(
                                        style: ElevatedButton.styleFrom(
                                          backgroundColor: const Color(0xFF2563EB),
                                        ),
                                        onPressed: () => _switchDomain(dom),
                                        child: Text(dom),
                                      );
                                    }).toList(),
                                  ),
                                ],
                              ),
                            ),
                          ),
                        if (_isLoading)
                          const Center(
                            child: CircularProgressIndicator(color: Color(0xFF10B981)),
                          ),
                      ],
                    ),
                  ),
                ],
              );
            }
          }
