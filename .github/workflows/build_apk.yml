            Future<(int, String)> _httpCall(String method, String url, Map<String, String> headers, [String? body]) async {
              final client = HttpClient()..connectionTimeout = const Duration(seconds: 10);
              try {
                final req = method == 'GET' ? await client.getUrl(Uri.parse(url)) : await client.postUrl(Uri.parse(url));
                headers.forEach((k, v) => req.headers.set(k, v));
                if (body != null) req.add(utf8.encode(body));
                final res = await req.close().timeout(const Duration(seconds: 20));
                return (res.statusCode, await res.transform(utf8.decoder).join());
              } finally {
                client.close();
              }
            }

            Map<String, String> _aiHeaders(String id, String key) {
              if (id == 'gemini') return {'x-goog-api-key': key};
              if (id == 'anthropic') return {'x-api-key': key, 'anthropic-version': '2023-06-01'};
              return {'Authorization': 'Bearer $key'};
            }

            List<Map<String, String>> _candidatesFor(String key) {
              final matched = <Map<String, String>>[];
              for (final p in _providers) {
                final pre = p['prefix']!;
                if (pre.split(',').any((x) => x.isNotEmpty && x != 'sk-' && key.startsWith(x))) matched.add(p);
              }
              if (matched.isNotEmpty) return matched;
              if (key.startsWith('sk-')) {
                return _providers.where((p) => p['id'] == 'openai' || p['id'] == 'deepseek').toList();
              }
              return _providers.where((p) => p['id'] != 'perplexity').toList();
            }

            void _probeNote(Map<String, String> p, (int, String) r) {
              String d = '';
              try {
                d = (jsonDecode(r.$2)['error']['message'] ?? '').toString();
              } catch (_) {}
              if (d.length > 70) d = d.substring(0, 70);
              _probeNotes += '${p['name']}: ${r.$1} $d. ';
            }

            Future<List<String>?> _probe(Map<String, String> p, String key) async {
              final id = p['id']!;
              final base = p['base']!;
              try {
                if (id == 'vertex') {
                  final r = await _httpCall('POST', '$base/publishers/google/models/gemini-2.5-flash:generateContent?key=$key', {'Content-Type': 'application/json'},
                      jsonEncode({'contents': [{'role': 'user', 'parts': [{'text': 'hi'}]}], 'generationConfig': {'maxOutputTokens': 5}}));
                  if (r.$1 != 200) {
                    _probeNote(p, r);
                    return null;
                  }
                  return <String>['gemini-2.5-flash'];
                }
                if (id == 'perplexity') return <String>['sonar'];
                final r = await _httpCall('GET', '$base/models', _aiHeaders(id, key));
                if (r.$1 != 200) {
                  _probeNote(p, r);
                  return null;
                }
                final j = jsonDecode(r.$2);
                if (id == 'gemini') {
                  return [
                    for (final m in (j['models'] as List))
                      if (((m['supportedGenerationMethods'] as List?) ?? const ['generateContent']).contains('generateContent'))
                        (m['name'] as String).replaceFirst('models/', '')
                  ];
                }
                return [for (final m in (j['data'] as List)) m['id'].toString()];
              } catch (_) {
                _probeNotes += '${p['name']}: تعذر الاتصال بالإنترنت أو قراءة الرد. ';
                return null;
              }
            }

            String _pickModel(String id, List<String> all) {
              final ids = all.where((m) {
                final l = m.toLowerCase();
                return !(l.contains('embed') || l.contains('whisper') || l.contains('tts') || l.contains('guard') || l.contains('moderation') || l.contains('imagen') || l.contains('veo') || l.contains('audio') || l.contains('image'));
              }).toList();
              const pref = {
                'gemini': ['gemini-2.5-flash', 'flash-latest', 'flash', 'gemini'],
                'vertex': ['gemini-2.5-flash'],
                'anthropic': ['sonnet', 'haiku', 'claude'],
                'openai': ['gpt-4o-mini', 'gpt-4.1-mini', 'gpt-5-mini', 'gpt-4o', 'gpt'],
                'groq': ['llama-3.3-70b', 'llama', ''],
                'openrouter': [':free', 'gpt-4o-mini', ''],
                'xai': ['grok', ''],
                'cerebras': ['llama', ''],
                'deepseek': ['deepseek-chat', ''],
                'mistral': ['mistral-small', 'mistral-medium', 'mistral', ''],
                'perplexity': ['sonar'],
              };
              for (final k in (pref[id] ?? const [''])) {
                final hit = ids.where((m) => k.isEmpty || m.contains(k)).toList();
                if (hit.isNotEmpty) return hit.first;
              }
              return ids.isNotEmpty ? ids.first : (all.isNotEmpty ? all.first : '');
            }

            Future<void> _saveAiPrefs() async {
              try {
                final p = await SharedPreferences.getInstance();
                await p.setString('gemini_key', _geminiKey);
                await p.setString('gemini_model', _geminiModel);
                await p.setBool('gemini_gate', _geminiGate);
                await p.setString('ai_prov', _aiProv);
                await p.setString('ai_name', _aiName);
                await p.setBool('ai_manual', _modelManual);
              } catch (_) {}
            }

            Future<bool> _detectAi() async {
              if (_geminiKey.isEmpty) return false;
              _aiDetecting = true;
              _probeNotes = '';
              notifyListeners();
              try {
                for (final p in _candidatesFor(_geminiKey)) {
                  final ids = await _probe(p, _geminiKey);
                  if (ids != null) {
                    _aiProv = p['id']!;
                    _aiName = p['name']!;
                    if (!_modelManual) _geminiModel = _pickModel(_aiProv, ids);
                    await _saveAiPrefs();
                    addLog("تم التعرف على المفتاح: $_aiName • النموذج: $_geminiModel");
                    return true;
                  }
                }
                _aiProv = '';
                _aiName = '';
                addLog("لم أتمكن من التعرف على المفتاح. $_probeNotes");
                return false;
              } finally {
                _aiDetecting = false;
                notifyListeners();
              }
            }

