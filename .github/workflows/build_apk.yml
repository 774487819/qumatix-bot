            void _refreshSignalBadge() {
              if (_strategy == "platform_interest_contrarian" || _strategy == "hybrid_ai_contrarian") {
                final dir = _crowdCallVolume >= _crowdPutVolume ? "PUT" : "CALL";
                _lastSignal = "الدقيقة (${_currentSecondInMinute}s/60s) | $dir | الفارق: \$${currentVolumeDiff.toStringAsFixed(0)}";
                return;
              }

              String stratName = "محرك المؤشرات 📊";
              if (_strategy == "qumatix_rsi_ema") stratName = "RSI + EMA";
              if (_strategy == "trend_momentum") stratName = "Trend Pro";
              if (_strategy == "reversal_sniper") stratName = "Sniper";

              if (_priceHistory.length < 4) {
                _lastSignal = "$stratName | جاري جلب أسعار السيرفر...";
                return;
              }
              _lastSignal = "$stratName: $_currentSignalDirection ($_currentSignalStrength%)";
            }

            void addLog(String message) {
