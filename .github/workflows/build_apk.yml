                    primary: Color(0xFF10B981),
                    secondary: Color(0xFFEF4444),
                  ),
                ),
                home: const MainDashboard(),
              );
            }
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard> {
            final TextEditingController _amountController = TextEditingController(text: "1");
            final TextEditingController _tpController = TextEditingController(text: "50");
            final TextEditingController _slController = TextEditingController(text: "25");
            final TextEditingController _manualTokenController = TextEditingController();

            String _selectedAsset = "EURUSD_otc";
            String _selectedDomain = "market-qx.pro";
            String _selectedStrategy = "qumatix_rsi_ema";
            int _selectedDuration = 60;
            bool _isRealAccount = false;
            bool _useMartingale = true;

            Future<void> _startLoginFlow(BuildContext context) async {
              final service = context.read<QuotexService>();

              final result = await Navigator.push<Map<String, String>>(
                context,
                MaterialPageRoute(
                  builder: (context) => QuotexLoginScreen(domain: _selectedDomain),
                ),
              );

              if (result != null && result['token'] != null && result['token']!.isNotEmpty) {
                final token = result['token']!;
                final usedDomain = result['domain'] ?? _selectedDomain;
                setState(() => _selectedDomain = usedDomain);

                if (context.mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text("تم استخراج رمز الجلسة! جاري ربط البوت بالسيرفر..."),
                      backgroundColor: Colors.green,
                    ),
                  );
                }

                await service.connect(
                  ssidToken: token,
                  isRealAccount: _isRealAccount,
                  domain: usedDomain,
                );
              }
            }

            void _showManualTokenDialog(BuildContext context) {
              final service = context.read<QuotexService>();
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E293B),
                  title: const Text("ربط مباشر عبر رمز الجلسة (SSID)"),
                  content: TextField(
                    controller: _manualTokenController,
                    decoration: const InputDecoration(
                      labelText: "أدخل رمز الجلسة (SSID Token)",
                      border: OutlineInputBorder(),
                    ),
