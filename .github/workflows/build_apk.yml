name: Build Hussam AI APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter Android Project Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name qumatix_bot --platforms=android --org com.qumatix.app .
          fi
          rm -rf test

      - name: Generate pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: qumatix_bot
          description: "Hussam AI - Liquidity Radar, Technical Indicators Engine and Gemini Analysis"
          publish_to: 'none'
          version: 9.6.0+14

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.2
            flutter_inappwebview: ^6.1.5
            shared_preferences: ^2.2.3
            path_provider: ^2.1.3
            cupertino_icons: ^1.0.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Write Full AndroidManifest.xml with Internet Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="Hussam AI"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Generate quotex_service.dart (Liquidity Radar + Indicators Engine + Trained Model + Gemini)
        run: |
          mkdir -p lib/services
          cat << 'EOF' > lib/services/quotex_service.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'package:flutter/foundation.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:path_provider/path_provider.dart';

          class _AiPatternSample {
            final List<double> features;
            final bool wentUp;
            _AiPatternSample(this.features, this.wentUp);
          }

          class _SyntheticCandle {
            final double open;
            final double high;
            final double low;
            final double close;
            _SyntheticCandle({
              required this.open,
              required this.high,
              required this.low,
              required this.close,
            });
            bool get isBullish => close > open;
            bool get isBearish => close < open;
            double get body => (close - open).abs();
            double get range => max(1e-7, high - low);
            double get upperWick => high - max(open, close);
            double get lowerWick => min(open, close) - low;
          }

          class _TrainedModel {
            final List<double> mean, std, w;
            final double b;
            final List<int> lags;
            final double valAcc;
            final int horizon;
            _TrainedModel(this.mean, this.std, this.w, this.b, this.lags, this.valAcc, this.horizon);

            static _TrainedModel? fromJson(String raw) {
              try {
                final m = jsonDecode(raw);
                if (m is! Map || m['ok'] != true) return null;
                List<double> d(String k) => (m[k] as List).map((e) => (e as num).toDouble()).toList();
                return _TrainedModel(d('mean'), d('std'), d('w'), (m['b'] as num).toDouble(),
                    (m['lags'] as List).map((e) => (e as num).toInt()).toList(),
                    (m['val_acc'] as num).toDouble(), (m['horizon'] as num).toInt());
              } catch (_) {
                return null;
              }
            }

            static double _avg(List<double> x) => x.reduce((a, b) => a + b) / x.length;
            static double _sd(List<double> x) {
              final m = _avg(x);
              return sqrt(x.map((e) => (e - m) * (e - m)).reduce((a, b) => a + b) / x.length);
            }

            // الميزات مبنية على آخر 40 تيك (كل تغيّر سعر = تيك) وليس على ثواني ثابتة
            static List<double>? features(List<double> w40, List<int> lags) {
              if (w40.length != 40) return null;
              final last = w40.last;
              if (last <= 0) return null;
              final diffs = <double>[for (int i = 1; i < 40; i++) w40[i] - w40[i - 1]];
              final eps = last * 1e-7;
              final s = max(_sd(diffs), eps);
              final f = <double>[];
              for (final k in lags) {
                f.add((last - w40[39 - k]) / (s * sqrt(k.toDouble())));
              }
              final w20 = w40.sublist(20);
              f.add((last - _avg(w20)) / max(_sd(w20), eps));
              double g = 0.0, l = 0.0;
              for (final d in diffs.sublist(diffs.length - 14)) {
                if (d > 0) {
                  g += d;
                } else {
                  l -= d;
                }
              }
              f.add((g + l) == 0 ? 0.0 : (100.0 * g / (g + l) - 50.0) / 50.0);
              f.add((_avg(w40.sublist(35)) - _avg(w40.sublist(27))) / (s * sqrt(5.0)));
              f.add(_sd(diffs.sublist(diffs.length - 10)) / s);
              return [for (final v in f) v.clamp(-5.0, 5.0).toDouble()];
            }

            double? predict(List<double> p, int tradeSec) {
              if (tradeSec != horizon || p.length < 40) return null;
              final f = features(p.sublist(p.length - 40), lags);
              if (f == null || f.length != w.length) return null;
              double z = b;
              for (int i = 0; i < f.length; i++) {
                z += ((f[i] - mean[i]) / std[i]) * w[i];
              }
              return 1.0 / (1.0 + exp(-z));
            }
          }

          String _trainOtcModelSync(Map<String, dynamic> a) {
            final int horizonSec = a['horizon'] as int;
            final double horizonMs = horizonSec * 1000.0;
            const lags = [1, 2, 3, 5, 8, 13, 21, 34];
            final ts = <String, List<double>>{};
            final px = <String, List<double>>{};
            for (final path in (a['paths'] as List)) {
              final file = File(path as String);
              if (!file.existsSync()) continue;
              for (final line in file.readAsLinesSync()) {
                final p = line.split(',');
                if (p.length != 3) continue;
                final t = double.tryParse(p[1]);
                final v = double.tryParse(p[2]);
                if (t == null || v == null || v <= 0) continue;
                (ts[p[0]] ??= <double>[]).add(t);
                (px[p[0]] ??= <double>[]).add(v);
              }
            }
            final trX = <List<double>>[], teX = <List<double>>[];
            final trY = <double>[], teY = <double>[];
            for (final sym in ts.keys) {
              final t = ts[sym]!;
              final p = px[sym]!;
              if (p.length < 200) continue;
              final X = <List<double>>[];
              final y = <double>[];
              int j = 0;
              for (int i = 39; i < p.length - 1; i += 3) {
                if (j < i) j = i;
                while (j < p.length && t[j] < t[i] + horizonMs) {
                  j++;
                }
                if (j >= p.length) break;
                if (p[j] == p[i]) continue;
                if (t[j] > t[i] + horizonMs * 1.5) continue;
                if (t[i] - t[i - 39] > 600000) continue;
                final f = _TrainedModel.features(p.sublist(i - 39, i + 1), lags);
                if (f == null) continue;
                X.add(f);
                y.add(p[j] > p[i] ? 1.0 : 0.0);
              }
              if (y.length < 100) continue;
              final n = (y.length * 0.7).floor();
              trX.addAll(X.sublist(0, n));
              trY.addAll(y.sublist(0, n));
              teX.addAll(X.sublist(n));
              teY.addAll(y.sublist(n));
            }
            if (trY.length < 400 || teY.length < 150) {
              return jsonEncode({'ok': false, 'reason': 'تم جمع ${trY.length + teY.length} عينة فقط'});
            }
            final nf = trX.first.length;
            final mu = List<double>.filled(nf, 0.0);
            final sg = List<double>.filled(nf, 0.0);
            for (final r in trX) {
              for (int k = 0; k < nf; k++) {
                mu[k] += r[k];
              }
            }
            for (int k = 0; k < nf; k++) {
              mu[k] /= trX.length;
            }
            for (final r in trX) {
              for (int k = 0; k < nf; k++) {
                sg[k] += (r[k] - mu[k]) * (r[k] - mu[k]);
              }
            }
            for (int k = 0; k < nf; k++) {
              sg[k] = sqrt(sg[k] / trX.length) + 1e-9;
            }
            final Z = [for (final r in trX) [for (int k = 0; k < nf; k++) (r[k] - mu[k]) / sg[k]]];
            final w = List<double>.filled(nf, 0.0);
            double b = 0.0;
            for (int ep = 0; ep < 300; ep++) {
              final gw = List<double>.filled(nf, 0.0);
              double gb = 0.0;
              for (int i = 0; i < Z.length; i++) {
                double z = b;
                for (int k = 0; k < nf; k++) {
                  z += Z[i][k] * w[k];
                }
                final e = 1.0 / (1.0 + exp(-z)) - trY[i];
                for (int k = 0; k < nf; k++) {
                  gw[k] += e * Z[i][k];
                }
                gb += e;
              }
              for (int k = 0; k < nf; k++) {
                w[k] -= 0.2 * (gw[k] / Z.length + 1e-3 * w[k]);
              }
              b -= 0.2 * gb / Z.length;
            }
            int hit = 0;
            for (int i = 0; i < teX.length; i++) {
              double z = b;
              for (int k = 0; k < nf; k++) {
                z += ((teX[i][k] - mu[k]) / sg[k]) * w[k];
              }
              if ((z > 0) == (teY[i] > 0.5)) hit++;
            }
            return jsonEncode({
              'ok': true, 'mean': mu, 'std': sg, 'w': w, 'b': b, 'lags': lags, 'horizon': horizonSec,
              'val_acc': hit / teX.length, 'n_train': trY.length, 'n_test': teY.length,
            });
          }

