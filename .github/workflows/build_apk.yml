            final String label, value;
            final Color color;
            const _Stat(this.label, this.value, this.color);

            @override
            Widget build(BuildContext context) {
              return Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  Text(value, style: TextStyle(color: color, fontWeight: FontWeight.w800, fontSize: 17)),
                  const SizedBox(height: 2),
                  Text(label, style: const TextStyle(color: C.dim, fontSize: 10.5)),
                ],
              );
            }
          }

          class _BotButton extends StatelessWidget {
            const _BotButton();

            @override
            Widget build(BuildContext context) {
              final r = context.select<QuotexService, (bool, bool, int)>(
                (s) => (s.isAutoTrading, s.isTradeOpen, s.remainingSeconds),
              );
              final running = r.$1;
              return Column(
                children: [
                  SizedBox(
                    width: double.infinity,
                    height: 56,
                    child: FilledButton.icon(
                      style: FilledButton.styleFrom(
                        backgroundColor: running ? C.red : C.green,
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                      ),
                      onPressed: () => context.read<QuotexService>().toggleAutoTrading(),
                      icon: Icon(running ? Icons.stop_rounded : Icons.play_arrow_rounded, size: 26),
                      label: Text(
                        running ? 'إيقاف التداول الآلي' : 'تشغيل التداول الآلي',
                        style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w800),
                      ),
                    ),
                  ),
                  if (r.$2)
                    Padding(
                      padding: const EdgeInsets.only(top: 10),
                      child: _Tag('صفقة مفتوحة • متبقي ${r.$3} ث', C.amber),
                    ),
                ],
              );
            }
          }

          class _ManualTrade extends StatelessWidget {
            const _ManualTrade();

            void _go(BuildContext context, String dir) {
              final s = context.read<QuotexService>();
              s.placeOrder(asset: s.activeAsset, direction: dir, amount: s.baseAmount, duration: s.tradeDuration);
            }

            @override
            Widget build(BuildContext context) {
              return Row(
                children: [
                  Expanded(
                    child: OutlinedButton.icon(
                      style: OutlinedButton.styleFrom(
                        foregroundColor: C.green,
                        side: const BorderSide(color: C.green),
                        padding: const EdgeInsets.symmetric(vertical: 14),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                      ),
                      onPressed: () => _go(context, 'call'),
                      icon: const Icon(Icons.arrow_upward_rounded),
                      label: const Text('CALL', style: TextStyle(fontWeight: FontWeight.w800)),
                    ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
                    child: OutlinedButton.icon(
                      style: OutlinedButton.styleFrom(
                        foregroundColor: C.red,
                        side: const BorderSide(color: C.red),
                        padding: const EdgeInsets.symmetric(vertical: 14),
                        shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                      ),
                      onPressed: () => _go(context, 'put'),
                      icon: const Icon(Icons.arrow_downward_rounded),
                      label: const Text('PUT', style: TextStyle(fontWeight: FontWeight.w800)),
                    ),
                  ),
                ],
              );
            }
          }

          // ───────────────────────── الإعدادات ─────────────────────────
          class SettingsTab extends StatefulWidget {
            const SettingsTab({super.key});

            @override
            State<SettingsTab> createState() => _SettingsTabState();
          }

          class _SettingsTabState extends State<SettingsTab> {
            final _amount = TextEditingController(text: '1');
            final _tp = TextEditingController(text: '50');
            final _sl = TextEditingController(text: '25');
            final _diff = TextEditingController(text: '250');
            final _gKey = TextEditingController();
            final _gModel = TextEditingController(text: 'auto');
            bool _gGate = false;

            String _asset = 'AUTO_CHART';
            String _strategy = 'platform_interest_contrarian';
            int _duration = 60;
            int _strength = 80;
            bool _martingale = true;
            bool _minuteEnd = true;
            bool _real = false;

            static const _assets = [
              'AUTO_CHART',
              'EUR/USD (OTC)',
              'GBP/USD (OTC)',
              'USD/JPY (OTC)',
              'AUD/CAD (OTC)',
              'AUD/CHF (OTC)',
              'AUD/JPY (OTC)',
              'AUD/NZD (OTC)',
              'AUD/USD (OTC)',
              'CAD/CHF (OTC)',
              'CAD/JPY (OTC)',
              'CHF/JPY (OTC)',
              'EUR/AUD (OTC)',
              'EUR/CAD (OTC)',
              'EUR/CHF (OTC)',
              'EUR/GBP (OTC)',
              'EUR/JPY (OTC)',
              'EUR/NZD (OTC)',
              'GBP/AUD (OTC)',
              'GBP/CAD (OTC)',
              'GBP/CHF (OTC)',
              'GBP/JPY (OTC)',
              'GBP/NZD (OTC)',
              'NZD/CAD (OTC)',
              'NZD/CHF (OTC)',
              'NZD/JPY (OTC)',
              'NZD/USD (OTC)',
              'USD/CAD (OTC)',
              'USD/CHF (OTC)',
              'USD/BRL (OTC)',
              'USD/EGP (OTC)',
              'USD/TRY (OTC)',
              'USD/INR (OTC)',
              'USD/PKR (OTC)',
              'USD/BDT (OTC)',
              'USD/ARS (OTC)',
              'USD/MXN (OTC)',
              'USD/NGN (OTC)',
              'USD/PHP (OTC)',
              'USD/IDR (OTC)',
              'USD/COP (OTC)',
              'USD/DZD (OTC)',
              'Gold (OTC)',
              'Silver (OTC)',
              'UKBrent (OTC)',
              'USCrude (OTC)',
              'Bitcoin (OTC)',
              'Ethereum (OTC)',
            ];
            static const _strategies = {
              'platform_interest_contrarian': 'رادار السيولة',
              'hybrid_ai_contrarian': 'مدمج (رادار + مؤشرات)',
              'local_deep_ai': 'محرك المؤشرات',
              'qumatix_rsi_ema': 'RSI + EMA',
              'trend_momentum': 'Trend Pro',
              'reversal_sniper': 'Sniper',
            };

            @override
            void dispose() {
              _amount.dispose();
              _tp.dispose();
              _sl.dispose();
              _diff.dispose();
              _gKey.dispose();
              _gModel.dispose();
              super.dispose();
            }

            void _sync() {
              context.read<QuotexService>().updateSettings(
                    asset: _asset,
                    duration: _duration,
                    baseAmount: double.tryParse(_amount.text) ?? 1.0,
                    useMartingale: _martingale,
                    takeProfit: double.tryParse(_tp.text) ?? 50.0,
                    stopLoss: double.tryParse(_sl.text) ?? 25.0,
                    strategy: _strategy,
                    isRealAccount: _real,
                    minSignalStrength: _strength,
                    requiredVolumeDiff: double.tryParse(_diff.text) ?? 250.0,
                    enterAtMinuteEndOnly: _minuteEnd,
                  );
            }

            void _set(VoidCallback f) {
              setState(f);
              _sync();
            }

            @override
            Widget build(BuildContext context) {
              final ai = context.select<QuotexService, (bool, String, bool)>((s) => (s.hasGeminiKey, s.aiName, s.aiDetecting));
              return ListView(
                padding: const EdgeInsets.fromLTRB(14, 6, 14, 24),
                children: [
                  _geminiPanel(ai.$1, ai.$2, ai.$3),
                  const SizedBox(height: 12),
                  _collectorPanel(),
                  const SizedBox(height: 12),
                  Panel(
                    child: Column(
                      children: [
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('حساب حقيقي', style: TextStyle(fontWeight: FontWeight.w700)),
                          subtitle: Text(_real ? 'تحذير: تداول بأموال حقيقية' : 'وضع تجريبي', style: TextStyle(color: _real ? C.amber : C.dim, fontSize: 12)),
                          value: _real,
                          activeColor: C.amber,
                          onChanged: (v) => _set(() => _real = v),
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('مضاعفة بعد الخسارة (Martingale)', style: TextStyle(fontWeight: FontWeight.w700)),
                          subtitle: const Text('يرفع حجم الخسارة المحتملة بسرعة', style: TextStyle(color: C.dim, fontSize: 12)),
                          value: _martingale,
                          onChanged: (v) => _set(() => _martingale = v),
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('الدخول عند نهاية الدقيقة فقط', style: TextStyle(fontWeight: FontWeight.w700)),
                          value: _minuteEnd,
                          onChanged: (v) => _set(() => _minuteEnd = v),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 12),
                  Panel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        _dropdown('الاستراتيجية', _strategy, _strategies, (v) => _set(() => _strategy = v)),
                        const SizedBox(height: 14),
                        _dropdown('الزوج', _asset, {for (final a in _assets) a: a == 'AUTO_CHART' ? 'تلقائي (الشارت)' : a}, (v) => _set(() => _asset = v)),
                        const SizedBox(height: 16),
                        const Text('مدة الصفقة', style: TextStyle(color: C.dim, fontSize: 12)),
                        const SizedBox(height: 8),
                        Wrap(spacing: 8, runSpacing: 8, children: [
                          for (final e in {30: '30ث', 60: '1د', 120: '2د', 180: '3د', 300: '5د'}.entries)
                            _chip(e.value, _duration == e.key, C.blue, () => _set(() => _duration = e.key)),
                        ]),
                        const SizedBox(height: 16),
                        const Text('أدنى قوة إشارة', style: TextStyle(color: C.dim, fontSize: 12)),
                        const SizedBox(height: 8),
                        Wrap(spacing: 8, runSpacing: 8, children: [
                          for (final p in [60, 70, 80, 90])
                            _chip('$p%', _strength == p, C.green, () => _set(() => _strength = p)),
                        ]),
                      ],
                    ),
                  ),
                  const SizedBox(height: 12),
                  Panel(
                    child: Column(
                      children: [
                        Row(children: [
                          Expanded(child: _num('مبلغ الصفقة', _amount)),
                          const SizedBox(width: 10),
                          Expanded(child: _num('فارق السيولة', _diff)),
                        ]),
                        const SizedBox(height: 12),
                        Row(children: [
                          Expanded(child: _num('هدف الربح', _tp)),
                          const SizedBox(width: 10),
                          Expanded(child: _num('وقف الخسارة', _sl)),
                        ]),
                      ],
                    ),
                  ),
                ],
              );
            }

            Widget _collectorPanel() {
              final r = context.select<QuotexService, (bool, bool, double, int, String, bool)>(
                (s) => (s.collectEnabled, s.training, s.dataMegabytes, s.collectedPairs, s.modelInfo, s.modelActive),
              );
              return Panel(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        const Icon(Icons.storage_rounded, color: C.blue, size: 20),
                        const SizedBox(width: 8),
                        const Text('بيانات OTC والنموذج', style: TextStyle(fontWeight: FontWeight.w700, fontSize: 15)),
                        const Spacer(),
                        _Tag(r.$6 ? 'النموذج مفعّل' : 'غير مفعّل', r.$6 ? C.green : C.amber),
                      ],
                    ),
                    SwitchListTile(
                      contentPadding: EdgeInsets.zero,
                      title: const Text('جمع أسعار أزواج OTC من سيرفر Quotex', style: TextStyle(fontWeight: FontWeight.w700, fontSize: 13)),
                      subtitle: const Text('يدور على الأزواج أثناء عدم وجود صفقات', style: TextStyle(color: C.dim, fontSize: 12)),
                      value: r.$1,
                      onChanged: (v) => context.read<QuotexService>().setCollect(v),
                    ),
                    Text('${r.$3 < 1 ? '${(r.$3 * 1024).toStringAsFixed(0)} KB' : '${r.$3.toStringAsFixed(1)} MB'} مخزّنة (≈ ${(r.$3 * 1048576 / 30).round()} سعر) • ${r.$4} زوجاً في هذه الجلسة', style: const TextStyle(color: C.dim, fontSize: 12)),
                    const SizedBox(height: 4),
                    Text(r.$5, style: const TextStyle(color: C.dim, fontSize: 12, height: 1.5)),
                    const SizedBox(height: 10),
                    SizedBox(
                      width: double.infinity,
                      child: FilledButton(
                        onPressed: r.$2 ? null : () => context.read<QuotexService>().trainModelNow(),
                        child: Text(r.$2 ? 'جارٍ التدريب…' : 'درّب النموذج الآن'),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _geminiPanel(bool hasKey, String aiName, bool detecting) {
              return Panel(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Row(
                      children: [
                        const Icon(Icons.auto_awesome_rounded, color: C.blue, size: 20),
                        const SizedBox(width: 8),
                        const Text('الذكاء الاصطناعي', style: TextStyle(fontWeight: FontWeight.w700, fontSize: 15)),
                        const Spacer(),
                        _Tag(detecting ? 'جارٍ التعرف…' : (hasKey ? (aiName.isEmpty ? 'غير معروف' : aiName) : 'بدون مفتاح'), (hasKey && aiName.isNotEmpty) ? C.green : C.amber),
                      ],
                    ),
                    const SizedBox(height: 12),
                    TextField(
                      controller: _gKey,
                      obscureText: true,
                      decoration: _deco(hasKey ? 'مفتاح جديد (اتركه فارغاً للإبقاء على الحالي)' : 'ألصق مفتاح API من أي مزوّد'),
                    ),
                    const SizedBox(height: 10),
                    TextField(controller: _gModel, decoration: _deco('النموذج (auto = اختيار تلقائي)')),
                    SwitchListTile(
                      contentPadding: EdgeInsets.zero,
                      title: const Text('اشترط موافقة الذكاء الاصطناعي قبل كل صفقة', style: TextStyle(fontWeight: FontWeight.w700, fontSize: 13)),
                      subtitle: const Text('يضيف ثواني من الانتظار قبل التنفيذ', style: TextStyle(color: C.dim, fontSize: 12)),
                      value: _gGate,
                      onChanged: (v) => setState(() => _gGate = v),
                    ),
                    SizedBox(
                      width: double.infinity,
                      child: FilledButton(
                        onPressed: detecting ? null : () {
                          final k = _gKey.text.trim();
                          context.read<QuotexService>().setGemini(key: k.isEmpty ? null : k, model: _gModel.text.trim(), gate: _gGate);
                          _gKey.clear();
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم الحفظ على هذا الجهاز')));
                        },
                        child: Text(detecting ? 'جارٍ التعرف…' : 'حفظ والتعرف على المزوّد'),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _dropdown(String label, String value, Map<String, String> items, ValueChanged<String> onChanged) {
              return DropdownButtonFormField<String>(
                value: value,
                isExpanded: true,
                dropdownColor: C.card,
                decoration: _deco(label),
                items: [for (final e in items.entries) DropdownMenuItem(value: e.key, child: Text(e.value))],
                onChanged: (v) {
                  if (v != null) onChanged(v);
                },
              );
            }

            Widget _num(String label, TextEditingController c) {
              return TextField(
                controller: c,
                keyboardType: const TextInputType.numberWithOptions(decimal: true),
                decoration: _deco(label),
                onChanged: (_) => _sync(),
              );
            }

            InputDecoration _deco(String label) {
              return InputDecoration(
                labelText: label,
                filled: true,
                fillColor: C.field,
                contentPadding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),
                border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: C.line)),
                enabledBorder: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: const BorderSide(color: C.line)),
              );
            }

            Widget _chip(String text, bool selected, Color color, VoidCallback onTap) {
              return GestureDetector(
                onTap: onTap,
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 8),
                  decoration: BoxDecoration(
                    color: selected ? color : C.field,
                    borderRadius: BorderRadius.circular(10),
                    border: Border.all(color: selected ? color : C.line),
                  ),
                  child: Text(text, style: TextStyle(fontSize: 12.5, fontWeight: selected ? FontWeight.w800 : FontWeight.w500)),
                ),
              );
            }
          }

          // ───────────────────────── السجل (قائمة كسولة بدون تداخل تمرير) ─────────────────────────
          class LogsTab extends StatelessWidget {
            const LogsTab({super.key});

            @override
            Widget build(BuildContext context) {
              final n = context.select<QuotexService, (int, String)>(
                (s) => (s.logs.length, s.logs.isEmpty ? '' : s.logs.first),
              );
              final logs = context.read<QuotexService>().logs;
              if (n.$1 == 0) {
                return const Center(child: Text('لا توجد أحداث بعد…', style: TextStyle(color: C.dim)));
              }
              return ListView.builder(
                padding: const EdgeInsets.all(14),
                itemCount: logs.length,
                itemBuilder: (_, i) => Container(
                  margin: const EdgeInsets.only(bottom: 6),
                  padding: const EdgeInsets.all(10),
                  decoration: BoxDecoration(color: C.card, borderRadius: BorderRadius.circular(12), border: Border.all(color: C.line)),
                  child: Text(logs[i], style: const TextStyle(color: Color(0xFF6EE7B7), fontSize: 12, height: 1.4)),
                ),
              );
            }
          }
          EOF

      - name: Configure Gradle MinSdk
        run: |
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          fi

      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hussam-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
