                                        ),
                                        onPressed: () => _switchDomain(dom),
                                        child: Text(dom),
                                      );
                                    }).toList(),
                                  ),
                                ],
                              ),
                            ),
                          ),
                        if (_isLoading)
                          const Center(
                            child: CircularProgressIndicator(color: Color(0xFF10B981)),
                          ),
                      ],
                    ),
                  ),
                ],
