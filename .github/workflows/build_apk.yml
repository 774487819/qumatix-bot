            Future<void> _subscribeServerToAsset(String displayAsset) async {
              final target = displayAsset == "AUTO_CHART" ? _chartDisplayPair : displayAsset;
              final sym = toServerSymbol(target);
              if (_webViewController != null) {
                try {
                  await _webViewController!.evaluateJavascript(source: '''
                    (function() {
                      try {
                        const rs = window.__qm_resolve ? window.__qm_resolve('$target', '$sym') : '$sym';
                        const rb = rs.replace('_otc', '');
                        if (window.__qm_sockets && window.__qm_sockets.length > 0) {
                          for (let i = 0; i < window.__qm_sockets.length; i++) {
                            const ws = window.__qm_sockets[i];
                            if (ws && ws.readyState === 1) {
                              ws.send('42["instruments/update",{"asset":"' + rs + '","period":$_tradeDuration}]');
                              ws.send('42["depth/follow","' + rs + '"]');
                              ws.send('42["chart_notification/get",{"asset":"' + rs + '","version":"1.0.0"}]');
                              ws.send('42["instruments/update",{"asset":"' + rb + '","period":$_tradeDuration}]');
                              ws.send('42["depth/follow","' + rb + '"]');
                            }
                          }
                        }
                      } catch(e) {}
                    })();
                  ''');
                } catch (_) {}
              }
            }

            void _parseAndSetBalance(String rawStr) {
              final clean = rawStr.trim();
              if (clean.isEmpty) return;
              final match = RegExp(r'([0-9]+(?:[.,][0-9]{1,2})?)').firstMatch(clean.replaceAll(',', ''));
              if (match != null) {
                final val = double.tryParse(match.group(1)!);
                if (val != null && val > 0) {
                  _balance = val;
                  _balanceText = "\$${val.toStringAsFixed(2)}";
                  if (_initialSessionBalance == 0.0) {
                    _initialSessionBalance = val;
                    addLog("تم قراءة رصيد الحساب الفعلي من السيرفر: \$${val.toStringAsFixed(2)} ✔");
                  }
                }
              }
            }

            void _startWebSyncTimer() {
              _webSyncTimer?.cancel();
              int tickCounter = 0;
              _webSyncTimer = Timer.periodic(const Duration(milliseconds: 800), (_) async {
                if (!_isConnected || _webViewController == null) return;
                tickCounter++;
                final bool collectIdle = _collectEnabled && !_isAutoTrading && !_isTradeOpen;
                if (collectIdle && (_collectBurstPending || tickCounter % 375 == 0) && !_bursting) {
                  _collectBurstPending = false;
                  _burstSubscribeAll();
                } else if (!_bursting && tickCounter % 6 == 0) {
                  _subscribeServerToAsset(activeAsset);
                }

                final now = DateTime.now();
                _currentSecondInMinute = now.second;
                final int currentMinBucket = now.millisecondsSinceEpoch ~/ 60000;

                try {
                  final sym = toServerSymbol(activeAsset);
                  final wantedNorm = normalizeAssetKey(sym);
                  final baseNorm = normalizeAssetKey(sym.replaceAll('_otc', ''));

                  final res = await _webViewController!.evaluateJavascript(source: '''
                    (function() {
                      try {
                        // التحقق من بداية دقيقة جديدة (الثانية 00): تصفير عدادات الدقيقة السابقة فوراً
                        const nowMin = Math.floor(Date.now() / 60000);
                        if (window.__qm_cur_min_bucket !== nowMin) {
                          window.__qm_cur_min_bucket = nowMin;
                          window.__qm_min_call_by_key = {};
                          window.__qm_min_put_by_key = {};
                        }

                        let foundBalance = '';
                        if (window.__qm_ws_balance !== null && window.__qm_ws_balance !== undefined && Number(window.__qm_ws_balance) > 0) {
                          foundBalance = String(window.__qm_ws_balance);
                        }
                        if (!foundBalance && window.settings) {
                          if (Number(window.settings.demoBalance) > 0) foundBalance = String(window.settings.demoBalance);
                          else if (Number(window.settings.balance) > 0) foundBalance = String(window.settings.balance);
                        }
                        if (!foundBalance && document.body) {
                          const bodyTxt = document.body.innerText || '';
                          const m1 = bodyTxt.match(/(?:تجريبي|مباشر|حقيقي|Demo|Live|Real)[^0-9]{0,25}([0-9,]+\\.[0-9]{2})/i);
                          if (m1 && m1[1]) {
                            foundBalance = m1[1];
                          } else {
                            const topSlice = bodyTxt.substring(0, 450);
                            const m2 = topSlice.match(/([0-9,]+\\.[0-9]{2})/);
                            if (m2 && m2[1]) foundBalance = m2[1];
                          }
                        }

                        let chartPair = '';
                        const dealNodes = document.querySelectorAll('[class*="pair"], [class*="asset"], [class*="section-deal"] *, span, div');
                        for (let i = 0; i < dealNodes.length; i++) {
                          const el = dealNodes[i];
                          if (el.children.length === 0 && el.innerText) {
                            const txt = el.innerText.trim();
                            if ((txt.length >= 7 && txt.length <= 18 && txt.indexOf('/') === 3) || txt.endsWith('(OTC)')) {
                              chartPair = txt;
                              break;
                            }
                          }
                        }

                        function norm(s) {
                          return String(s || '').replace('(OTC)', 'OTC').replace('_otc', 'OTC').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                        }

                        let k1 = ('$_selectedAsset' === 'AUTO_CHART' && chartPair) ? norm(chartPair) : '$wantedNorm';
                        if (window.__qm_name_to_symkey && window.__qm_name_to_symkey[k1]) k1 = window.__qm_name_to_symkey[k1];
                        const k2 = '$baseNorm';
                        let activeKeyUsed = k1;
                        let prices = [];
                        if (window.__qm_by_norm) {
                          if (window.__qm_by_norm[k1] && window.__qm_by_norm[k1].length >= 2) {
                            prices = window.__qm_by_norm[k1];
                            activeKeyUsed = k1;
                          } else if (window.__qm_by_norm[k2] && window.__qm_by_norm[k2].length >= 2) {
                            prices = window.__qm_by_norm[k2];
                            activeKeyUsed = k2;
                          } else if (window.__qm_active_ws_key && window.__qm_by_norm[window.__qm_active_ws_key] && window.__qm_by_norm[window.__qm_active_ws_key].length >= 2) {
                            prices = window.__qm_by_norm[window.__qm_active_ws_key];
                            activeKeyUsed = window.__qm_active_ws_key;
                          } else {
                            let bestArr = [];
                            let bestK = k1;
                            const keys = Object.keys(window.__qm_by_norm);
                            for (let i = 0; i < keys.length; i++) {
                              const arr = window.__qm_by_norm[keys[i]];
                              if (arr && arr.length > bestArr.length) {
                                bestArr = arr;
                                bestK = keys[i];
                              }
                            }
                            prices = bestArr;
                            activeKeyUsed = bestK;
                          }
                        }

                        // قراءة السيولة الحقيقية المتجمعة للزوج النشط خلال الدقيقة الحالية فقط (منذ الثانية 00)
                        const minCall = (window.__qm_min_call_by_key && window.__qm_min_call_by_key[activeKeyUsed]) ? window.__qm_min_call_by_key[activeKeyUsed] : 0;
                        const minPut = (window.__qm_min_put_by_key && window.__qm_min_put_by_key[activeKeyUsed]) ? window.__qm_min_put_by_key[activeKeyUsed] : 0;

                        return JSON.stringify({
                          balance: foundBalance,
                          chartPair: chartPair,
                          prices: prices.slice(-100),
                          minCall: Math.round(minCall),
                          minPut: Math.round(minPut),
                          ticks: (window.__qm_tick_buf ? window.__qm_tick_buf.splice(0, window.__qm_tick_buf.length) : []),
                          otc: (window.__qm_otc_syms ? window.__qm_otc_syms.length : 0)
                        });
                      } catch(e) { return '{}'; }
                    })();
                  ''');

                  if (res != null && res is String && res.contains('{')) {
                    final cleanJson = res.startsWith('"') ? jsonDecode(res) : res;
                    final map = cleanJson is String ? jsonDecode(cleanJson) : cleanJson;
                    if (map is Map) {
                      final bStr = map['balance']?.toString() ?? '';
                      if (bStr.isNotEmpty) {
                        _parseAndSetBalance(bStr);
                      }

                      final cPair = map['chartPair']?.toString() ?? '';
                      if (cPair.isNotEmpty) {
                        _chartDisplayPair = cPair;
                      }

                      if (map['minCall'] is num) {
                        _crowdCallVolume = (map['minCall'] as num).toDouble();
                      }
                      if (map['minPut'] is num) {
                        _crowdPutVolume = (map['minPut'] as num).toDouble();
                      }

                      final rawTicks = map['ticks'];
                      final oc = map['otc'];
                      if (oc is int && oc != _otcKnown) {
                        if (_otcKnown == 0 && oc > 0) addLog("تم التعرف على $oc زوج OTC من قائمة سيرفر Quotex ✔");
                        _otcKnown = oc;
                      }
                      if (rawTicks is List && rawTicks.isNotEmpty) _ingestTicks(rawTicks);

                      final rawPrices = map['prices'];
                      if (rawPrices is List && rawPrices.isNotEmpty) {
                        _priceHistory.clear();
                        for (final item in rawPrices) {
                          if (item is num && item > 0) {
                            _priceHistory.add(item.toDouble());
                          }
                        }
                        if (_priceHistory.isNotEmpty) {
                          _lastPrice = _priceHistory.last;
                          _buildSyntheticCandlesAndMemory();
                          _calculateAllIndicatorsAndStrength();
                          _refreshSignalBadge();
                        }
                      }

                      if (_isAutoTrading) {
                        if (_initialSessionBalance > 0) {
                          if (netProfit >= _takeProfitTarget) {
                            stopAutoTrading(reason: "🎯 تم تحقيق هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)}) — توقف البوت تلقائياً!");
                            return;
                          } else if (netProfit <= -_stopLossLimit) {
                            stopAutoTrading(reason: "🛑 تم الوصول إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)}) — توقف البوت تلقائياً!");
                            return;
                          }
                        }
                        _evaluateMinuteRadarAndTrade(currentMinBucket);
                      }
                      notifyListeners();
                    }
                  }
                } catch (_) {}
              });
            }

            Future<void> _evaluateMinuteRadarAndTrade(int currentMinBucket) async {
              if (!_isAutoTrading || !_isConnected || _isTradeOpen) return;

              // منع تكرار الدخول في نفس الدقيقة
              if (_lastTradedMinuteBucket == currentMinBucket) return;

              if (_strategy == "platform_interest_contrarian" || _strategy == "hybrid_ai_contrarian") {
                // إذا كان المستخدم يختار (حساب دقيقة كاملة من 00s إلى 57s ثم الدخول عند نهاية الدقيقة)
                if (_enterAtMinuteEndOnly && _currentSecondInMinute < 56) {
                  return;
                }

                final double diff = currentVolumeDiff;
                if (diff < _requiredVolumeDiff) {
                  return;
                }

                if (_strategy == "hybrid_ai_contrarian" && _currentSignalStrength < _minSignalStrength) {
                  return;
                }

                _lastTradedMinuteBucket = currentMinBucket;
                final String contrarianDir = (_crowdCallVolume > _crowdPutVolume) ? "put" : "call";
                addLog("💰 [رادار الدقيقة ${_currentSecondInMinute}s] دخول الناس CALL: \$${_crowdCallVolume.toStringAsFixed(0)} ضد PUT: \$${_crowdPutVolume.toStringAsFixed(0)} (الفارق: \$${diff.toStringAsFixed(0)} >= \$${_requiredVolumeDiff.toStringAsFixed(0)}) => تنفيذ ${contrarianDir.toUpperCase()} مع مصلحة المنصة!");

                if (!await _geminiApproves(contrarianDir)) return;
                await placeOrder(
                  asset: activeAsset,
                  direction: contrarianDir,
                  amount: _currentTradeAmount,
                  duration: _tradeDuration,
                );
                return;
              }

              // استراتيجيات محرك المؤشرات
              if (_priceHistory.length < 4) return;
              if (_currentSignalStrength < _minSignalStrength) return;

              _lastTradedMinuteBucket = currentMinBucket;
              final String direction = _currentSignalDirection.toLowerCase();
              addLog("🧠 إشارة محرك المؤشرات: $_currentSignalStrength% (المطلوب: $_minSignalStrength%+) => تنفيذ $_currentSignalDirection عبر السيرفر");

              if (!await _geminiApproves(direction)) return;
              await placeOrder(
                asset: activeAsset,
                direction: direction,
                amount: _currentTradeAmount,
                duration: _tradeDuration,
              );
            }

            void _buildSyntheticCandlesAndMemory() {
              if (_priceHistory.length < 12) return;

              _syntheticCandles.clear();
              const int chunk = 4;
              for (int i = 0; i <= _priceHistory.length - chunk; i += chunk) {
                final sub = _priceHistory.sublist(i, i + chunk);
                _syntheticCandles.add(_SyntheticCandle(
                  open: sub.first,
                  high: sub.reduce(max),
                  low: sub.reduce(min),
                  close: sub.last,
                ));
              }

              _aiPatternMemory.clear();
              for (int i = 6; i < _priceHistory.length - 2; i++) {
                final double base = _priceHistory[i];
                if (base <= 0) continue;
                final List<double> pattern = [
                  (_priceHistory[i] - _priceHistory[i - 1]) / base * 1000.0,
                  (_priceHistory[i - 1] - _priceHistory[i - 2]) / base * 1000.0,
                  (_priceHistory[i - 2] - _priceHistory[i - 3]) / base * 1000.0,
                  (_priceHistory[i - 3] - _priceHistory[i - 4]) / base * 1000.0,
                  (_priceHistory[i - 4] - _priceHistory[i - 5]) / base * 1000.0,
                ];
                final bool nextWentUp = _priceHistory[i + 2] > _priceHistory[i];
                _aiPatternMemory.add(_AiPatternSample(pattern, nextWentUp));
              }
              _aiLearnedPatternsCount = _aiPatternMemory.length;
            }

            double _computeEma(List<double> data, int period) {
              if (data.isEmpty) return 0.0;
              if (data.length < period) {
                return data.reduce((a, b) => a + b) / data.length;
              }
              final double k = 2.0 / (period + 1);
              double ema = data.sublist(0, period).reduce((a, b) => a + b) / period;
              for (int i = period; i < data.length; i++) {
                ema = (data[i] * k) + (ema * (1.0 - k));
              }
              return ema;
            }

            double _computeRsiForPeriod(List<double> data, int period) {
              if (data.length < 3) return 50.0;
              final int win = min(period, data.length - 1);
              double gains = 0.0;
              double losses = 0.0;
              for (int i = data.length - win; i < data.length; i++) {
                final d = data[i] - data[i - 1];
                if (d > 0) gains += d;
                else if (d < 0) losses -= d;
              }
              final avgG = gains / win;
              final avgL = losses / win;
              if (avgL == 0 && avgG == 0) return 50.0;
              if (avgL == 0) return 88.0;
              final rs = avgG / avgL;
              return 100.0 - (100.0 / (1.0 + rs));
            }

            double _tanh(double x) {
              if (x > 10.0) return 1.0;
              if (x < -10.0) return -1.0;
              final double e2x = exp(2.0 * x);
              return (e2x - 1.0) / (e2x + 1.0);
            }

            double _leakyRelu(double x) => x >= 0 ? x : 0.15 * x;

            double _sigmoid(double x) => 1.0 / (1.0 + exp(-x.clamp(-12.0, 12.0)));

            void _calculateAllIndicatorsAndStrength() {
              if (_priceHistory.length < 4) return;

              _ema5 = _computeEma(_priceHistory, 5);
              _ema13 = _computeEma(_priceHistory, 13);
              _ema26 = _computeEma(_priceHistory, 26);
              _ema50 = _computeEma(_priceHistory, 50);

              final double ema12 = _computeEma(_priceHistory, 12);
              _macdLine = ema12 - _ema26;
              _macdSignal = (_ema5 - _ema13) * 0.6;
              _macdHistogram = _macdLine - _macdSignal;

              _rsi7 = _computeRsiForPeriod(_priceHistory, 7);
              _currentRsi = _computeRsiForPeriod(_priceHistory, 14);

              _priceMomentum = _priceHistory.last - _priceHistory[max(0, _priceHistory.length - 5)];

              final int bbLen = min(20, _priceHistory.length);
              final List<double> bbSlice = _priceHistory.sublist(_priceHistory.length - bbLen);
              final double mean = bbSlice.reduce((a, b) => a + b) / bbLen;
              double sumSq = 0.0;
              double meanAbsDev = 0.0;
              for (final p in bbSlice) {
                sumSq += (p - mean) * (p - mean);
                meanAbsDev += (p - mean).abs();
              }
              final double stdDev = max(1e-7, sqrt(sumSq / bbLen));
              meanAbsDev = max(1e-7, meanAbsDev / bbLen);
              _bollingerUpper = mean + (1.8 * stdDev);
              _bollingerLower = mean - (1.8 * stdDev);

              _cci14 = (_lastPrice - mean) / (0.015 * meanAbsDev);

              final int stochLen = min(14, _priceHistory.length);
              final List<double> stochSlice = _priceHistory.sublist(_priceHistory.length - stochLen);
              final double lowestLow = stochSlice.reduce(min);
              final double highestHigh = stochSlice.reduce(max);
              final double range = max(1e-7, highestHigh - lowestLow);
              _stochasticK = ((_lastPrice - lowestLow) / range) * 100.0;
              _stochasticD = (_stochasticK * 0.65) + 17.5;
              _williamsR = ((highestHigh - _lastPrice) / range) * -100.0;

              double trSum = 0.0;
              for (int i = 1; i < stochSlice.length; i++) {
                trSum += (stochSlice[i] - stochSlice[i - 1]).abs();
              }
              _atrVolatility = max(1e-7, trSum / max(1, stochSlice.length - 1));

              final double lastStep = _priceHistory.last - _priceHistory[_priceHistory.length - 2];
              final double prevStep = _priceHistory.length >= 3
                  ? (_priceHistory[_priceHistory.length - 2] - _priceHistory[_priceHistory.length - 3])
                  : 0.0;

              int upSteps = 0;
              int downSteps = 0;
              final int stepWin = min(8, _priceHistory.length - 1);
              for (int i = _priceHistory.length - stepWin; i < _priceHistory.length; i++) {
                if (_priceHistory[i] > _priceHistory[i - 1]) upSteps++;
                if (_priceHistory[i] < _priceHistory[i - 1]) downSteps++;
              }

              if (_strategy == "platform_interest_contrarian") {
                if (_crowdCallVolume >= _crowdPutVolume) {
                  _currentSignalDirection = "PUT";
                } else {
                  _currentSignalDirection = "CALL";
                }
                final double ratio = _requiredVolumeDiff > 0 ? (currentVolumeDiff / _requiredVolumeDiff) : 1.0;
                _currentSignalStrength = (60.0 + (ratio * 30.0)).round().clamp(55, 99);
                _agreedIndicatorsCount = ratio >= 1.0 ? 5 : (ratio * 4.0).round().clamp(1, 4);
                return;
              }

              final List<double> x = [
                (50.0 - _rsi7) / 50.0,
                (50.0 - _currentRsi) / 50.0,
                _tanh((_ema5 - _ema13) / stdDev),
                _tanh((_ema13 - _ema26) / stdDev),
                _tanh((_ema26 - _ema50) / stdDev),
                _tanh(_macdLine / stdDev),
                _tanh(_macdHistogram / stdDev),
                _tanh((mean - _lastPrice) / (1.8 * stdDev)),
                (50.0 - _stochasticK) / 50.0,
                (50.0 - _stochasticD) / 50.0,
                _tanh(-_cci14 / 150.0),
                (-50.0 - _williamsR) / 50.0,
                _tanh((_lastPrice - _priceHistory[max(0, _priceHistory.length - 4)]) / stdDev),
                _tanh(_priceMomentum / stdDev),
                (upSteps - downSteps) / max(1, stepWin).toDouble(),
                _tanh((lastStep - prevStep) / _atrVolatility),
              ];

              final double n1 = _leakyRelu(x[2] * 1.4 + x[3] * 1.2 + x[4] * 0.9 + x[5] * 1.1 + x[6] * 1.3);
              final double n2 = _leakyRelu(x[0] * 1.5 + x[1] * 1.4 + x[7] * 1.6 + x[8] * 1.2 + x[10] * 1.1);
              final double n3 = _leakyRelu(x[12] * 1.4 + x[13] * 1.3 + x[14] * 1.5 + x[15] * 1.1);
              final double n4 = _tanh(n1 * 0.55 + n2 * 0.45 + n3 * 0.50);

              double weightedSum = 0.0;
              for (int i = 0; i < x.length; i++) {
                weightedSum += x[i] * _deepNeuralWeights[i];
              }
              _mlpScore = _sigmoid((n4 * 1.6) + (weightedSum * 1.4));
              _modelProb = _model?.predict(_priceHistory, _tradeDuration);
              if (_modelProb != null) _mlpScore = _modelProb!;

              int rfCallTrees = 0;
              if (_ema5 > _ema13 && _ema13 > _ema26) rfCallTrees += 2;
              if (_macdHistogram > 0 && _macdLine > _macdSignal) rfCallTrees += 2;
              if (_currentRsi < 34.0 && lastStep > 0) rfCallTrees += 2;
              else if (_currentRsi > 48.0 && _currentRsi < 64.0 && _priceMomentum > 0) rfCallTrees += 2;
              if (_stochasticK < 25.0 && lastStep >= 0) rfCallTrees += 1;
              else if (_stochasticK > _stochasticD && _stochasticK < 78.0) rfCallTrees += 1;
              if (_cci14 < -100.0 && lastStep > 0) rfCallTrees += 1;
              else if (_cci14 > 0 && _cci14 < 110.0) rfCallTrees += 1;
              if (upSteps > downSteps && lastStep >= 0) rfCallTrees += 2;
              _randomForestScore = (rfCallTrees / 12.0).clamp(0.05, 0.95);

              _knnScore = 0.5;
              if (_aiPatternMemory.length >= 5 && _priceHistory.length >= 6) {
                final double curBase = _lastPrice;
                final int n = _priceHistory.length;
                final List<double> curPat = [
                  (_priceHistory[n - 1] - _priceHistory[n - 2]) / curBase * 1000.0,
                  (_priceHistory[n - 2] - _priceHistory[n - 3]) / curBase * 1000.0,
                  (_priceHistory[n - 3] - _priceHistory[n - 4]) / curBase * 1000.0,
                  (_priceHistory[n - 4] - _priceHistory[n - 5]) / curBase * 1000.0,
                  (_priceHistory[n - 5] - _priceHistory[n - 6]) / curBase * 1000.0,
                ];
                final List<MapEntry<double, bool>> dists = [];
                for (final sample in _aiPatternMemory) {
                  double d2 = 0.0;
                  for (int j = 0; j < 5; j++) {
                    final diff = curPat[j] - sample.features[j];
                    d2 += diff * diff;
                  }
                  dists.add(MapEntry(sqrt(d2), sample.wentUp));
                }
                dists.sort((a, b) => a.key.compareTo(b.key));
                final int kCount = min(9, dists.length);
                double wUp = 0.0;
                double wTot = 0.0;
                for (int k = 0; k < kCount; k++) {
                  final double w = 1.0 / (dists[k].key + 0.0005);
                  if (dists[k].value) wUp += w;
                  wTot += w;
                }
                if (wTot > 0) _knnScore = wUp / wTot;
              }

              _candlestickPatternScore = 0.5;
              if (_syntheticCandles.length >= 3) {
                final c0 = _syntheticCandles.last;
                final c1 = _syntheticCandles[_syntheticCandles.length - 2];
                final c2 = _syntheticCandles[_syntheticCandles.length - 3];

                double cScore = 0.5;
                if (c1.isBearish && c0.isBullish && c0.body > c1.body * 1.1) cScore += 0.28;
                if (c1.isBullish && c0.isBearish && c0.body > c1.body * 1.1) cScore -= 0.28;
                if (c0.lowerWick > c0.body * 1.8 && c0.isBullish) cScore += 0.22;
                if (c0.upperWick > c0.body * 1.8 && c0.isBearish) cScore -= 0.22;
                if (c2.isBullish && c1.isBullish && c0.isBullish) cScore += 0.20;
                if (c2.isBearish && c1.isBearish && c0.isBearish) cScore -= 0.20;
                _candlestickPatternScore = cScore.clamp(0.05, 0.95);
              }

              double qVal = 0.5;
              if (_ema5 > _ema13 && _priceMomentum > 0 && _currentRsi < 66.0) qVal += 0.30;
              else if (_ema5 < _ema13 && _priceMomentum < 0 && _currentRsi > 34.0) qVal -= 0.30;
              if (_lastPrice <= _bollingerLower && lastStep > 0) qVal += 0.25;
              else if (_lastPrice >= _bollingerUpper && lastStep < 0) qVal -= 0.25;
              _qLearningScore = qVal.clamp(0.05, 0.95);

              final List<double> modelScores = [
                _mlpScore,
                _randomForestScore,
                _knnScore,
                _candlestickPatternScore,
                _qLearningScore,
              ];

              int upModels = 0;
              int downModels = 0;
              double combinedProb = 0.0;
              double weightSum = 0.0;
              for (int i = 0; i < modelScores.length; i++) {
                if (modelScores[i] >= 0.52) upModels++;
                else if (modelScores[i] <= 0.48) downModels++;
                combinedProb += modelScores[i] * _ensembleModelWeights[i];
                weightSum += _ensembleModelWeights[i];
              }
              if (weightSum > 0) combinedProb /= weightSum;

              final bool isCallDir = combinedProb >= 0.5;
              _currentSignalDirection = isCallDir ? "CALL" : "PUT";
              _agreedIndicatorsCount = isCallDir ? max(1, upModels) : max(1, downModels);

              final double rawEdge = (combinedProb - 0.5).abs() * 2.0;
              final double agreementBonus = (_agreedIndicatorsCount / 5.0) * 18.0;
              final int finalStrength = (54.0 + (rawEdge * 32.0) + agreementBonus).round().clamp(52, 98);
              _currentSignalStrength = finalStrength;
            }

            void toggleAutoTrading() {
              if (_isAutoTrading) {
                stopAutoTrading(reason: "تم إيقاف البوت الآلي يدوياً.");
              } else {
                startAutoTrading();
              }
            }

            void startAutoTrading() {
              if (!_isConnected) {
                addLog("تنبيه: يرجى ربط الحساب من تبويب المنصة أولاً قبل تشغيل التداول الآلي.");
                return;
              }
              if (_initialSessionBalance > 0) {
                if (netProfit >= _takeProfitTarget) {
                  addLog("🎯 لقد وصلت بالفعل إلى هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)}).");
                  return;
                }
                if (netProfit <= -_stopLossLimit) {
                  addLog("🛑 لقد وصلت إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)}).");
                  return;
                }
              }

              _isAutoTrading = true;
              _currentTradeAmount = _baseAmount;
              _subscribeServerToAsset(activeAsset);

              if (_strategy == "platform_interest_contrarian") {
                addLog("💰 بدأ رادار الدقيقة الواحدة على ($activeAsset) | يبدأ عند الثانية 00 من كل دقيقة ويحسب السيولة لمدة دقيقة فقط (شرط الفارق: \$${_requiredVolumeDiff.toStringAsFixed(0)}+)");
              } else if (_strategy == "hybrid_ai_contrarian") {
                addLog("🔥 بدأ المحرك المدمج (رادار الدقيقة الواحدة بفارق \$${_requiredVolumeDiff.toStringAsFixed(0)}+ مع الذكاء الاصطناعي بقوة $_minSignalStrength%+)");
              } else {
                addLog("🧠 بدأ محرك المؤشرات الخماسي تحليل ($activeAsset) | شرط الدخول: قوة إشارة $_minSignalStrength%+");
              }
              notifyListeners();
            }

            void stopAutoTrading({String? reason}) {
              _isAutoTrading = false;
              _scannerTimer?.cancel();
              if (reason != null) addLog(reason);
              notifyListeners();
            }

            Future<void> placeOrder({
              required String asset,
              required String direction,
              required double amount,
              required int duration,
            }) async {
              if (!_isConnected || _webViewController == null) {
                addLog("تنبيه: اربط حسابك أولاً من شاشة المنصة لتنفيذ الصفقات.");
                return;
              }
              if (_isTradeOpen) {
                addLog("⏳ توجد صفقة جارية حالياً (متبقي ${_remainingSeconds}s) — انتظر إغلاقها.");
                return;
              }

              final double balanceBeforeOrder = _balance;
              final double entryPriceBeforeOrder = _lastPrice;
              final bool isCall = direction.toLowerCase() == "call";
              final String targetPair = asset == "AUTO_CHART" ? _chartDisplayPair : asset;
              final String serverSym = toServerSymbol(targetPair);
              final int isDemoInt = _accountType == "demo" ? 1 : 0;
              final String cleanAmount = amount == amount.roundToDouble()
                  ? amount.toInt().toString()
                  : amount.toStringAsFixed(2);

              final execRes = await _webViewController!.evaluateJavascript(source: '''
                (function() {
                  try {
                    const assetSym = (window.__qm_resolve ? window.__qm_resolve('$targetPair', '$serverSym') : '$serverSym');
                    const amt = Number('$cleanAmount');
                    const dir = ${isCall ? "'call'" : "'put'"};
                    const dur = $duration;
                    const isDemoVal = $isDemoInt;
                    const nowSec = Math.floor(Date.now() / 1000);

                    const rem = nowSec % 60;
                    const addMin = (rem > 30) ? 2 : 1;
                    const expClockTimestamp = (Math.floor(nowSec / 60) + addMin) * 60;

                    window.__qm_last_order_accepted = false;
                    window.__qm_last_srv_msg = '';
                    window.__qm_last_deal_profit = null;

                    let activeWs = null;
                    if (window.__qm_sockets && window.__qm_sockets.length > 0) {
                      for (let i = window.__qm_sockets.length - 1; i >= 0; i--) {
                        const s = window.__qm_sockets[i];
                        if (s && s.readyState === 1) {
                          activeWs = s;
                          break;
                        }
                      }
                    }

                    if (!activeWs) return 'NO_OPEN_SOCKET';

                    activeWs.send('42["instruments/update",{"asset":"' + assetSym + '","period":' + dur + '}]');
                    activeWs.send('42["depth/follow","' + assetSym + '"]');

                    const store100 = {
                      chartId: "graph",
                      settings: {
                        chartId: "graph",
                        chartType: 2,
                        currentExpirationTime: dur,
                        isFastOption: false,
                        isFastAmountOption: false,
                        isIndicatorsMinimized: false,
                        isIndicatorsShowing: true,
                        isShortBetElement: false,
                        chartPeriod: 4,
                        currentAsset: { symbol: assetSym },
                        dealValue: amt,
                        dealPercentValue: 1,
                        isVisible: true,
                        timePeriod: 30,
                        gridOpacity: 8,
                        isAutoScrolling: 1,
                        isOneClickTrade: true,
                        upColor: "#0FAF59",
                        downColor: "#FF6251"
                      }
                    };
                    // إرسال صفقة واحدة فقط حسب نوع الزوج (منع تكرار فتح صفقتين في نفس اللحظة)
                    const isOtcPair = assetSym.toLowerCase().indexOf('_otc') !== -1;
                    if (isOtcPair) {
                      activeWs.send('42["settings/store",' + JSON.stringify(store100) + ']');
                      const order100 = {
                        asset: assetSym,
                        amount: amt,
                        time: dur,
                        action: dir,
                        isDemo: isDemoVal,
                        tournamentId: 0,
                        requestId: nowSec,
                        optionType: 100
                      };
                      activeWs.send('42["orders/open",' + JSON.stringify(order100) + ']');
                    } else {
                      const store1 = JSON.parse(JSON.stringify(store100));
                      store1.settings.currentExpirationTime = expClockTimestamp;
                      activeWs.send('42["settings/store",' + JSON.stringify(store1) + ']');
                      const order1 = {
                        asset: assetSym,
                        amount: amt,
                        time: expClockTimestamp,
                        action: dir,
                        isDemo: isDemoVal,
                        tournamentId: 0,
                        requestId: nowSec,
                        optionType: 1
                      };
                      activeWs.send('42["orders/open",' + JSON.stringify(order1) + ']');
                    }

                    return 'WS_ORDER_DISPATCHED:' + assetSym;
                  } catch(e) {
                    return 'ERR:' + e.message;
                  }
                })();
              ''');

              if (execRes == null || execRes.toString().contains("NO_OPEN_SOCKET") || execRes.toString().contains("ERR:")) {
                addLog("⚠ لم يتم العثور على قناة WebSocket نشطة (${execRes ?? ''}) — اضغط على تبويب المنصة والشارت لتنشيط الاتصال.");
                return;
              }

              final String usedSym = execRes.toString().contains(':') ? execRes.toString().split(':').last : serverSym;
              String? rejectMsg;
              for (int i = 0; i < 8; i++) {
                await Future.delayed(const Duration(milliseconds: 400));
                try {
                  final chk = await _webViewController!.evaluateJavascript(source: "JSON.stringify({ok: !!window.__qm_last_order_accepted, msg: window.__qm_last_srv_msg || ''})");
                  final cm = jsonDecode(chk.toString());
                  if (cm['ok'] == true) {
                    rejectMsg = null;
                    break;
                  }
                  final mm = (cm['msg'] ?? '').toString();
                  if (mm.isNotEmpty) rejectMsg = mm;
                } catch (_) {}
              }
              if (rejectMsg != null) {
                addLog("❌ رفض السيرفر الصفقة على $targetPair ($usedSym): $rejectMsg");
                return;
              }

              _isTradeOpen = true;
              _remainingSeconds = duration;
              _activeTradeEntryPrice = entryPriceBeforeOrder;
              _activeTradeBalanceBefore = balanceBeforeOrder;
              _activeTradeDirection = direction.toLowerCase();
              _activeTradeAsset = targetPair;
              _activeTradeAmount = amount;
              _totalTrades++;
              notifyListeners();

              addLog("🚀 تم تنفيذ صفقة ${direction.toUpperCase()} مباشرة عبر السيرفر على $targetPair ($usedSym) بمبلغ \$$cleanAmount");

              _tradeLifecycleTimer?.cancel();
              _tradeLifecycleTimer = Timer.periodic(const Duration(seconds: 1), (timer) {
                if (_remainingSeconds > 0) {
                  _remainingSeconds--;
                  notifyListeners();
                } else {
                  timer.cancel();
                  _finalizeAndEvaluateTrade();
                }
              });
            }

            Future<void> _finalizeAndEvaluateTrade() async {
              await Future.delayed(const Duration(seconds: 2));

              final double currentBal = _balance;
              final double beforeBal = _activeTradeBalanceBefore;
              final double diff = currentBal - beforeBal;

              if (beforeBal > 0 && currentBal > 0) {
                if (diff > 0.05) {
                  _wonTrades++;
                  _currentTradeAmount = _baseAmount;
                  for (int i = 0; i < _deepNeuralWeights.length; i++) {
                    _deepNeuralWeights[i] = (_deepNeuralWeights[i] * 1.03).clamp(0.08, 0.50);
                  }
                  addLog("✔ صفقة رابحة مؤكدة (+ \$${diff.toStringAsFixed(2)}) | الرصيد الجديد: \$${currentBal.toStringAsFixed(2)} | العودة للمبلغ الأساسي: \$$_baseAmount");
                } else if (diff < -0.05) {
                  _lostTrades++;
                  for (int i = 0; i < _deepNeuralWeights.length; i++) {
                    _deepNeuralWeights[i] = (_deepNeuralWeights[i] * 0.97).clamp(0.08, 0.50);
                  }
                  if (_useMartingale) {
                    _currentTradeAmount = double.parse((_currentTradeAmount * _martingaleMultiplier).toStringAsFixed(2));
                    addLog("✖ صفقة خاسرة مؤكدة (-\$${diff.abs().toStringAsFixed(2)}) | الرصيد الجديد: \$${currentBal.toStringAsFixed(2)} | مضاعفة الصفقة القادمة: \$$_currentTradeAmount");
                  } else {
                    _currentTradeAmount = _baseAmount;
                    addLog("✖ صفقة خاسرة مؤكدة (-\$${diff.abs().toStringAsFixed(2)}) | الرصيد الجديد: \$${currentBal.toStringAsFixed(2)}");
                  }
                } else {
                  addLog("⚖ انتهى وقت الصفقة دون تغير في الرصيد (\$${currentBal.toStringAsFixed(2)}).");
                }
              }

              _isTradeOpen = false;
              _remainingSeconds = 0;
              notifyListeners();

              if (_isAutoTrading && _initialSessionBalance > 0) {
                if (netProfit >= _takeProfitTarget) {
                  stopAutoTrading(reason: "🎯 تم الوصول إلى هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)}) — توقف البوت تلقائياً!");
                  return;
                }
                if (netProfit <= -_stopLossLimit) {
                  stopAutoTrading(reason: "🛑 تم الوصول إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)}) — توقف البوت تلقائياً!");
                  return;
                }
              }
            }

            Future<void> disconnect() async {
              stopAutoTrading();
              _tradeLifecycleTimer?.cancel();
              _pingTimer?.cancel();
              _webSyncTimer?.cancel();
              await _directSocket?.close();
              _directSocket = null;
              _isTradeOpen = false;
              _isConnected = false;
              _isAuthenticated = false;
              addLog("تم قطع الاتصال بالسيرفر.");
              notifyListeners();
            }

            @override
            void dispose() {
              disconnect();
              super.dispose();
            }
          }
          EOF

