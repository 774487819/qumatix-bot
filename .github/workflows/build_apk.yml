                    'momentum=${_priceMomentum.toStringAsFixed(6)}, crowdCallVolume=$_crowdCallVolume, crowdPutVolume=$_crowdPutVolume, '
                    'trainedModelProbUp=${_modelProb?.toStringAsFixed(3) ?? "n/a"}, indicatorSignal=$_currentSignalDirection $_currentSignalStrength%, '
                    'last30Prices=${recent.join(",")}';
                final base = _providers.firstWhere((p) => p['id'] == _aiProv)['base']!;
                (int, String) r = (0, '');
                String text = '';
                if (_aiProv == 'gemini' || _aiProv == 'vertex') {
                  final url = _aiProv == 'vertex'
                      ? '$base/publishers/google/models/$_geminiModel:generateContent?key=$_geminiKey'
                      : '$base/models/$_geminiModel:generateContent';
                  r = await _httpCall('POST', url, {'Content-Type': 'application/json', if (_aiProv == 'gemini') 'x-goog-api-key': _geminiKey},
                      jsonEncode({
                        'contents': [
                          {'role': 'user', 'parts': [{'text': prompt}]}
                        ],
                        'generationConfig': {'temperature': 0.2, 'responseMimeType': 'application/json'},
                      }));
                  if (r.$1 == 200) text = jsonDecode(r.$2)['candidates'][0]['content']['parts'][0]['text'] as String;
                } else if (_aiProv == 'anthropic') {
                  r = await _httpCall('POST', '$base/messages', {'Content-Type': 'application/json', ..._aiHeaders('anthropic', _geminiKey)},
                      jsonEncode({'model': _geminiModel, 'max_tokens': 400, 'messages': [{'role': 'user', 'content': prompt}]}));
                  if (r.$1 == 200) text = jsonDecode(r.$2)['content'][0]['text'] as String;
                } else {
                  r = await _httpCall('POST', '$base/chat/completions', {'Content-Type': 'application/json', ..._aiHeaders(_aiProv, _geminiKey)},
                      jsonEncode({'model': _geminiModel, 'temperature': 0.2, 'messages': [{'role': 'user', 'content': prompt}]}));
                  if (r.$1 == 200) text = jsonDecode(r.$2)['choices'][0]['message']['content'] as String;
                }
                if (r.$1 != 200) {
                  String detail = '';
                  try {
                    detail = (jsonDecode(r.$2)['error']['message'] ?? '').toString();
                  } catch (_) {}
                  if (detail.length > 140) detail = detail.substring(0, 140);
                  addLog("$_aiName: رفض الطلب (رمز ${r.$1}) $detail");
                  _geminiDir = '';
                } else {
                  final jsonText = RegExp(r'\{[\s\S]*\}').firstMatch(text)?.group(0) ?? text;
                  final m = jsonDecode(jsonText);
                  final d = (m['direction'] ?? '').toString().toUpperCase();
                  _geminiDir = (d == 'CALL' || d == 'PUT') ? d : 'WAIT';
                  _geminiConf = ((m['confidence'] as num?) ?? 0).round().clamp(0, 100);
                  _geminiReason = (m['reason'] ?? '').toString();
                }
              } catch (_) {
                addLog("الذكاء الاصطناعي: تعذر الاتصال أو قراءة الرد");
                _geminiDir = '';
              } finally {
                _geminiBusy = false;
                notifyListeners();
              }
            }

