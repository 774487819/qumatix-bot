name: Build QuMatix APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Flutter Android Project Structure
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name qumatix_bot --platforms=android --org com.qumatix.app .
          fi
          rm -rf test

      - name: Generate pubspec.yaml
        run: |
          cat << 'EOF' > pubspec.yaml
          name: qumatix_bot
          description: "QuMatix Automated Trading Bot Connected to Live Server"
          publish_to: 'none'
          version: 2.0.0+2

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            provider: ^6.1.2
            flutter_inappwebview: ^6.1.5
            shared_preferences: ^2.2.3
            cupertino_icons: ^1.0.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Write Full AndroidManifest.xml with Internet Permissions
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="QuMatix Bot"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Generate quotex_service.dart (Live WebSocket + Auto-Trading Engine)
        run: |
          mkdir -p lib/services
          cat << 'EOF' > lib/services/quotex_service.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:math';
          import 'package:flutter/foundation.dart';

          class QuotexService extends ChangeNotifier {
            WebSocket? _socket;
            Timer? _pingTimer;
            Timer? _autoTradeTimer;

            bool _isConnected = false;
            bool _isAuthenticated = false;
            bool _isAutoTrading = false;

            double _balance = 0.0;
            double _initialSessionBalance = 0.0;
            String _accountType = "demo";
            String _currentDomain = "market-qx.pro";
            String _activeAsset = "EURUSD_otc";
            int _tradeDuration = 60;
            double _baseAmount = 1.0;
            double _currentTradeAmount = 1.0;
            bool _useMartingale = true;
            double _martingaleMultiplier = 2.0;
            double _takeProfitTarget = 50.0;
            double _stopLossLimit = 25.0;
            String _strategy = "qumatix_rsi_ema";

            double _lastPrice = 0.0;
            double _currentRsi = 50.0;
            String _lastSignal = "انتظار إشارة...";
            int _totalTrades = 0;
            int _wonTrades = 0;
            int _lostTrades = 0;

            final List<double> _priceHistory = [];
            final List<String> _logs = [];

            bool get isConnected => _isConnected;
            bool get isAuthenticated => _isAuthenticated;
            bool get isAutoTrading => _isAutoTrading;
            double get balance => _balance;
            double get netProfit => _initialSessionBalance > 0 ? (_balance - _initialSessionBalance) : 0.0;
            String get accountType => _accountType;
            String get currentDomain => _currentDomain;
            String get activeAsset => _activeAsset;
            int get tradeDuration => _tradeDuration;
            double get baseAmount => _baseAmount;
            double get currentTradeAmount => _currentTradeAmount;
            bool get useMartingale => _useMartingale;
            double get martingaleMultiplier => _martingaleMultiplier;
            double get takeProfitTarget => _takeProfitTarget;
            double get stopLossLimit => _stopLossLimit;
            String get strategy => _strategy;
            double get lastPrice => _lastPrice;
            double get currentRsi => _currentRsi;
            String get lastSignal => _lastSignal;
            int get totalTrades => _totalTrades;
            int get wonTrades => _wonTrades;
            int get lostTrades => _lostTrades;
            List<String> get logs => List.unmodifiable(_logs);

            void updateSettings({
              String? asset,
              int? duration,
              double? baseAmount,
              bool? useMartingale,
              double? martingaleMultiplier,
              double? takeProfit,
              double? stopLoss,
              String? strategy,
            }) {
              if (asset != null && asset != _activeAsset) {
                _activeAsset = asset;
                _priceHistory.clear();
                if (_isConnected) {
                  _subscribeToAsset(_activeAsset);
                }
              }
              if (duration != null) _tradeDuration = duration;
              if (baseAmount != null && baseAmount > 0) {
                _baseAmount = baseAmount;
                if (!_isAutoTrading) _currentTradeAmount = baseAmount;
              }
              if (useMartingale != null) _useMartingale = useMartingale;
              if (martingaleMultiplier != null && martingaleMultiplier > 1.0) {
                _martingaleMultiplier = martingaleMultiplier;
              }
              if (takeProfit != null) _takeProfitTarget = takeProfit;
              if (stopLoss != null) _stopLossLimit = stopLoss;
              if (strategy != null) _strategy = strategy;
              notifyListeners();
            }

            void addLog(String message) {
              final now = DateTime.now();
              final time = "${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}:${now.second.toString().padLeft(2, '0')}";
              _logs.insert(0, "[$time] $message");
              if (_logs.length > 150) _logs.removeLast();
              notifyListeners();
            }

            Future<void> connect({
              required String ssidToken,
              bool isRealAccount = false,
              String domain = "market-qx.pro",
            }) async {
              await disconnect();
              _accountType = isRealAccount ? "real" : "demo";
              _currentDomain = domain;

              final List<String> fallbackDomains = [
                domain,
                "market-qx.pro",
                "qxbroker.com",
                "quotex.io",
                "quotex.com",
              ].toSet().toList();

              for (final dom in fallbackDomains) {
                addLog("جاري الاتصال بسيرفر التداول المباشر ws2.$dom...");
                try {
                  final wsUri = Uri.parse("wss://ws2.$dom/socket.io/?EIO=3&transport=websocket");
                  final headers = {
                    'Origin': 'https://$dom',
                    'User-Agent': 'Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36',
                  };

                  _socket = await WebSocket.connect(
                    wsUri.toString(),
                    headers: headers,
                  ).timeout(const Duration(seconds: 10));

                  _isConnected = true;
                  _currentDomain = dom;
                  addLog("تم فتح قناة WebSocket الحية مع ws2.$dom ✔");
                  notifyListeners();

                  _startPingTimer();

                  _socket!.listen(
                    (data) => _handleIncomingData(data.toString(), ssidToken),
                    onError: (err) {
                      addLog("خطأ في قناة السيرفر: $err");
                      disconnect();
                    },
                    onDone: () {
                      addLog("تم إغلاق الاتصال من السيرفر.");
                      disconnect();
                    },
                  );
                  return;
                } catch (e) {
                  addLog("تعذر الوصول إلى ws2.$dom، جاري تجربة النطاق البديل...");
                }
              }

              addLog("فشل الاتصال بجميع نطاقات السيرفر. تأكد من الإنترنت أو تفعيل VPN.");
              _isConnected = false;
              notifyListeners();
            }

            void _startPingTimer() {
              _pingTimer?.cancel();
              _pingTimer = Timer.periodic(const Duration(seconds: 20), (_) {
                if (_isConnected && _socket != null) {
                  _socket?.add('2');
                }
              });
            }

            void _subscribeToAsset(String asset) {
              if (!_isConnected || _socket == null) return;
              _socket?.add('42["instruments/update",{"asset":"$asset","period":$_tradeDuration}]');
              _socket?.add('42["depth/follow","$asset"]');
              _socket?.add('42["chart_notification/get",{"asset":"$asset","version":"1.0.0"}]');
              addLog("تم الاشتراك في البث الحي لأسعار الزوج: $asset");
            }

            void _handleIncomingData(String rawMsg, String token) {
              if (rawMsg.startsWith('0')) {
                addLog("تم استلام ترحيب Engine.IO، جاري إرسال مصادقة الجلسة...");
                _sendAuthPacket(token);
              } else if (rawMsg == '2') {
                _socket?.add('3');
              } else if (rawMsg.startsWith('42')) {
                try {
                  final jsonPart = rawMsg.substring(2);
                  final dynamic decoded = jsonDecode(jsonPart);
                  if (decoded is! List || decoded.isEmpty) return;

                  final String eventName = decoded[0].toString();
                  final dynamic payload = decoded.length > 1 ? decoded[1] : null;

                  if (eventName.contains("authorization")) {
                    _isAuthenticated = true;
                    addLog("تمت المصادقة مع السيرفر بنجاح! حسابك جاهز للتداول الآلي 🎉");
                    _socket?.add('42["balance/list"]');
                    _subscribeToAsset(_activeAsset);
                    notifyListeners();
                  } else if (eventName.contains("balance")) {
                    if (payload is Map) {
                      final bal = payload['balance'] ?? (_accountType == "demo" ? payload['demoBalance'] : payload['liveBalance']);
                      if (bal is num) {
                        final newBal = bal.toDouble();
                        if (_initialSessionBalance == 0.0) {
                          _initialSessionBalance = newBal;
                        } else if (newBal != _balance) {
                          _evaluateCompletedTrade(newBal);
                        }
                        _balance = newBal;
                        addLog("الرصيد المحدث من السيرفر: \$${_balance.toStringAsFixed(2)}");
                        notifyListeners();
                      }
                    }
                  } else if (eventName.contains("quotes") || eventName.contains("candles") || eventName.contains("depth")) {
                    _extractLivePrice(payload);
                  }
                } catch (_) {}
              }
            }

            void _extractLivePrice(dynamic payload) {
              try {
                double? price;
                if (payload is List && payload.isNotEmpty) {
                  final first = payload.last;
                  if (first is List && first.length >= 2 && first[1] is num) {
                    price = (first[1] as num).toDouble();
                  } else if (first is Map && first['price'] is num) {
                    price = (first['price'] as num).toDouble();
                  }
                } else if (payload is Map && payload['price'] is num) {
                  price = (payload['price'] as num).toDouble();
                }

                if (price != null && price > 0) {
                  _lastPrice = price;
                  _priceHistory.add(price);
                  if (_priceHistory.length > 60) _priceHistory.removeAt(0);
                  _calculateIndicators();
                  notifyListeners();
                }
              } catch (_) {}
            }

            void _calculateIndicators() {
              if (_priceHistory.length < 15) return;

              double gains = 0.0;
              double losses = 0.0;
              for (int i = _priceHistory.length - 14; i < _priceHistory.length; i++) {
                final diff = _priceHistory[i] - _priceHistory[i - 1];
                if (diff > 0) {
                  gains += diff;
                } else {
                  losses -= diff;
                }
              }
              final avgGain = gains / 14.0;
              final avgLoss = losses / 14.0;
              if (avgLoss == 0) {
                _currentRsi = 100.0;
              } else {
                final rs = avgGain / avgLoss;
                _currentRsi = 100.0 - (100.0 / (1.0 + rs));
              }
            }

            void _evaluateCompletedTrade(double newBalance) {
              if (newBalance > _balance) {
                _wonTrades++;
                _currentTradeAmount = _baseAmount;
                addLog("صفقة رابحة ✔ (+ \$${(newBalance - _balance).toStringAsFixed(2)}) | إعادة المبلغ الأساسي: \$$_baseAmount");
              } else if (newBalance < _balance) {
                _lostTrades++;
                if (_useMartingale) {
                  _currentTradeAmount = double.parse((_currentTradeAmount * _martingaleMultiplier).toStringAsFixed(2));
                  addLog("صفقة خاسرة ✖ | تفعيل المضاعفة (Martingale) للصفقة القادمة: \$$_currentTradeAmount");
                }
              }

              if (_isAutoTrading) {
                if (netProfit >= _takeProfitTarget) {
                  stopAutoTrading(reason: "تم الوصول إلى هدف الربح اليومي (+\$${netProfit.toStringAsFixed(2)}) 🎯");
                } else if (netProfit <= -_stopLossLimit) {
                  stopAutoTrading(reason: "تم الوصول إلى حد وقف الخسارة (\$${netProfit.toStringAsFixed(2)}) 🛑");
                }
              }
            }

            void _sendAuthPacket(String token) {
              final authData = jsonEncode({
                "session": token,
                "isDemo": _accountType == "demo" ? 1 : 0,
                "tournamentId": 0,
              });
              final packet = '42["authorization",$authData]';
              _socket?.add(packet);
            }

            void toggleAutoTrading() {
              if (_isAutoTrading) {
                stopAutoTrading(reason: "تم إيقاف البوت الآلي يدوياً.");
              } else {
                startAutoTrading();
              }
            }

            void startAutoTrading() {
              if (!_isConnected || _socket == null) {
                addLog("تنبيه: يجب الاتصال بالسيرفر أولاً قبل تشغيل التداول الآلي.");
                return;
              }
              _isAutoTrading = true;
              _currentTradeAmount = _baseAmount;
              addLog("تم تشغيل بوت التداول الآلي QuMatix على الزوج $_activeAsset باستراتيجية $_strategy 🤖");
              notifyListeners();

              _autoTradeTimer?.cancel();
              _autoTradeTimer = Timer.periodic(Duration(seconds: max(15, _tradeDuration + 2)), (_) {
                if (!_isAutoTrading || !_isConnected) return;
                _executeStrategyCycle();
              });

              _executeStrategyCycle();
            }

            void stopAutoTrading({String? reason}) {
              _isAutoTrading = false;
              _autoTradeTimer?.cancel();
              if (reason != null) addLog(reason);
              notifyListeners();
            }

            void _executeStrategyCycle() {
              String direction = "call";

              if (_priceHistory.length >= 15) {
                final double shortMa = _priceHistory.sublist(_priceHistory.length - 5).reduce((a, b) => a + b) / 5.0;
                final double longMa = _priceHistory.sublist(_priceHistory.length - 15).reduce((a, b) => a + b) / 15.0;

                if (_strategy == "qumatix_rsi_ema") {
                  if (_currentRsi < 38 || shortMa > longMa) {
                    direction = "call";
                    _lastSignal = "شراء قوي (CALL) | RSI: ${_currentRsi.toStringAsFixed(1)}";
                  } else {
                    direction = "put";
                    _lastSignal = "بيع قوي (PUT) | RSI: ${_currentRsi.toStringAsFixed(1)}";
                  }
                } else if (_strategy == "trend_momentum") {
                  direction = shortMa >= longMa ? "call" : "put";
                  _lastSignal = direction == "call" ? "اتجاه صاعد (CALL)" : "اتجاه هابط (PUT)";
                } else {
                  direction = _currentRsi <= 50 ? "call" : "put";
                  _lastSignal = direction == "call" ? "ارتداد صاعد (CALL)" : "ارتداد هابط (PUT)";
                }
              } else {
                _lastSignal = "تحليل السيولة المباشرة (CALL)";
                direction = "call";
              }

              addLog("إشارة البوت الآلي: $_lastSignal");
              placeOrder(
                asset: _activeAsset,
                direction: direction,
                amount: _currentTradeAmount,
                duration: _tradeDuration,
              );
            }

            void placeOrder({
              required String asset,
              required String direction,
              required double amount,
              required int duration,
            }) {
              if (!_isConnected || _socket == null) {
                addLog("تنبيه: لا يوجد اتصال فعال بالسيرفر لإرسال الصفقة.");
                return;
              }

              final orderData = jsonEncode({
                "asset": asset,
                "amount": amount,
                "action": direction.toLowerCase(),
                "time": duration,
                "isDemo": _accountType == "demo" ? 1 : 0,
                "tournamentId": 0,
                "requestId": DateTime.now().millisecondsSinceEpoch,
                "optionType": 100,
              });

              final orderPacket = '42["orders/open",$orderData]';
              _socket?.add(orderPacket);
              _totalTrades++;
              addLog("تم إرسال أمر التداول للسيرفر: ${direction.toUpperCase()} على $asset بمبلغ \$$amount لمدة ${duration}s 🚀");
              notifyListeners();
            }

            Future<void> disconnect() async {
              stopAutoTrading();
              _pingTimer?.cancel();
              await _socket?.close();
              _socket = null;
              _isConnected = false;
              _isAuthenticated = false;
              notifyListeners();
            }

            @override
            void dispose() {
              disconnect();
              super.dispose();
            }
          }
          EOF

      - name: Generate login_screen.dart (Multi-Domain + Error Recovery + Token Extractor)
        run: |
          mkdir -p lib/screens
          cat << 'EOF' > lib/screens/login_screen.dart
          import 'package:flutter/material.dart';
          import 'package:flutter_inappwebview/flutter_inappwebview.dart';

          class QuotexLoginScreen extends StatefulWidget {
            final String domain;
            const QuotexLoginScreen({super.key, this.domain = "market-qx.pro"});

            @override
            State<QuotexLoginScreen> createState() => _QuotexLoginScreenState();
          }

          class _QuotexLoginScreenState extends State<QuotexLoginScreen> {
            InAppWebViewController? _webViewController;
            bool _isLoading = true;
            String? _webError;
            late String _currentDomain;
            final TextEditingController _customDomainController = TextEditingController();

            final List<String> _domains = [
              "market-qx.pro",
              "qxbroker.com",
              "quotex.io",
              "quotex.com",
            ];

            @override
            void initState() {
              super.initState();
              _currentDomain = widget.domain;
              if (!_domains.contains(_currentDomain)) {
                _domains.insert(0, _currentDomain);
              }
            }

            Future<void> _checkCookies({bool showIfEmpty = false}) async {
              try {
                final cookieManager = CookieManager.instance();
                final cookies = await cookieManager.getCookies(url: WebUri("https://$_currentDomain"));

                String? foundToken;
                for (var cookie in cookies) {
                  if (cookie.name == 'ssid' || cookie.name == 'keep_code' || cookie.name == 'token') {
                    foundToken = cookie.value;
                    break;
                  }
                }

                if (foundToken != null && foundToken.isNotEmpty && mounted) {
                  Navigator.pop(context, {
                    'token': foundToken,
                    'domain': _currentDomain,
                  });
                } else if (showIfEmpty && mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text("لم يتم العثور على جلسة نشطة بعد. أكمل تسجيل الدخول أولاً ثم اضغط علامة الصح ✔"),
                      backgroundColor: Colors.orange,
                    ),
                  );
                }
              } catch (_) {}
            }

            void _switchDomain(String newDomain) {
              final clean = newDomain.replaceAll("https://", "").replaceAll("http://", "").split("/").first.trim();
              if (clean.isEmpty) return;
              setState(() {
                if (!_domains.contains(clean)) _domains.insert(0, clean);
                _currentDomain = clean;
                _isLoading = true;
                _webError = null;
              });
              _webViewController?.loadUrl(
                urlRequest: URLRequest(
                  url: WebUri("https://$_currentDomain/ar/sign-in"),
                ),
              );
            }

            void _showCustomDomainDialog() {
              _customDomainController.text = _currentDomain;
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E293B),
                  title: const Text("إدخال نطاق بديل للمنصة"),
                  content: TextField(
                    controller: _customDomainController,
                    decoration: const InputDecoration(
                      hintText: "مثال: market-qx.pro",
                      border: OutlineInputBorder(),
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text("إلغاء"),
                    ),
                    ElevatedButton(
                      onPressed: () {
                        Navigator.pop(ctx);
                        _switchDomain(_customDomainController.text);
                      },
                      child: const Text("فتح النطاق"),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text("تسجيل الدخول للمنصة", style: TextStyle(fontSize: 16)),
                  backgroundColor: const Color(0xFF1E293B),
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.language),
                      tooltip: "كتابة نطاق مخصص",
                      onPressed: _showCustomDomainDialog,
                    ),
                    IconButton(
                      icon: const Icon(Icons.refresh),
                      tooltip: "إعادة تحميل",
                      onPressed: () {
                        setState(() {
                          _isLoading = true;
                          _webError = null;
                        });
                        _webViewController?.reload();
                      },
                    ),
                    IconButton(
                      icon: const Icon(Icons.check_circle, color: Colors.greenAccent),
                      tooltip: "تأكيد الدخول واستخراج الجلسة",
                      onPressed: () => _checkCookies(showIfEmpty: true),
                    ),
                  ],
                  bottom: PreferredSize(
                    preferredSize: const Size.fromHeight(48),
                    child: Container(
                      color: const Color(0xFF0F172A),
                      padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 6),
                      child: Row(
                        children: [
                          const Text("السيرفر: ", style: TextStyle(fontSize: 12, color: Colors.white70)),
                          const SizedBox(width: 6),
                          Expanded(
                            child: SingleChildScrollView(
                              scrollDirection: Axis.horizontal,
                              child: Row(
                                children: _domains.map((dom) {
                                  final isSelected = dom == _currentDomain;
                                  return Padding(
                                    padding: const EdgeInsets.only(right: 6),
                                    child: ChoiceChip(
                                      label: Text(dom, style: const TextStyle(fontSize: 12)),
                                      selected: isSelected,
                                      selectedColor: const Color(0xFF2563EB),
                                      onSelected: (_) => _switchDomain(dom),
                                    ),
                                  );
                                }).toList(),
                              ),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
                body: Stack(
                  children: [
                    InAppWebView(
                      initialUrlRequest: URLRequest(
                        url: WebUri("https://$_currentDomain/ar/sign-in"),
                      ),
                      initialSettings: InAppWebViewSettings(
                        javaScriptEnabled: true,
                        domStorageEnabled: true,
                        databaseEnabled: true,
                        clearCache: false,
                        userAgent: "Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36",
                      ),
                      onWebViewCreated: (controller) => _webViewController = controller,
                      onLoadStart: (controller, url) {
                        if (mounted) {
                          setState(() {
                            _isLoading = true;
                            _webError = null;
                          });
                        }
                      },
                      onLoadStop: (controller, url) async {
                        if (mounted) setState(() => _isLoading = false);
                        await _checkCookies();
                      },
                      onReceivedError: (controller, request, error) {
                        if (request.isForMainFrame ?? true) {
                          if (mounted) {
                            setState(() {
                              _isLoading = false;
                              _webError = error.description;
                            });
                          }
                        }
                      },
                    ),
                    if (_webError != null)
                      Container(
                        color: const Color(0xFF0F172A),
                        padding: const EdgeInsets.all(24),
                        child: Center(
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              const Icon(Icons.wifi_off, size: 56, color: Colors.amber),
                              const SizedBox(height: 16),
                              Text(
                                "النطاق ($_currentDomain) محجوب أو غير متاح على شبكتك الحالية",
                                textAlign: TextAlign.center,
                                style: const TextStyle(fontSize: 17, fontWeight: FontWeight.bold),
                              ),
                              const SizedBox(height: 8),
                              Text(
                                "السبب التقني: $_webError\nاختر نطاقاً بديلاً بالأسفل أو شغّل VPN لتجاوز حجب مزود الإنترنت المحلي:",
                                textAlign: TextAlign.center,
                                style: const TextStyle(color: Colors.white70, fontSize: 13),
                              ),
                              const SizedBox(height: 20),
                              Wrap(
                                spacing: 8,
                                runSpacing: 8,
                                alignment: WrapAlignment.center,
                                children: _domains.map((dom) {
                                  return ElevatedButton.icon(
                                    style: ElevatedButton.styleFrom(
                                      backgroundColor: dom == _currentDomain ? Colors.blueGrey : const Color(0xFF2563EB),
                                    ),
                                    onPressed: () => _switchDomain(dom),
                                    icon: const Icon(Icons.swap_horiz, size: 18),
                                    label: Text("تجربة $dom"),
                                  );
                                }).toList(),
                              ),
                            ],
                          ),
                        ),
                      ),
                    if (_isLoading)
                      const Center(
                        child: CircularProgressIndicator(),
                      ),
                  ],
                ),
              );
            }
          }
          EOF

