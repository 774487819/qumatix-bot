                _baseAmount = baseAmount;
                if (!_isAutoTrading && !_isTradeOpen) {
                  _currentTradeAmount = baseAmount;
                }
              }
              if (useMartingale != null) _useMartingale = useMartingale;
              if (martingaleMultiplier != null && martingaleMultiplier > 1.0) {
                _martingaleMultiplier = martingaleMultiplier;
              }
              if (takeProfit != null && takeProfit > 0) _takeProfitTarget = takeProfit;
              if (stopLoss != null && stopLoss > 0) _stopLossLimit = stopLoss;
              if (strategy != null && strategy != _strategy) {
                _strategy = strategy;
                if (_priceHistory.length >= 4) {
                  _calculateAllIndicatorsAndStrength();
                }
