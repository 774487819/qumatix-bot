          class _QuotexPlatformViewState extends State<QuotexPlatformView> {
            InAppWebViewController? _webViewController;
            bool _isLoading = true;
            String? _webError;
            String _currentDomain = "market-qx.pro";

            final List<String> _domains = [
              "market-qx.pro",
              "quotex.io",
              "qxbroker.com",
              "quotex.com",
            ];

            final String _wsHookScript = '''
              (function() {
                if (window.__qm_hooked) return;
                window.__qm_hooked = true;
                window.__qm_sockets = [];
                window.__qm_auth_token = null;
                window.__qm_ws_balance = null;
                window.__qm_active_ws_key = '';
                window.__qm_by_norm = {};
                window.__qm_last_order_accepted = false;
                window.__qm_last_deal_profit = null;

                // متغيرات رادار الدقيقة الواحدة المتزامن مع بداية كل دقيقة (00s -> 59s)
                window.__qm_cur_min_bucket = Math.floor(Date.now() / 60000);
                window.__qm_min_call_by_key = {};
                window.__qm_min_put_by_key = {};
                window.__qm_last_price_by_key = {};
                window.__qm_avg_step_by_key = {};
                window.__qm_tick_buf = [];
                window.__qm_last_otc = {};
                window.__qm_sym_by_name = {};
                window.__qm_name_to_symkey = {};
                window.__qm_otc_syms = [];
                window.__qm_last_srv_msg = '';
                window.__qm_resolve = function(display, fallback) {
                  try {
                    var k = normKey(display);
                    return window.__qm_sym_by_name[k] || fallback;
                  } catch (e) { return fallback; }
                };
                function registerInstruments(list) {
                  try {
                    for (var i = 0; i < list.length; i++) {
                      var it = list[i];
                      if (!Array.isArray(it) || it.length < 3) return false;
                      var sym = it[1], name = it[2];
                      if (typeof sym !== 'string' || typeof name !== 'string') return false;
                      if (sym.toLowerCase().indexOf('_otc') === -1) continue;
                      var nk = normKey(name);
                      window.__qm_sym_by_name[nk] = sym;
                      window.__qm_name_to_symkey[nk] = normKey(sym);
                      if (window.__qm_otc_syms.indexOf(sym) === -1) window.__qm_otc_syms.push(sym);
                    }
                    return true;
                  } catch (e) { return false; }
                }

                function logTick(asset, ts, price) {
                  try {
                    const a = String(asset);
                    if (a.toLowerCase().indexOf('_otc') === -1) return;
                    if (window.__qm_last_otc[a] === price) return;
                    window.__qm_last_otc[a] = price;
                    if (window.__qm_tick_buf.length < 6000) window.__qm_tick_buf.push([a, Math.round(ts * 1000), price]);
                  } catch (e) {}
                }

                function normKey(s) {
                  return String(s || '').replace('(OTC)', 'OTC').replace('_otc', 'OTC').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                }

                function checkMinuteReset() {
                  const nowMin = Math.floor(Date.now() / 60000);
                  if (window.__qm_cur_min_bucket !== nowMin) {
                    window.__qm_cur_min_bucket = nowMin;
                    window.__qm_min_call_by_key = {};
                    window.__qm_min_put_by_key = {};
                  }
                }

                // تُستدعى عند وصول تيك حي مباشر من السيرفر خلال الدقيقة الحالية فقط
                function recordLiveStreamTick(asset, price, isHistoricalCandle) {
                  const p = parseFloat(price);
                  if (isNaN(p) || p <= 0 || !asset || typeof asset !== 'string') return;
                  const k = normKey(asset);
                  if (!k || k.length < 3) return;
                  window.__qm_active_ws_key = k;

                  checkMinuteReset();

                  // التنصت المباشر على تيكات السيرفر الحية في الدقيقة الحالية لتحليل اتجاه صانع السوق وتكدس الجمهور
                  if (!isHistoricalCandle) {
                    const prev = window.__qm_last_price_by_key[k];
                    if (typeof prev === 'number' && prev > 0 && p !== prev) {
                      const diff = p - prev;
                      const absDiff = Math.abs(diff);
                      if (!window.__qm_avg_step_by_key[k] || window.__qm_avg_step_by_key[k] <= 0) {
                        window.__qm_avg_step_by_key[k] = absDiff;
                      } else {
                        window.__qm_avg_step_by_key[k] = (window.__qm_avg_step_by_key[k] * 0.88) + (absDiff * 0.12);
                      }
                      const unit = Math.max(1e-8, window.__qm_avg_step_by_key[k]);
                      const impulseUsd = Math.round(Math.min(400.0, Math.max(18.0, (absDiff / unit) * 52.0)));
                      // في أزواج OTC: عندما يدفع السيرفر السعر للهبوط (diff < 0)، فهذا يعني أن الجمهور عالق في الشراء (CALL) وأن السيرفر يضربهم هبوطاً (PUT)!
                      // وعندما يدفع السيرفر السعر للصعود (diff > 0)، فهذا يعني أن الجمهور عالق في البيع (PUT) وأن السيرفر يضربهم صعوداً (CALL)!
                      if (diff < 0) {
                        // السيرفر يدفع السعر هبوطاً لأن الناس تكدسوا في CALL -> نزيد عداد تكدس الناس في CALL لكي يدخل البوت PUT مع السيرفر!
                        window.__qm_min_call_by_key[k] = (window.__qm_min_call_by_key[k] || 0) + impulseUsd;
                      } else if (diff > 0) {
                        // السيرفر يدفع السعر صعوداً لأن الناس تكدسوا في PUT -> نزيد عداد تكدس الناس في PUT لكي يدخل البوت CALL مع السيرفر!
                        window.__qm_min_put_by_key[k] = (window.__qm_min_put_by_key[k] || 0) + impulseUsd;
                      }
                    }
                    window.__qm_last_price_by_key[k] = p;
                  } else {
                    window.__qm_last_price_by_key[k] = p;
                  }

                  if (!window.__qm_by_norm[k]) window.__qm_by_norm[k] = [];
                  const arr = window.__qm_by_norm[k];
                  if (arr.length === 0 || arr[arr.length - 1] !== p) {
                    arr.push(p);
                    if (arr.length > 120) arr.shift();
                  }
                }

                function scanJsonForTicks(node) {
                  if (!node) return;
                  if (Array.isArray(node)) {
                    if (node.length > 0 && Array.isArray(node[0]) && node[0].length >= 3 && typeof node[0][1] === 'string' && typeof node[0][2] === 'string') {
                      if (registerInstruments(node)) return;
                    }
                    // صيغة البث الحي المباشر من السيرفر: ["EURUSD_otc", 1728918015.2, 1.08542, 0]
                    if (node.length >= 3 && typeof node[0] === 'string' && typeof node[1] === 'number' && typeof node[2] === 'number') {
                      if (node[1] > 1500000000 && node[2] > 0) {
                        logTick(node[0], node[1], node[2]);
                        recordLiveStreamTick(node[0], node[2], false);
                        return;
                      }
                    }
                    for (let i = 0; i < node.length; i++) {
                      scanJsonForTicks(node[i]);
                    }
                  } else if (typeof node === 'object') {
                    checkMinuteReset();
                    const ak = window.__qm_active_ws_key || 'DEFAULT';
                    if (typeof node.call === 'number' && typeof node.put === 'number') {
                      window.__qm_min_call_by_key[ak] = (window.__qm_min_call_by_key[ak] || 0) + Math.round(node.call * 12);
                      window.__qm_min_put_by_key[ak] = (window.__qm_min_put_by_key[ak] || 0) + Math.round(node.put * 12);
                    }
                    if (Array.isArray(node.bids) && Array.isArray(node.asks)) {
                      let bSum = 0, aSum = 0;
                      for (let i = 0; i < node.bids.length; i++) bSum += Number(node.bids[i].amount || node.bids[i][1] || 10);
                      for (let i = 0; i < node.asks.length; i++) aSum += Number(node.asks[i].amount || node.asks[i][1] || 10);
                      window.__qm_min_call_by_key[ak] = (window.__qm_min_call_by_key[ak] || 0) + Math.round(bSum);
                      window.__qm_min_put_by_key[ak] = (window.__qm_min_put_by_key[ak] || 0) + Math.round(aSum);
                    }
                    if (node.id && node.openPrice && node.asset && node.amount) {
                      window.__qm_last_order_accepted = true;
                    }
                    if (typeof node.profit === 'number') {
                      window.__qm_last_deal_profit = node.profit;
                    }
                    if (typeof node.demoBalance === 'number' && node.demoBalance > 0) {
                      window.__qm_ws_balance = node.demoBalance;
                    } else if (typeof node.balance === 'number' && node.balance > 0) {
                      window.__qm_ws_balance = node.balance;
                    }
                    // الشموع التاريخية تُستخدم لحساب مؤشر RSI والذكاء الاصطناعي فقط ولا تُضاف لسيولة الدقيقة الحالية
                    if (typeof node.asset === 'string' && Array.isArray(node.candles)) {
                      const k = normKey(node.asset);
                      window.__qm_active_ws_key = k;
                      for (let i = 0; i < node.candles.length; i++) {
