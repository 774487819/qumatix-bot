            Future<Directory?> _ensureDir() async {
              if (_dataDir != null) return _dataDir;
              try {
                _dataDir = await getApplicationDocumentsDirectory();
              } catch (_) {}
              return _dataDir;
            }

            bool get collectEnabled => _collectEnabled;
            bool get training => _training;
            String get modelInfo => _modelInfo;
            double get dataMegabytes => _dataBytes / 1048576.0;
            int get collectedPairs => _seenOtc.length;
            bool get modelActive => _model != null;

            Future<void> _initModelAndPrefs() async {
              try {
                final p = await SharedPreferences.getInstance();
                final k = p.getString('gemini_key');
                if (k != null && k.isNotEmpty) _geminiKey = k;
                _geminiModel = p.getString('gemini_model') ?? _geminiModel;
                _geminiGate = p.getBool('gemini_gate') ?? false;
              _aiProv = p.getString('ai_prov') ?? '';
              _aiName = p.getString('ai_name') ?? '';
              _modelManual = p.getBool('ai_manual') ?? false;
                _collectEnabled = p.getBool('collect_otc') ?? false;
              } catch (_) {}
              try {
                final dir = await _ensureDir();
                if (dir != null) {
                  final f = File('${dir.path}/otc_model.json');
                  if (await f.exists()) {
                    final m = _TrainedModel.fromJson(await f.readAsString());
                    if (m != null && m.valAcc >= 0.52) {
                      _model = m;
                      _aiTensorLoaded = true;
                      _modelInfo = 'نموذج محفوظ: دقة الاختبار ${(m.valAcc * 100).toStringAsFixed(1)}% (أفق ${m.horizon}ث)';
                      addLog("تم تحميل النموذج المدرَّب على أسعار OTC. $_modelInfo");
                    }
                  }
                  int bytes = 0;
                  for (final n in ['otc_ticks.csv', 'otc_ticks_old.csv']) {
                    final x = File('${dir.path}/$n');
                    if (await x.exists()) bytes += await x.length();
                  }
                  _dataBytes = bytes;
                }
              } catch (_) {}
              notifyListeners();
            }

            Future<void> setCollect(bool v) async {
              _collectEnabled = v;
              _collectBurstPending = v;
              try {
                final p = await SharedPreferences.getInstance();
                await p.setBool('collect_otc', v);
              } catch (_) {}
              addLog(v ? "بدأ جمع أسعار كل أزواج OTC من سيرفر Quotex (اشتراك جماعي كل 5 دقائق أثناء عدم وجود صفقات)" : "توقف جمع الأسعار");
            }
            void _burstSubscribeAll() {
              if (_webViewController == null || !_isConnected || _bursting) return;
              _bursting = true;
              final fallback = jsonEncode(otcPairs.map(toServerSymbol).toList());
              _webViewController!.evaluateJavascript(source: '''
                (function() {
                  try {
                    const list = (window.__qm_otc_syms && window.__qm_otc_syms.length > 0) ? window.__qm_otc_syms : $fallback;
                    let ws = null;
                    if (window.__qm_sockets) {
                      for (let i = window.__qm_sockets.length - 1; i >= 0; i--) {
                        if (window.__qm_sockets[i] && window.__qm_sockets[i].readyState === 1) { ws = window.__qm_sockets[i]; break; }
                      }
                    }
                    if (!ws) return;
                    let n = 0;
                    function step() {
                      if (n >= list.length || ws.readyState !== 1) return;
                      ws.send('42["instruments/update",{"asset":"' + list[n] + '","period":$_tradeDuration}]');
                      n++;
                      setTimeout(step, 250);
                    }
                    step();
                  } catch(e) {}
                })();
              ''');
              Future.delayed(const Duration(seconds: 70), () {
                _bursting = false;
                _subscribeServerToAsset(activeAsset);
              });
            }

            void _ingestTicks(List raw) {
              if (!_collectEnabled) return;
              for (final t in raw) {
                if (t is List && t.length == 3 && t[0] is String && t[1] is num && t[2] is num) {
                  final sym = t[0] as String;
                  if (sym.contains(',') || sym.contains('\n')) continue;
                  _seenOtc.add(sym);
                  _tickBuf.write('$sym,${(t[1] as num).toInt()},${t[2]}\n');
                }
              }
              _flushTicks();
            }

            Future<void> _flushTicks() async {
              if (_flushing || _tickBuf.isEmpty) return;
              _flushing = true;
              try {
                final dir = await _ensureDir();
                if (dir == null) return;
                final text = _tickBuf.toString();
                _tickBuf.clear();
                final f = File('${dir.path}/otc_ticks.csv');
                if (await f.exists() && await f.length() > 24 * 1024 * 1024) {
                  final old = File('${dir.path}/otc_ticks_old.csv');
                  if (await old.exists()) await old.delete();
                  await f.rename(old.path);
                }
                await File('${dir.path}/otc_ticks.csv').writeAsString(text, mode: FileMode.append);
                _dataBytes += text.length;
              } catch (_) {
              } finally {
                _flushing = false;
              }
            }

            Future<void> trainModelNow() async {
              if (_training) return;
                  await _flushTicks();
              if (_dataBytes < 60000) {
                _modelInfo = 'البيانات قليلة (${(_dataBytes / 1024).toStringAsFixed(0)} KB). اترك الجمع يعمل ساعة على الأقل ثم أعد المحاولة';
                notifyListeners();
                return;
              }
              _training = true;
              notifyListeners();
              try {
                final dir = await _ensureDir();
                if (dir == null) throw 'تعذر الوصول لمجلد التطبيق';
                final out = await compute(_trainOtcModelSync, <String, dynamic>{
                  'paths': ['${dir.path}/otc_ticks_old.csv', '${dir.path}/otc_ticks.csv'],
                  'horizon': _tradeDuration,
                });
                final j = jsonDecode(out);
                if (j is Map && j['ok'] == true) {
                  final acc = (j['val_acc'] as num).toDouble();
                  final nTest = (j['n_test'] as num).toInt();
                  _modelInfo = 'دقة الاختبار ${(acc * 100).toStringAsFixed(1)}% على $nTest عينة (${j['n_train']} للتدريب، أفق ${j['horizon']}ث)';
                  if (acc >= 0.52 && nTest >= 500) {
                    await File('${dir.path}/otc_model.json').writeAsString(out);
                    _model = _TrainedModel.fromJson(out);
                    _aiTensorLoaded = _model != null;
                    addLog("تم تدريب النموذج على أسعار OTC وتفعيله: $_modelInfo");
                  } else {
                    addLog("اكتمل التدريب لكن النموذج لا يتفوق على الصدفة فلم يُفعَّل: $_modelInfo");
