                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(ctx),
                      child: const Text("إلغاء"),
                    ),
                    ElevatedButton(
                      onPressed: () {
                        final tok = _manualTokenController.text.trim();
                        Navigator.pop(ctx);
                        if (tok.isNotEmpty) {
                          service.connect(
                            ssidToken: tok,
                            isRealAccount: _isRealAccount,
                            domain: _selectedDomain,
                          );
                        }
                      },
                      child: const Text("اتصال بالسيرفر"),
                    ),
                  ],
                ),
              );
            }

            void _syncSettingsToService(QuotexService service) {
              service.updateSettings(
